name: B-01 주간 추천도서 취합

on:
  schedule:
    # GitHub Actions 의 schedule 은 timezone 키를 지원하지 않는다 - cron 은 항상 UTC 로 해석된다.
    # 이전에 붙어 있던 timezone: "Asia/Seoul" 은 무시되고 있었다.
    # 아래 UTC 월요일 03:00 = KST 월요일 12:00 (지금까지 실제로 돌던 시각 그대로).
    # 새벽에 돌리려면 "0 21 * * 0"(UTC 일요일 21:00 = KST 월요일 06:00)으로 바꾼다.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-weekly-acquisition-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 수집 파서 테스트
        run: npm run test:harvest

      - name: 추천도서 취합 및 후보 풀 적재
        run: npm run harvest:acquisition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEOJI_API_KEY_NL_DIRECT: ${{ secrets.SEOJI_API_KEY_NL_DIRECT }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          B01_HARVEST_MIN_SUCCESS: "40"
          B01_HARVEST_PARTIAL_SUCCESS: "30"
          B01_HARVEST_MAX_STORED: "50"
