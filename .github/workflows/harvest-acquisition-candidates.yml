name: B-01 주간 추천도서 취합

on:
  schedule:
    - cron: "0 3 * * 1"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-weekly-acquisition-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 추천도서 취합 및 후보 풀 적재
        run: npm run harvest:acquisition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEOJI_API_KEY_NL_DIRECT: ${{ secrets.SEOJI_API_KEY_NL_DIRECT }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
