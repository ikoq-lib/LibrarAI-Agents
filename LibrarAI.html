              {sidebarBtn("FN-01 행사 요건 확인",   () => sendMessage("강사가 필요한 행사 정보를 정리해주세요. 어떤 항목이 필요한지 안내해줘."))}
              {sidebarBtn("FN-02 강사 DB 탐색",    () => sendMessage("강사 DB를 탐색해주세요. 강사 목록 데이터를 붙여넣겠습니다."))}
              {sidebarBtn("FN-03 웹 검색 탐색",    () => sendMessage("강사 DB에 적합한 후보가 없어요. 웹 검색을 통한 강사 탐색 방법을 안내해줘."))}
              {sidebarSectionLabel("섭외 진행")}
              {sidebarBtn("FN-04 후보 목록 보기",   () => sendMessage("강사 후보 목록을 정리해서 보여줘."))}
              {sidebarBtn("FN-05 섭외 문자 초안",   () => sendMessage("선택한 강사에게 보낼 섭외 문자 초안을 작성해줘."))}
              {sidebarBtn("FN-05 섭외 이메일 초안", () => sendMessage("선택한 강사에게 보낼 섭외 이메일 초안을 공식 서식으로 작성해줘."))}
              {sidebarSectionLabel("결과 처리")}
              {sidebarBtn("FN-06 수락 결과 기록",   () => sendMessage("강사가 섭외를 수락했습니다. DB 업데이트 내용을 정리해줘."))}
              {sidebarBtn("FN-06 거절 결과 처리",   () => sendMessage("강사가 거절했습니다. 차순위 후보 섭외 진행 방법을 안내해줘."))}
              {sidebarBtn("⏳ FN-06 미응답 처리",      () => sendMessage("강사에게 연락했는데 아직 응답이 없어요. 재연락 일정을 안내해줘."))}
            </>
          ) : activeTab === "d06-mobile-library" ? (
            <>
              {sidebarSectionLabel("기관·도서 선정")}
              {sidebarBtn("FN-01 기관 정보 등록",   () => sendMessage("순회문고 참여 기관을 새로 등록하려고 합니다. 어떤 정보가 필요한지 안내해줘."))}
              {sidebarBtn("FN-02 도서 선정 초안",   () => sendMessage("다음 회차 배치 도서 선정 초안을 만들어주세요. 대출 내역 데이터를 붙여넣겠습니다."))}
              {sidebarSectionLabel("일정·운영")}
              {sidebarBtn("FN-03 배치·회수 일정",   () => sendMessage("이번 달 배치·회수 예정 일정을 알려줘."))}
              {sidebarBtn("FN-04 운영일지 초안",     () => sendMessage("이번 회차 운영일지 초안을 작성해주세요. 필요한 정보를 알려주세요."))}
              {sidebarBtn("FN-05 관리대장 갱신",     () => sendMessage("배치·회수가 완료됐습니다. 관리대장 갱신 내용을 정리해주세요."))}
              {sidebarSectionLabel("홍보")}
              {sidebarBtn("FN-06 모집 게시글 초안", () => sendMessage("순회문고 참여 기관 모집 게시글 초안을 작성해주세요."))}
            </>
          ) : (
            /* ll-result-reporter */
            <>
              {sidebarSectionLabel("결과보고")}
              {sidebarBtn("E-04 인계 데이터 수신",  () => sendMessage("E-04로부터 운영 실적 데이터를 인계받았습니다. 데이터를 입력하겠습니다."))}
              {sidebarBtn("시즌 결과보고서 작성",    () => sendMessage("이번 시즌 평생학습 프로그램 결과보고서 초안을 작성해주세요."))}
              {sidebarBtn("연간 누계 보고서",        () => sendMessage("올해 평생학습 연간 결과 누계 보고서를 작성해주세요."))}
              {sidebarBtn("E-01 피드백 인계",       () => sendMessage("이번 시즌 결과 데이터를 E-01 강좌기획 에이전트에 피드백으로 인계해주세요."))}
            </>
          )}
          {currentAgentDomain && currentAgentDomain.agents.length > 1 && (
            <>
              {sidebarSectionLabel("같은 도메인 에이전트")}
              <div style={{ display: "flex", flexWrap: "wrap", gap: "5px", padding: "0 6px" }}>
                {currentAgentDomain.agents.filter(a => a.id !== activeTab).map(a => (
                  <span key={a.id} onClick={() => goAgent(a.id)} className="code-chip" style={{ cursor: "pointer" }}>{codeFor(a.id)}</span>
                ))}
              </div>
            </>
          )}
        </div>
      );

      // ── 총괄 진행 패널: chief 디스패치 실행 현황(디스패치·리프·escalation) ──
      const CHIEF_RUN_STATUS = {
        running:     { label: "도메인 조회 중",     cls: " is-running" },
        compiling:   { label: "통합 문서 작성 중",  cls: " is-running" },
        done:        { label: "완료",               cls: " is-done" },
        cancelled:   { label: "중단됨",             cls: "" },
        error:       { label: "오류",               cls: " is-review" },
        interrupted: { label: "새로고침으로 중단",  cls: " is-review" },
      };
      const CHIEF_STEP_STATUS = {
        pending: { label: "대기",    cls: "" },
        running: { label: "수집 중", cls: " is-running" },
        done:    { label: "완료",    cls: " is-done" },
        error:   { label: "실패",    cls: " is-review" },
      };
      const renderChiefRunPanel = (run, runId) => {
        if (!run) return (
          <div style={{ border: "1px dashed var(--line-strong)", borderRadius: "var(--radius-card)", padding: "12px 14px", fontSize: "12px", color: "var(--faint)" }}>
            실행 정보를 불러올 수 없습니다.
          </div>
        );
        const rs = CHIEF_RUN_STATUS[run.status] || { label: run.status, cls: "" };
        const running = run.status === "running" || run.status === "compiling";
        const scopeLabel = { monthly: "월간 계획", weekly: "주간 계획", event: "행사 실적", adhoc: "수시 지시" }[run.scope] || run.scope;
        const periodLabel = run.event_name || run.target_period || "";
        return (
          <div style={{ border: "1px solid var(--line)", borderRadius: "var(--radius-card)", background: "var(--bg-elevated)", overflow: "hidden" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "8px", padding: "11px 14px", borderBottom: "1px solid var(--line-soft)", background: "var(--bg-sunken)" }}>
              <span style={{ fontSize: "12px", fontWeight: "700", color: "var(--ink)" }}>실행 현황</span>
              <span style={{ fontSize: "11.5px", color: "var(--muted)" }}>{scopeLabel}{periodLabel ? " · " + periodLabel : ""}</span>
              <span className={"status-badge" + rs.cls}>{rs.label}</span>
              {running && (
                <button onClick={cancelChiefRun}
                  style={{ marginLeft: "auto", border: "1px solid var(--line-strong)", background: "var(--surface)", color: "var(--muted)", borderRadius: "var(--radius-pill)", padding: "3px 12px", fontSize: "11.5px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit" }}
                >■ 중단</button>
              )}
            </div>
            <div style={{ padding: "10px 14px", display: "flex", flexDirection: "column", gap: "8px" }}>
              {run.dispatches.map((d, i) => {
                const ds = CHIEF_STEP_STATUS[d.status] || { label: d.status, cls: "" };
                const dispKey = runId + ":" + i;
                const open = expandedDispatch === dispKey;
                const hasBody = !!(d.resultText && d.resultText.trim());
                return (
                  <div key={i} style={{ border: "1px solid var(--line-soft)", borderRadius: "9px", background: "var(--surface)", padding: "9px 11px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "7px", flexWrap: "wrap" }}>
                      <span className="code-chip">{codeFor(d.agent)}</span>
                      <span style={{ fontSize: "12.5px", fontWeight: "600", color: "var(--ink)" }}>{nameFor(d.agent)}</span>
                      <span className={"status-badge" + ds.cls}>{ds.label}</span>
                      {d.escalations && d.escalations.length > 0 && (
                        <span className="status-badge is-review">⚠ 확인 {d.escalations.length}</span>
                      )}
                      {hasBody && (
                        <button onClick={() => setExpandedDispatch(open ? null : dispKey)}
                          style={{ marginLeft: "auto", border: "none", background: "transparent", color: "var(--accent)", fontSize: "11.5px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit" }}
                        >{open ? "접기 ▲" : "전문 보기 ▼"}</button>
                      )}
                    </div>
                    <div style={{ fontSize: "11.5px", color: "var(--muted)", marginTop: "4px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: open ? "normal" : "nowrap" }}>{d.instruction}</div>
                    {d.leafSteps && d.leafSteps.length > 0 && (
                      <div style={{ marginTop: "7px", paddingLeft: "10px", borderLeft: "2px solid var(--line)", display: "flex", flexDirection: "column", gap: "4px" }}>
                        {d.leafSteps.map((ls, li) => {
                          const lss = CHIEF_STEP_STATUS[ls.status] || { label: ls.status, cls: "" };
                          return (
                            <div key={li} style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                              <span className="code-chip">{codeFor(ls.agentId)}</span>
                              <span style={{ fontSize: "11.5px", color: "var(--muted)", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ls.summary || nameFor(ls.agentId)}</span>
                              <span className={"status-badge" + lss.cls}>{lss.label}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {open && hasBody && (
                      <div style={{ marginTop: "8px", paddingTop: "8px", borderTop: "1px solid var(--line-soft)", fontSize: "13px", lineHeight: "1.7", color: "var(--ink)" }}>
                        <MarkdownRenderer text={d.resultText} />
                        {d.escalations && d.escalations.length > 0 && (
                          <div style={{ marginTop: "8px", display: "flex", flexDirection: "column", gap: "4px" }}>
                            {d.escalations.map((e, ei) => (
                              <div key={ei} style={{ fontSize: "11.5px", color: e.urgency === "urgent" ? "var(--warn)" : "var(--muted)" }}>
                                {e.urgency === "urgent" ? "⚠ 긴급 · " : "· "}{e.item}{e.source_leaf ? ` (${e.source_leaf})` : ""}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {run.self_tasks && run.self_tasks.length > 0 && (
                <div style={{ border: "1px dashed var(--line-strong)", borderRadius: "9px", padding: "8px 11px", fontSize: "11.5px", color: "var(--muted)" }}>
                  <span style={{ fontWeight: "700", color: "var(--ink)" }}>chief 직접 처리</span>
                  <span style={{ marginLeft: "6px" }}>{run.self_tasks.join(" · ")}</span>
                </div>
              )}
            </div>
          </div>
        );
      };

      // 어시스턴트 응답의 확인필요 미니 노트를 경고색 카드로, 나머지 본문을 마크다운으로 렌더
      const renderChiefAssistant = (msg) => {
        const { notes, body } = splitConfirmNotes(msg.content || "");
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {notes.map((note, ni) => (
              <div key={"n" + ni} style={{ border: "1px solid var(--warn)", background: "var(--warn-tint)", borderRadius: "10px", padding: "11px 13px" }}>
                <div style={{ fontSize: "11.5px", fontWeight: "800", color: "var(--warn)", marginBottom: "5px", letterSpacing: "0.3px" }}>⚠ 확인 필요 — 수시 미니 노트</div>
                <div style={{ fontSize: "13px", lineHeight: "1.65", color: "var(--ink)", whiteSpace: "pre-wrap" }}>{note}</div>
              </div>
            ))}
            {(body || msg.streaming) && (
              <div style={{ fontSize: "14px", lineHeight: "1.75", color: "var(--ink)", minWidth: 0 }}>
                {!msg.streaming && body.includes("===보고서시작===")
                  ? <ReportDocument content={body} />
                  : <MarkdownRenderer text={body} />}
                {msg.streaming && <span className="stream-cursor">▊</span>}
              </div>
            )}
          </div>
        );
      };

      // ── 홈: 총괄 지시 콘솔(chief-coordinator 채팅, v4 단일 접점) ──
      const renderHomeConsole = () => {
        const today = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
        const isLanding = chiefMsgs.length <= 1; // 초기 인사말만 있는 상태
        // 초기 인사말 외에 실제로 주고받은 대화가 있는 탭만 "진행 중인 대화"로 노출한다.
        const activeSessions = Object.entries(tabActivity)
          .map(([tabId, ts]) => ({ tabId, ts, msgs: getTabMessages(tabId) }))
          .filter(x => x.msgs && x.msgs.length > 1)
          .sort((a, b) => new Date(b.ts) - new Date(a.ts));
        const quickActions = [
          ["이번달 업무 계획", "이번달 업무 계획을 제출해줘."],
          ["이번 주 업무 계획", "이번 주 업무 계획을 제출해줘."],
          ["이번달 실적 보고", "이번달 업무 실적 결과보고를 해줘."],
        ];
        const handleChiefKeyDown = (e) => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChiefMessage(); }
        };
        return (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            {/* 채팅 스레드 */}
            <div style={{ flex: 1, overflowY: "auto", padding: "30px 40px 20px" }}>
              <div style={{ maxWidth: "820px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "22px" }}>
                {isLanding && (
                  <div>
                    <div style={{ fontSize: "12.5px", color: "var(--muted)", marginBottom: "8px" }}>{today}</div>
                    <div style={{ fontSize: "23px", fontWeight: "800", letterSpacing: "-0.4px", color: "var(--ink)" }}>무엇을 처리할까요, 기획담당님?</div>
                  </div>
                )}
                {chiefMsgs.map((msg, i) => {
                  if (msg.kind === "execution") {
                    return <div key={i}>{renderChiefRunPanel(chiefRuns[msg.runId], msg.runId)}</div>;
                  }
                  if (msg.kind === "aggregate") {
                    return (
                      <details key={i} style={{ background: "var(--bg-sunken)", border: "1px solid var(--line-soft)", borderRadius: "10px", padding: "8px 12px" }}>
                        <summary style={{ fontSize: "11.5px", color: "var(--faint)", cursor: "pointer", listStyle: "none", userSelect: "none" }}>집계 결과 (시스템 자동 주입) · 펼치기</summary>
                        <div style={{ fontSize: "12px", lineHeight: "1.65", color: "var(--muted)", whiteSpace: "pre-wrap", marginTop: "8px" }}>{msg.content}</div>
                      </details>
                    );
                  }
                  if (msg.role === "user") {
                    return (
                      <div key={i} style={{ display: "flex", justifyContent: "flex-end" }}>
                        <div style={{ maxWidth: "78%", padding: "12px 16px", borderRadius: "12px", background: "var(--accent-tint)", color: "#1C3B31", fontSize: "14px", lineHeight: "1.7", whiteSpace: "pre-wrap" }}>{msg.content}</div>
                      </div>
                    );
                  }
                  return (
                    <div key={i} style={{ display: "flex", gap: "12px", alignItems: "flex-start" }}>
                      <span className="code-chip is-active" style={{ flexShrink: 0, marginTop: "3px" }}>CC</span>
                      <div style={{ flex: 1, minWidth: 0 }}>{renderChiefAssistant(msg)}</div>
                    </div>
                  );
                })}
                {chiefLoading && !chiefMsgs.some(m => m.streaming) && (
                  <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                    <span className="code-chip is-active" style={{ flexShrink: 0 }}>CC</span>
                    <div style={{ display: "flex", gap: "5px", alignItems: "center" }}>
                      {[0,1,2].map(n => (
                        <div key={n} style={{ width: "6px", height: "6px", borderRadius: "50%", background: "var(--accent)", opacity: 0.6, animation: "bounce 1.2s infinite", animationDelay: (n * 0.2) + "s" }} />
                      ))}
                    </div>
                  </div>
                )}
                <div ref={chiefBottomRef} />
              </div>
            </div>

            {/* 입력 영역 */}
            <div style={{ padding: "10px 40px 22px", background: "var(--bg)" }}>
              <div style={{ maxWidth: "820px", margin: "0 auto" }}>
                <div style={{ display: "flex", gap: "7px", flexWrap: "wrap", marginBottom: "10px" }}>
                  {quickActions.map(([label, cmd]) => (
                    <button key={label} onClick={() => sendChiefMessage(cmd)} disabled={chiefLoading}
                      style={{ border: "1px solid var(--line)", background: "var(--surface)", color: chiefLoading ? "var(--faint)" : "var(--accent)", borderRadius: "var(--radius-pill)", padding: "6px 13px", fontSize: "12px", fontWeight: "700", cursor: chiefLoading ? "not-allowed" : "pointer", fontFamily: "inherit" }}
                    >{label}</button>
                  ))}
                  {activeSessions.length > 0 && (
                    <span style={{ marginLeft: "auto" }} />
                  )}
                </div>
                <div style={{ display: "flex", gap: "8px", alignItems: "flex-end", background: "var(--surface)", borderRadius: "var(--radius-card)", padding: "10px 10px 10px 16px", border: "1px solid var(--line)", boxShadow: "var(--shadow-card)" }}>
                  <textarea
                    ref={chiefInputRef}
                    value={chiefInput}
                    onChange={e => setChiefInput(e.target.value)}
                    onKeyDown={handleChiefKeyDown}
                    placeholder="총괄 지시를 입력하세요 — 담당 에이전트 선정은 chief-coordinator가 판단합니다. (Shift+Enter: 줄바꿈)"
                    rows={1}
                    disabled={chiefLoading}
                    style={{ flex: 1, minWidth: 0, border: "none", background: "transparent", resize: "none", outline: "none", fontSize: "14px", lineHeight: "1.6", fontFamily: "inherit", color: "var(--ink)", maxHeight: "120px", overflowY: "auto", padding: "6px 0" }}
                  />
                  <button
                    onClick={() => sendChiefMessage()}
                    disabled={chiefLoading || !chiefInput.trim()}
                    style={{ width: "32px", height: "32px", borderRadius: "var(--radius-btn)", border: "none", background: (chiefLoading || !chiefInput.trim()) ? "var(--line-strong)" : "var(--accent)", color: "white", cursor: (chiefLoading || !chiefInput.trim()) ? "not-allowed" : "pointer", fontSize: "14px", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                  >↑</button>
                </div>

                {/* 지난 기록 · 진행 중인 대화 (참고용, 접이식) */}
                {(activeSessions.length > 0 || plans.length > 0) && (
                  <details style={{ marginTop: "12px" }}>
                    <summary style={{ fontSize: "11.5px", fontWeight: "700", letterSpacing: "0.3px", color: "var(--faint)", cursor: "pointer", userSelect: "none" }}>
                      진행 중인 대화 {activeSessions.length > 0 ? activeSessions.length : 0}{plans.length > 0 ? ` · 지난 작업 기록 ${plans.length}` : ""}
                    </summary>
                    <div style={{ marginTop: "10px", display: "flex", flexDirection: "column", gap: "10px" }}>
                      {activeSessions.length > 0 && (
                        <div style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-card)", overflow: "hidden" }}>
                          {activeSessions.map((s, i) => {
                            const lastMsg = [...s.msgs].reverse().find(m => m.role === "assistant") || s.msgs[s.msgs.length - 1];
                            return (
                              <button key={s.tabId} onClick={() => goAgent(s.tabId)}
                                style={{ width: "100%", display: "flex", alignItems: "center", gap: "10px", padding: "10px 14px", border: "none", borderBottom: i < activeSessions.length - 1 ? "1px solid var(--line-soft)" : "none", background: "transparent", cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                                <span className="code-chip">{codeFor(s.tabId)}</span>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div style={{ fontSize: "12.5px", fontWeight: "600", color: "var(--ink)" }}>{nameFor(s.tabId)}</div>
                                  <div style={{ fontSize: "11px", color: "var(--faint)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{summarizeReply(lastMsg ? lastMsg.content : "")}</div>
                                </div>
                                <span style={{ fontSize: "10.5px", color: "var(--faint)", flexShrink: 0 }}>{new Date(s.ts).toLocaleString("ko-KR")}</span>
                                <span onClick={(e) => { e.stopPropagation(); resetCurrent(s.tabId); }} title="완료 처리"
                                  style={{ width: "20px", height: "20px", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--faint)", cursor: "pointer", fontSize: "13px", borderRadius: "50%", flexShrink: 0 }}
                                >×</span>
                              </button>
                            );
                          })}
                        </div>
                      )}
                      {plans.length > 0 && (
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: "12px" }}>
                          {plans.map(plan => {
                            const hasReview = plan.steps.some(s => s.status === "needs_review");
                            const allDone = plan.steps.every(s => s.status === "done");
                            const firstAgent = plan.steps[0] && plan.steps[0].agentId;
                            return (
                              <div key={plan.id} onClick={() => goPlan(plan.id)} className="agent-card" role="button" tabIndex={0}
                                style={{ position: "relative", textAlign: "left", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-card)", padding: "14px", cursor: "pointer", fontFamily: "inherit", transition: "transform 0.15s ease, box-shadow 0.15s ease" }}>
                                <button onClick={(e) => { e.stopPropagation(); deletePlan(plan.id); }} title="삭제"
                                  style={{ position: "absolute", top: "8px", right: "8px", width: "22px", height: "22px", display: "flex", alignItems: "center", justifyContent: "center", border: "none", background: "transparent", color: "var(--faint)", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", borderRadius: "50%" }}
                                >×</button>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "8px", paddingRight: "20px" }}>
                                  <span className="code-chip is-active">{codeFor(firstAgent)}</span>
                                  <span className={"status-badge" + (hasReview ? " is-review" : allDone ? " is-done" : " is-running")}>{hasReview ? "확인 필요" : allDone ? "완료" : "진행 중"}</span>
                                </div>
                                <div style={{ fontSize: "13px", fontWeight: "700", color: "var(--ink)", marginBottom: "5px" }}>{plan.title}</div>
                                <div style={{ fontSize: "11.5px", color: "var(--muted)" }}>{plan.steps.length}개 에이전트 · {plan.steps.filter(s => s.status === "done").length}/{plan.steps.length} 단계</div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </details>
                )}
              </div>
            </div>
          </div>
        );
      };

      // ── 계획 상세: 세로 실행 타임라인 ──
      const renderPlanDetail = () => {
        if (!selectedPlan) {
          return (
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--muted)", fontSize: "13px", gap: "8px" }}>
              계획을 찾을 수 없습니다.
              <button onClick={goHome} style={{ color: "var(--accent)", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: "700" }}>홈으로</button>
            </div>
          );
        }
        const plan = selectedPlan;
        const doneCount = plan.steps.filter(s => s.status === "done").length;
        const hasReview = plan.steps.some(s => s.status === "needs_review");
        const allDone = doneCount === plan.steps.length;
        const planIsRunning = plan.steps.some(s => s.status === "running");
        return (
          <div style={{ flex: 1, overflowY: "auto", padding: "30px 40px 56px" }}>
            <div style={{ maxWidth: "720px", margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "22px", flexWrap: "wrap" }}>
                <span style={{ fontSize: "12px", color: "var(--muted)" }}>
                  <span onClick={goHome} style={{ cursor: "pointer" }}>총괄 지시</span> / {plan.title}
                </span>
                <span className={"status-badge" + (hasReview ? " is-review" : allDone ? " is-done" : " is-running")}>
                  {hasReview ? "확인 필요" : allDone ? "완료" : `실행 중 · ${doneCount}/${plan.steps.length} 단계`}
                </span>
                <button style={{ marginLeft: "auto", padding: "6px 12px", border: "1px solid var(--line)", background: "none", borderRadius: "var(--radius-btn)", fontSize: "12px", color: "var(--muted)", cursor: "pointer", fontFamily: "inherit" }}>⏸ 일시 정지</button>
                <button onClick={() => deletePlan(plan.id)} style={{ padding: "6px 12px", border: "1px solid var(--line)", background: "none", borderRadius: "var(--radius-btn)", fontSize: "12px", color: "var(--warn, #B3542B)", cursor: "pointer", fontFamily: "inherit" }}>🗑 삭제</button>
              </div>

              <div style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-card)", padding: "16px 18px", marginBottom: "26px", display: "flex", gap: "12px" }}>
                <span style={{ width: "26px", height: "26px", borderRadius: "50%", background: "var(--accent-soft)", color: "var(--accent)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "12px", fontWeight: "700", flexShrink: 0 }}>지</span>
                <div>
                  <div style={{ fontSize: "13.5px", color: "var(--ink)", lineHeight: "1.6" }}>"{plan.command}"</div>
                  <div style={{ fontSize: "11.5px", color: "var(--faint)", marginTop: "6px" }}>{new Date(plan.createdAt).toLocaleString("ko-KR")}</div>
                </div>
              </div>

              <div>
                {plan.steps.map((step, i) => {
                  const isLast = i === plan.steps.length - 1;
                  const nodeState = step.status === "done" ? "done" : step.status === "running" ? "running" : step.status === "needs_review" ? "review" : "pending";
                  return (
                    <div key={i} style={{ display: "flex", gap: "16px" }}>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "26px", flexShrink: 0 }}>
                        <div style={{
                          width: "26px", height: "26px", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: "11px", fontWeight: "700", flexShrink: 0,
                          background: (nodeState === "done" || nodeState === "running") ? "var(--accent)" : nodeState === "review" ? "var(--warn)" : "var(--surface)",
                          color: nodeState === "pending" ? "var(--faint)" : "white",
                          border: nodeState === "pending" ? "2px solid var(--line-strong)" : "none",
                          boxShadow: nodeState === "running" ? "0 0 0 4px var(--accent-tint)" : "none",
                        }}>
                          {nodeState === "done" ? "✓" : i + 1}
                        </div>
                        {!isLast && <div style={{ width: "2px", flex: 1, minHeight: "28px", background: nodeState === "done" ? "var(--accent)" : "#D9DDD4", marginTop: "2px" }} />}
                      </div>
                      <div style={{ flex: 1, paddingBottom: "22px" }}>
                        <div style={{
                          background: nodeState === "pending" ? "#F9F9F6" : "var(--surface)",
                          border: nodeState === "running" ? "1.5px solid var(--accent)" : nodeState === "pending" ? "1px dashed var(--line-strong)" : "1px solid var(--line)",
                          borderRadius: "var(--radius-card)", padding: "14px 16px",
                          boxShadow: nodeState === "running" ? "var(--shadow-card-accent)" : "var(--shadow-card)",
                        }}>
                          <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px", flexWrap: "wrap" }}>
                            <span className="code-chip is-active">{codeFor(step.agentId)}</span>
                            <span style={{ fontSize: "13.5px", fontWeight: "800", color: "var(--ink)" }}>{step.label}</span>
                            {step.routedBy && (
                              <span style={{ fontSize: "11px", color: "var(--faint)" }}>· {codeFor(step.routedBy)} 위임</span>
                            )}
                            <span className={"status-badge" + (nodeState === "done" ? " is-done" : nodeState === "running" ? " is-running" : nodeState === "review" ? " is-review" : "")} style={{ marginLeft: "auto" }}>
                              {nodeState === "done" ? "완료" : nodeState === "running" ? "진행 중" : nodeState === "review" ? (step.isError ? "오류" : "확인 필요") : "대기"}
                            </span>
                            {(nodeState === "done" || nodeState === "review") && step.result && (
                              <button onClick={() => setExpandedStep(prev => prev === (plan.id + ":" + i) ? null : (plan.id + ":" + i))}
                                style={{ background: "none", border: "none", color: "var(--accent)", fontSize: "12px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit" }}>
                                {expandedStep === (plan.id + ":" + i) ? "접기 ‹" : "결과 보기 ›"}
                              </button>
                            )}
                            {nodeState === "done" && (
                              <button onClick={() => { setRevisingStep(prev => prev === (plan.id + ":" + i) ? null : (plan.id + ":" + i)); setExpandedStep(plan.id + ":" + i); }}
                                disabled={planIsRunning}
                                title={planIsRunning ? "다른 단계가 진행 중일 때는 수정할 수 없습니다" : "이 단계 결과에 수정 지시를 보냅니다"}
                                style={{ background: "none", border: "none", color: planIsRunning ? "var(--faint)" : "var(--muted)", fontSize: "12px", fontWeight: "700", cursor: planIsRunning ? "not-allowed" : "pointer", fontFamily: "inherit" }}>
                                ✎ 수정 요청
                              </button>
                            )}
                          </div>
                          <div style={{ fontSize: "12.5px", color: "var(--muted)" }}>{step.summary}</div>
                          {nodeState === "pending" && (
                            <div style={{ fontSize: "11.5px", color: "var(--faint)", marginTop: "6px" }}>이전 단계 완료 후 자동 시작</div>
                          )}
                          {nodeState === "review" && (
                            <div style={{ marginTop: "10px", background: "var(--warn-tint)", border: "1px solid var(--warn-border)", borderRadius: "9px", padding: "10px 12px", display: "flex", alignItems: "center", gap: "10px" }}>
                              <span style={{ fontSize: "13px" }}>⚠</span>
                              <span style={{ flex: 1, fontSize: "12.5px", fontWeight: "700", color: "var(--warn)" }}>
                                {step.isError ? "오류가 발생했습니다. 결과를 확인 후 재시도해주세요." : "사서 확인이 필요합니다."}
                              </span>
                              {step.isError ? (
                                <button onClick={() => retryStep(plan.id, i)} style={{ background: "var(--warn)", color: "white", border: "none", borderRadius: "6px", padding: "5px 10px", fontSize: "11.5px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit" }}>재시도</button>
                              ) : (
                                <button onClick={() => approveStep(plan.id, i)} style={{ background: "var(--warn)", color: "white", border: "none", borderRadius: "6px", padding: "5px 10px", fontSize: "11.5px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit" }}>확인 완료 · 다음 단계</button>
                              )}
                            </div>
                          )}
                          {nodeState === "review" && !step.isError && (() => {
                            const draftKey = plan.id + ":" + i;
                            const draftVal = replyDrafts[draftKey] || "";
                            const sendReply = () => {
                              if (!draftVal.trim()) return;
                              replyToStep(plan.id, i, draftVal);
                              setReplyDrafts(prev => ({ ...prev, [draftKey]: "" }));
                              const el = stepInputRefs.current[draftKey];
                              if (el) el.style.height = "auto";
                            };
                            return (
                              <div style={{ marginTop: "8px", display: "flex", gap: "8px", alignItems: "flex-end", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-btn)", padding: "6px 6px 6px 12px" }}>
                                <textarea
                                  ref={el => { stepInputRefs.current[draftKey] = el; }}
                                  rows={1}
                                  value={draftVal}
                                  onChange={e => { setReplyDrafts(prev => ({ ...prev, [draftKey]: e.target.value })); autoGrow(e); }}
                                  onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); } }}
                                  placeholder={`${step.label}에게 답변 보내기… (Shift+Enter: 줄바꿈)`}
                                  style={{ flex: 1, minWidth: 0, border: "none", outline: "none", resize: "none", fontSize: "12.5px", lineHeight: "1.5", fontFamily: "inherit", background: "transparent", color: "var(--ink)", maxHeight: "120px", overflowY: "auto", padding: "4px 0" }}
                                />
                                <button onClick={sendReply} disabled={!draftVal.trim()}
                                  style={{ padding: "5px 10px", borderRadius: "6px", border: "none", background: draftVal.trim() ? "var(--accent)" : "var(--line-strong)", color: "white", fontSize: "11.5px", fontWeight: "700", cursor: draftVal.trim() ? "pointer" : "not-allowed", fontFamily: "inherit", flexShrink: 0 }}
                                >답변 보내기</button>
                              </div>
                            );
                          })()}
                          {expandedStep === (plan.id + ":" + i) && step.result && (
                            <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: "1px solid var(--line-soft)", fontSize: "13.5px", lineHeight: "1.75", color: "var(--ink)" }}>
                              {(step.result.includes("===기안문시작===") || step.result.includes("===첨부시작===") || step.result.includes("===엑셀시작==="))
                                ? <TabbedDocument content={step.result} />
                                : <MarkdownRenderer text={step.result} />}
                            </div>
                          )}
                          {nodeState === "done" && revisingStep === (plan.id + ":" + i) && (() => {
                            const draftKey = plan.id + ":revise:" + i;
                            const draftVal = replyDrafts[draftKey] || "";
                            const isLastStep = i === plan.steps.length - 1;
                            const sendRevision = () => {
                              if (!draftVal.trim()) return;
                              replyToStep(plan.id, i, draftVal);
                              setReplyDrafts(prev => ({ ...prev, [draftKey]: "" }));
                              setRevisingStep(null);
                              const el = stepInputRefs.current[draftKey];
                              if (el) el.style.height = "auto";
                            };
                            return (
                              <div style={{ marginTop: "10px", paddingTop: "12px", borderTop: "1px solid var(--line-soft)" }}>
                                {!isLastStep && (
                                  <div style={{ fontSize: "11.5px", color: "var(--warn)", marginBottom: "8px" }}>
                                    ⚠ 이 단계를 수정하면 이후 {plan.steps.length - 1 - i}개 단계는 새 결과를 반영해 다시 실행됩니다.
                                  </div>
                                )}
                                <div style={{ display: "flex", gap: "8px", alignItems: "flex-end", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-btn)", padding: "6px 6px 6px 12px" }}>
                                  <textarea
                                    ref={el => { stepInputRefs.current[draftKey] = el; }}
                                    rows={1}
                                    value={draftVal}
                                    onChange={e => { setReplyDrafts(prev => ({ ...prev, [draftKey]: e.target.value })); autoGrow(e); }}
                                    onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendRevision(); } }}
                                    placeholder={`${step.label} 결과에 수정 지시 보내기… (Shift+Enter: 줄바꿈)`}
                                    style={{ flex: 1, minWidth: 0, border: "none", outline: "none", resize: "none", fontSize: "12.5px", lineHeight: "1.5", fontFamily: "inherit", background: "transparent", color: "var(--ink)", maxHeight: "120px", overflowY: "auto", padding: "4px 0" }}
                                    autoFocus
                                  />
                                  <button onClick={sendRevision} disabled={!draftVal.trim()}
                                    style={{ padding: "5px 10px", borderRadius: "6px", border: "none", background: draftVal.trim() ? "var(--accent)" : "var(--line-strong)", color: "white", fontSize: "11.5px", fontWeight: "700", cursor: draftVal.trim() ? "pointer" : "not-allowed", fontFamily: "inherit", flexShrink: 0 }}
                                  >수정 요청 보내기</button>
                                </div>
                              </div>
                            );
                          })()}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {(() => {
                const draftKey = plan.id + ":bottom";
                const draftVal = replyDrafts[draftKey] || "";
                const lastIndex = plan.steps.length - 1;
                const anyRunning = plan.steps.some(s => s.status === "running");
                const canSend = !!draftVal.trim() && !anyRunning;
                const sendBottomReply = () => {
                  if (!canSend) return;
                  replyToStep(plan.id, lastIndex, draftVal);
                  setReplyDrafts(prev => ({ ...prev, [draftKey]: "" }));
                  const el = stepInputRefs.current[draftKey];
                  if (el) el.style.height = "auto";
                };
                return (
                  <div style={{ marginTop: "8px", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-card)", padding: "6px 6px 6px 14px", display: "flex", alignItems: "flex-end", gap: "8px", boxShadow: "var(--shadow-card)" }}>
                    <textarea
                      ref={el => { stepInputRefs.current[draftKey] = el; }}
                      rows={1}
                      value={draftVal}
                      onChange={e => { setReplyDrafts(prev => ({ ...prev, [draftKey]: e.target.value })); autoGrow(e); }}
                      onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBottomReply(); } }}
                      disabled={anyRunning}
                      placeholder={anyRunning ? "실행 중입니다… 완료 후 추가 지시할 수 있어요" : "이 계획에 추가 지시하거나 질문하세요… (Shift+Enter: 줄바꿈)"}
                      style={{ flex: 1, minWidth: 0, border: "none", outline: "none", resize: "none", fontSize: "13.5px", lineHeight: "1.6", fontFamily: "inherit", background: "transparent", color: "var(--ink)", maxHeight: "120px", overflowY: "auto", padding: "6px 0" }}
                    />
                    <button onClick={sendBottomReply} disabled={!canSend}
                      style={{ width: "32px", height: "32px", borderRadius: "var(--radius-btn)", border: "none", background: canSend ? "var(--accent)" : "var(--line-strong)", color: "white", cursor: canSend ? "pointer" : "not-allowed", fontSize: "14px", flexShrink: 0 }}
                    >↑</button>
                  </div>
                );
              })()}
            </div>
          </div>
        );
      };

      return (
        <div style={{ display: "flex", height: "100vh", fontFamily: "var(--font-body)", background: "var(--bg)", fontSize: "14px" }}>

          {/* 상시 사이드바 */}
          <div style={{ width: "230px", background: "var(--surface)", borderRight: "1px solid var(--line)", display: "flex", flexDirection: "column", flexShrink: 0 }}>
            <div style={{ padding: "18px 16px 14px", borderBottom: "1px solid var(--line)" }}>
              <button onClick={goHome} style={{ display: "flex", alignItems: "center", gap: "10px", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", padding: 0, marginBottom: "14px", width: "100%" }}>
                <span style={{ width: "28px", height: "28px", borderRadius: "8px", background: "var(--accent)", color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "14px", fontWeight: "800", flexShrink: 0 }}>L</span>
                <span style={{ textAlign: "left" }}>
                  <div style={{ fontSize: "15px", fontWeight: "800", color: "var(--ink)", lineHeight: "1.2" }}>LibrarAI</div>
                  <div style={{ fontSize: "10px", color: "var(--muted)" }}>도서관 AI 워크스페이스</div>
                </span>
              </button>
              <button onClick={goHome}
                style={{ width: "100%", padding: "9px 0", background: "var(--accent)", color: "white", border: "none", borderRadius: "var(--radius-btn)", fontSize: "13px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit", boxShadow: "0 2px 6px rgba(30,110,92,.25)" }}
              >✦ 총괄 지시</button>
            </div>

            {mainView === "agent" ? renderAgentQuickActions() : renderDomainTree()}

            <div style={{ padding: "12px 14px", borderTop: "1px solid var(--line)" }}>
              {/* 응답 모델 선택 — 홈·계획·에이전트 채팅 모든 화면에서 공통으로 보이도록 사이드바 하단에 둔다. */}
              <div style={{ marginBottom: "12px" }}>
                <label htmlFor="chat-model-select" style={{ display: "block", fontSize: "9.5px", fontWeight: 700, letterSpacing: "1.1px", color: "var(--faint)", textTransform: "uppercase", marginBottom: "5px" }}>응답 모델</label>
                <select id="chat-model-select" value={chatModel} onChange={e => changeChatModel(e.target.value)}
                  style={{ width: "100%", padding: "7px 8px", background: "var(--bg)", border: "1px solid #ECECE6", borderRadius: "var(--radius-btn)", color: "var(--body-text)", fontSize: "11.5px", fontFamily: "inherit", cursor: "pointer" }}>
                  {CHAT_MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
                <div style={{ fontSize: "10px", color: "var(--faint)", padding: "4px 2px 0" }}>
                  {(CHAT_MODELS.find(m => m.id === chatModel) || {}).note}
                </div>
              </div>
              {mainView === "agent" ? (
                <button onClick={() => resetCurrent()}
                  style={{ width: "100%", padding: "8px", background: "var(--bg)", border: "1px solid #ECECE6", borderRadius: "var(--radius-btn)", color: "var(--muted)", cursor: "pointer", fontSize: "12px", fontFamily: "inherit" }}
                >↺ 새 대화</button>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: "9px" }}>
                  <span style={{ width: "26px", height: "26px", borderRadius: "50%", background: "var(--accent-soft)", color: "var(--accent)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "11px", fontWeight: "700", flexShrink: 0 }}>기</span>
                  <div>
                    <div style={{ fontSize: "12px", fontWeight: "700", color: "var(--ink)" }}>기획담당</div>
                    <div style={{ fontSize: "10.5px", color: "var(--muted)" }}>기획업무팀</div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 메인 영역 */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

            {mainView === "agent" && (
              <div style={{ display: "flex", alignItems: "center", padding: "14px 40px", background: "var(--surface)", borderBottom: "1px solid var(--line)", gap: "10px" }}>
                <span style={{ fontSize: "12.5px", color: "var(--muted)" }}>
                  {currentAgentDomain ? currentAgentDomain.name : ""} / <span style={{ color: "var(--ink)", fontWeight: "700" }}>[{agentCode}] {agentDisplayName}</span>
                </span>
                <span style={{ display: "inline-flex", alignItems: "center", gap: "5px", fontSize: "11px", color: "var(--accent)", fontWeight: "700" }}>
                  <span style={{ width: "6px", height: "6px", borderRadius: "50%", background: "var(--accent)", display: "inline-block" }} />온라인
                </span>
                <button onClick={() => resetCurrent()} style={{ marginLeft: "auto", background: "none", border: "none", color: "var(--muted)", fontSize: "12px", cursor: "pointer", fontFamily: "inherit" }}>↺ 새 대화</button>
              </div>
            )}

            {mainView === "home" && renderHomeConsole()}
            {mainView === "plan" && renderPlanDetail()}

            {mainView === "agent" && (
              <>
                {/* 탭 바 (행사 기획 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "event-planning" && (
                  <div style={{ display: "flex", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {[
                      { id: "planner",             label: "행사 기획" },
                      { id: "reading-club",        label: "독서동아리" },
                      { id: "instructor-sourcing", label: "강사섭외" },
                      { id: "d06-mobile-library",  label: "순회문고" },
                    ].map(tab => (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                        style={{
                          padding: "12px 20px", border: "none", background: "transparent",
                          borderBottom: activeTab === tab.id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === tab.id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === tab.id ? "700" : "400",
                          fontSize: "13.5px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "7px",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === tab.id ? " is-active" : "")}>{codeFor(tab.id)}</span>
                        {tab.label}
                      </button>
                    ))}
                  </div>
                )}

                {/* 탭 바 (평생학습 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "lifelong-learning" && (
                  <div style={{ display: "flex", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {[
                      { id: "ll-planner",           label: "강좌 기획" },
                      { id: "ll-recruiter",         label: "강사공모" },
                      { id: "ll-student-recruiter", label: "수강생 모집" },
                      { id: "ll-operation-log",     label: "운영일지" },
                      { id: "ll-result-reporter",   label: "결과보고" },
                    ].map(tab => (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                        style={{
                          padding: "12px 20px", border: "none", background: "transparent",
                          borderBottom: activeTab === tab.id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === tab.id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === tab.id ? "700" : "400",
                          fontSize: "13.5px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "7px",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === tab.id ? " is-active" : "")}>{codeFor(tab.id)}</span>
                        {tab.label}
                      </button>
                    ))}
                  </div>
                )}

                {/* 탭 바 (장서개발 D1 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "collection" && (
                  <div style={{ display: "flex", flexWrap: "wrap", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {Object.entries(B_AGENTS_CONFIG).map(([id, cfg]) => (
                      <button key={id} onClick={() => setActiveTab(id)}
                        style={{
                          padding: "12px 16px", border: "none", background: "transparent",
                          borderBottom: activeTab === id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === id ? "700" : "400",
                          fontSize: "13px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "6px", whiteSpace: "nowrap",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === id ? " is-active" : "")}>{cfg.sub}</span>
                        {cfg.name}
                      </button>
                    ))}
                  </div>
                )}

                {/* 탭 바 (D0 행정업무 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "admin" && (
                  <div style={{ display: "flex", flexWrap: "wrap", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {Object.entries(A_AGENTS_CONFIG).map(([id, cfg]) => (
                      <button key={id} onClick={() => setActiveTab(id)}
                        style={{
                          padding: "12px 16px", border: "none", background: "transparent",
                          borderBottom: activeTab === id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === id ? "700" : "400",
                          fontSize: "13px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "6px", whiteSpace: "nowrap",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === id ? " is-active" : "")}>{cfg.sub}</span>
                        {cfg.name}
                      </button>
                    ))}
                  </div>
                )}

                {/* 탭 바 (D2 이용자 응대 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "patron-service" && (
                  <div style={{ display: "flex", flexWrap: "wrap", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {Object.entries(C_AGENTS_CONFIG).map(([id, cfg]) => (
                      <button key={id} onClick={() => setActiveTab(id)}
                        style={{
                          padding: "12px 16px", border: "none", background: "transparent",
                          borderBottom: activeTab === id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === id ? "700" : "400",
                          fontSize: "13px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "6px", whiteSpace: "nowrap",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === id ? " is-active" : "")}>{cfg.sub}</span>
                        {cfg.name}
                      </button>
                    ))}
                  </div>
                )}

                {/* 탭 바 (D5 홍보협력 도메인) */}
                {currentAgentDomain && currentAgentDomain.id === "pr-cooperation" && (
                  <div style={{ display: "flex", flexWrap: "wrap", background: "var(--surface)", borderBottom: "1px solid var(--line)" }}>
                    {Object.entries(F_AGENTS_CONFIG).map(([id, cfg]) => (
                      <button key={id} onClick={() => setActiveTab(id)}
                        style={{
                          padding: "12px 16px", border: "none", background: "transparent",
                          borderBottom: activeTab === id ? "2px solid var(--accent)" : "2px solid transparent",
                          color: activeTab === id ? "var(--accent)" : "var(--faint)",
                          fontWeight: activeTab === id ? "700" : "400",
                          fontSize: "13px", cursor: "pointer", fontFamily: "inherit",
                          display: "flex", alignItems: "center", gap: "6px", whiteSpace: "nowrap",
                        }}
                      >
                        <span className={"code-chip" + (activeTab === id ? " is-active" : "")}>{cfg.sub}</span>
                        {cfg.name}
                      </button>
                    ))}
                  </div>
                )}

                {/* 문서형 스레드 */}
                <div style={{ flex: 1, overflowY: "auto", padding: "30px 40px" }}>
                  <div style={{ maxWidth: "760px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "22px" }}>
                    {messages.map((msg, i) => (
                      msg.role === "user" ? (
                        <div key={i} style={{ display: "flex", justifyContent: "flex-end" }}>
                          <div style={{ maxWidth: "78%", padding: "12px 16px", borderRadius: "12px", background: "var(--accent-tint)", color: "#1C3B31", fontSize: "14px", lineHeight: "1.7", whiteSpace: "pre-wrap" }}>{msg.content}</div>
                        </div>
                      ) : (
                        <div key={i} style={{ display: "flex", gap: "12px", alignItems: "flex-start" }}>
                          {/* DM 탭이 위임 리프를 순차 실행할 때, 그 리프 턴은 msg.agentId로 자기 코드(예: B-01)를 표시한다 */}
                          <span className="code-chip" style={{ flexShrink: 0, marginTop: "3px" }}>{msg.agentId ? codeFor(msg.agentId) : agentCode}</span>
                          <div style={{ flex: 1, fontSize: "14px", lineHeight: "1.75", color: "var(--ink)", minWidth: 0 }}>
                            {msg.streaming
                              ? <><MarkdownRenderer text={msg.content} /><span className="stream-cursor">▊</span></>
                              : msg.content.includes("===보고서시작===")
                                ? <ReportDocument content={msg.content} />
                                : (msg.content.includes("===기안문시작===") || msg.content.includes("===첨부시작===") || msg.content.includes("===엑셀시작==="))
                                  ? <TabbedDocument content={msg.content} />
                                  : <MarkdownRenderer text={msg.content} />}
                          </div>
                        </div>
                      )
                    ))}

                    {loading && (
                      <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                        <span className="code-chip" style={{ flexShrink: 0 }}>{agentCode}</span>
                        <div style={{ display: "flex", gap: "5px", alignItems: "center" }}>
                          {[0,1,2].map(n => (
                            <div key={n} style={{ width: "6px", height: "6px", borderRadius: "50%", background: "var(--accent)", opacity: 0.6, animation: "bounce 1.2s infinite", animationDelay: (n * 0.2) + "s" }} />
                          ))}
                        </div>
                      </div>
                    )}
                    <div ref={bottomRef} />
                  </div>
                </div>

                {/* 입력 영역 */}
                <div style={{ padding: "16px 40px 24px", background: "var(--bg)" }}>
                  <div style={{ maxWidth: "760px", margin: "0 auto", display: "flex", gap: "8px", alignItems: "flex-end", background: "var(--surface)", borderRadius: "var(--radius-card)", padding: "10px 10px 10px 16px", border: "1px solid var(--line)", boxShadow: "var(--shadow-card)" }}>
                    <textarea
                      ref={textareaRef}
                      value={input}
                      onChange={e => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={(configFor(activeTab) && configFor(activeTab).placeholder) || `${agentDisplayName}에게 요청하기… (Shift+Enter: 줄바꿈)`}
                      rows={1}
                      style={{ flex: 1, minWidth: 0, border: "none", background: "transparent", resize: "none", outline: "none", fontSize: "14px", lineHeight: "1.6", fontFamily: "inherit", color: "var(--ink)", maxHeight: "120px", overflowY: "auto", padding: "6px 0" }}
                    />
                    <button
                      onClick={() => sendMessage()}
                      disabled={loading || !input.trim()}
                      style={{ width: "32px", height: "32px", borderRadius: "var(--radius-btn)", border: "none", background: (loading || !input.trim()) ? "var(--line-strong)" : "var(--accent)", color: "white", cursor: (loading || !input.trim()) ? "not-allowed" : "pointer", fontSize: "14px", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                    >↑</button>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
