    :root {

      /* ── Legacy aliases ─────────────────────────────────────────

      --d2: var(--accent);
      --d3: var(--accent);
      --d4: var(--accent);
      --d5: var(--accent);

      --grad-d2: var(--grad-accent);
      --grad-d3: var(--grad-accent);
      --grad-d4: var(--grad-accent);
      --grad-d5: var(--grad-accent);

    body { font-family: var(--font-body); background: var(--bg); color: var(--ink); }

      0%, 60%, 100% { transform: translateY(0); }

    @keyframes blink {

    const PLANNER_SYSTEM_PROMPT = `당신은 한국 공공도서관의 월별 행사 기획 전문가입니다. 도서관 이용자의 연령층과 관심사를 깊이 이해하고, 독서 문화 진흥과 지역사회 참여를 이끌어내는 창의적이고 실현 가능한 행사를 기획하는 것이 당신의 전문 영역입니다.

## 역할 및 책임
당신은 매월 하나의 핵심 주제를 중심으로 도서관 행사 전체 기획안을 작성합니다. 기획은 두 단계로 진행됩니다.

---

## 1단계: 월별 주제 후보군 제시

사용자가 특정 월(또는 다음 달)의 행사 기획을 요청하면, 먼저 **5개의 주제 후보군**을 제시합니다.

### 주제 선정 기준 (세 가지를 균형 있게 반영)
1. **그 달에만 존재하는 기념일**: 국가 기념일, 세계 기념일(UN 지정 등), 한국 고유 절기 및 문화 행사 등
2. **그 달이 가지는 특수한 의미**: 계절적 특성, 학사 일정(개학·방학·수능), 사회적 맥락 등
3. **시대 트렌드 반영 주제**: 최근 사회 이슈, MZ세대 관심사, 환경/기술/문화 트렌드 등

### 주제 후보 제시 형식
각 후보는 다음을 포함해야 합니다:
- **주제명** (간결하고 감각적인 슬로건 형태)
- **선정 근거** (위 세 기준 중 어느 것에 해당하는지, 1~2문장)
- **행사 방향 힌트** (이 주제로 어떤 행사가 가능할지 간략 언급)

후보 제시 후, 사용자에게 하나를 선택해달라고 명확히 요청합니다.

---

## 2단계: 선택된 주제로 행사 기획안 작성

사용자가 주제를 선택하면, 기본적으로 **6개 행사**로 구성된 월간 행사 기획안 전체를 작성합니다.

### 기본 행사 구성 (6개)
1. **어린이 북큐레이션** (1개) — 주제와 연관된 어린이 도서 5~8권 추천 + 큐레이션 설명
2. **성인 북큐레이션** (1개) — 주제와 연관된 성인 도서 5~8권 추천 + 큐레이션 설명
3. **어린이 참여형 행사** (2개) — 어린이가 직접 참여하는 체험·창작·독후 활동 등
4. **성인 참여형 행사** (2개) — 성인이 참여하는 강연·워크숍·토론·만들기 등

### 각 행사 기획서에 포함할 내용
- **행사명**: 창의적이고 직관적인 이름
- **대상**: 연령 및 참여 조건 (예: 초등 저학년, 성인 누구나 등)
- **목적**: 이 행사가 달성하고자 하는 교육적·문화적 목표
- **내용 및 진행 방식**: 구체적인 프로그램 흐름 (시간 배분 포함)
- **장소**: 강의실 1(성인 20명), 강의실 2·3(어린이 각 10명)
- **정원**: 권장 인원
- **소요 예산**: 강사비 ₩100,000/회차(₩50,000/hr×2hr), 재료비 등 항목별 산출
- **준비물 및 필요 자원**
- **홍보 포인트**: 이 행사를 알릴 때 강조할 1~2가지 매력 포인트

### 북큐레이션 도서 추천 기준
- 국내 출판 도서 위주, 최근 5년 내 출판 우선
- 어린이: 그림책, 동화, 어린이 비문학 포함
- 성인: 소설, 에세이, 비문학(인문/과학/사회) 균형
- 각 도서: 제목, 저자, 출판사, 간략 소개(1~2문장), 주제 연관성

---

## 유연한 기획 원칙
- **행사 개수 조정**: "4개만 해줘", "8개로 늘려줘" 등 요청 시 구성 변경
- **대상 조정**: "어린이 위주로", "성인 중심으로" 요청 시 비중 확대
- **유형 조정**: "북큐레이션 없이", "체험 위주로" 등 요청 시 조정
- **주제 직접 지정**: 사용자가 주제를 직접 제시하면 후보 제시 단계 생략 가능
- **부분 재기획**: 특정 행사만 수정 요청 시 해당 행사만 다시 작성

## 출력 형식 규칙
- 전체 기획안은 마크다운 형식으로 작성하여 가독성을 높입니다
- 섹션 구분을 명확히 하고, 표·목록·헤딩을 적극 활용합니다
- 한국어로 작성하며, 공공기관 문서 어투를 유지합니다

## 운영 지침

사서가 행사 준비물·재료의 구매처·가격·구매 링크를 요청하면(예: "이거 어디서 사요?", "구매 링크 알려줘", "재료 상품 링크 찾아줘"), 절대로 기억이나 추정으로 상품명·가격·링크를 만들어내지 말고, 아래 형식의 조회 요청 블록만 그대로 출력하십시오(다른 설명 없이, 코드블록 없이):

===SHOPPING_QUERY===
{"items": [{"query_id": "q-1", "name": "<검색할 준비물·재료명>"}]}
===SHOPPING_QUERY_END===

요청받은 준비물이 여러 개면 items 배열에 모두 담아 한 번에 요청하십시오(건별로 나눠 여러 번 출력하지 않음). 이 블록을 출력하면 시스템이 네이버 쇼핑 실제 검색 결과를 다음 메시지로 전달합니다. **그 결과를 받기 전까지는 상품명·가격·링크를 언급하지 마십시오.** 결과를 받은 뒤에는 반환된 데이터에 있는 상품명·가격·판매처·링크만 그대로 안내하고, 특정 항목의 results가 비어 있으면 "검색 결과 없음"으로 사실대로 안내하십시오. "실시간으로 인터넷에 접속할 수 없다"는 이유로 안내를 거부하지 마십시오 — 이 블록으로 요청하면 시스템이 실제 검색을 대신 수행합니다.

3. 모든 응답은 한국어로 작성합니다.
4. **범위 준수**: 수강생 모집(E-03), 결과보고서(E-05), 실제 강사비 지급 처리는 이 에이전트의 범위 밖입니다.

## 기능별 처리 절차

### FN-01: 출결 관리 대장 서식 자동 생성
E-03으로부터 수강생 명단과 프로그램 일정을 수신하면:
1. 출결 관리 대장 서식 구조 제시 (수강생별 회차 출결 표)
2. 헤더: 번호 / 성명 / 연락처 / 1회(날짜) / 2회(날짜) / ... / N회(날짜) / 출석 횟수 / 출석률 / 수료 여부
3. 수료 기준(70%) 충족 시 수료 표시 안내
4. Excel 서식 내용을 마크다운 표로 미리보기 제공

### FN-02: 매 회차 출결 입력 및 기록
사서가 회차 출결 현황을 입력하면:
1. **입력 형식 안내**: 회차 번호, 실제 진행일, 수강생별 출결(○출석/×결석/△지각/휴취소), 특이사항
2. 입력 내용 요약 출력 → 사서 확인 요청 (저장 전 검토 단계)
3. 사서 확인 후 자동 계산 결과 출력:
   - 해당 회차 출석/결석 인원
   - 수강생별 누적 출석 횟수 및 출석률
   - 수료 기준(70%) 달성 수강생 목록
   - 출석률 저조자(50% 미만) 안내 (연속 3회 결석 시 별도 알림)
출결 기호: ○ = 출석, × = 결석, △ = 지각, 휴 = 취소

### FN-03: 특이사항 기록
| 코드 | 내용 | 처리 |
|------|------|------|
| 휴강 | 강좌 취소 | 사유 기재 필수; 해당 회차 강사비 제외 |

| 중도 포기 | 수강생 이탈 | 수강생명·사유 기재; 이후 출결 대상 제외 |

### FN-04: 월별 강사비 지급 내역서 초안 생성
매월 말 또는 사서 요청 시:
1. 해당 월 진행 완료 회차 목록 확인
2. 강사비 계산: 정강사 회차 × 100,000원 (휴강 회차 제외)
3. 대체 강사 발생 회차: 별도 행으로 분리

내역서 항목:
프로그램명 | 강사명 | 지급 대상 회차 | 진행 회차 수 | 회당 강사비 | 지급 합계 | 비고

사서 요청 시 프로그램별 현황 즉시 출력:

### 3.2 회원 가입 절차

가입은 **2단계**로 이루어집니다. 1단계만 마친 웹회원 상태로는 자료대출과 전자도서관 이용이 불가합니다.

1. **웹회원 가입**: 집이나 각 자료실의 자료검색 PC에서 창녕도서관 홈페이지(http://cnlib.gne.go.kr/)에 회원가입
2. **자료대출회원 등록**: 위 구비서류를 지참하여 해당 자료실(일반·청소년은 종합자료실, 어린이는 어린이자료실)에 방문, 자료대출회원으로 등록

> ⚠️ 웹회원 상태로는 자료대출 및 전자도서관 이용이 불가합니다. 반드시 자료실에 방문하여 자료대출회원 등록 절차를 마쳐야 합니다.

## 4. 자료 대출


### 4.1 대출 기간 및 권수

| 자료 종류 | 권/점수 | 대출 기간 | 연기 |
|-----------|---------|-----------|------|
| 도서 | 1인 10권 | 2주 (14일) | 1회 1주(7일) 연기 가능 (단, 예약자료 제외) |
| DVD | 1인 2점 | 1주 (7일) | **연기 불가** |

### 4.2 예약 서비스

- 현재 대출 중인 도서는 **홈페이지 또는 직접 방문**으로 예약 신청할 수 있습니다.
- 예약도서가 반납되면 연락하며, **연락 받은 후 3일 이내** 수령해야 합니다. 기한 내 수령하지 않으면 예약이 취소됩니다.
- 예약자료는 대출 연기가 불가합니다.

### 4.3 구입희망도서 신청


- 원하는 도서가 비치되어 있지 않은 경우 **홈페이지 또는 자료실**에서 구입희망도서를 신청할 수 있습니다.
- **1인 월 3권**까지 신청 가능합니다.
- 시리즈물의 경우 낱권으로 등록하며, 월 3권 이내로 제한됩니다.
- 도서관의 선정 절차를 거쳐 구입 여부가 결정됩니다.

**구입 제외 대상** — 아래에 해당하는 도서는 신청이 취소됩니다.

| 제외 사유 | 상세 |
|----------|------|
| 소장·처리 중 자료 | 이미 소장 중이거나 정기차수 구입·정리 중인 자료 |
| 학습·수험 목적 | 자격증 학습서, 수험서, 문제집 등 개인 학습용 |
| 입수 불가 | 품절·절판 도서 |
| 형태 제외 | 서양서(해외주문도서), 전자자료(E-book·DVD 등), 잡지 |
| 시사성 부족 | 출판된 지 5년이 지난 자료 |
| 오락·혐오성 | 만화·무협·판타지·로맨스 등 (단, 학습·우량 만화는 선정 가능) |
| 비치 부적합 형태 | 문제풀이집, 색칠공부, 교구가 많이 딸린 자료 등 |
| 고가 도서 | 정가 5만 원 이상의 전문 도서 |
| 대량 전집·시리즈 | 수량이 많은 전집 및 시리즈 (시리즈는 월 3권 이내) |
| 장서기준 불합 | 기타 도서관 장서기준에 부합하지 않는 도서 |

### 4.4 자료 복사

- 각 자료실에서 자료 복사가 가능합니다. (종합자료실·어린이자료실 등)
- **복사카드를 구입한 후 본인이 직접** 복사해야 합니다. (직원 대행 불가)

### 4.5 대출 이용 시 주의사항

- 대출카드는 타인에게 양도할 수 없으며, 대출 시 반드시 제시해야 합니다.
- 신청 자료에 예약자가 있는 경우 연기가 불가합니다.
- DVD는 연기가 불가하므로 반납 기한을 정확히 지켜주세요.

## 5. 도서 반납·연체·이용자 주의사항


### 5.1 도서 반납 안내

- **자료실 운영시간 내**: 해당 자료실에 직접 반납
- **자료실 운영시간 외**: 본관 1층 건물 밖 반납함 이용
- 도서관을 방문하기 곤란한 경우 우편(선불)으로 반납 가능

### 5.2 대출 정지 (연체)

- 반납 연체 시 **연체 일수만큼** 대출이 정지됩니다.
- 예: 5일 연체하여 반납하면 5일간 대출 정지

### 5.3 분실·훼손 변상

- 대출 도서를 분실하거나 훼손한 경우 동일한 도서로 변상하거나, 현재의 시가로 변상해야 합니다.

### 5.4 이용자 주의사항

- 대출카드는 타인에게 양도할 수 없으며, 대출 시 제시해야 합니다.
- 반납 연체 시 연체 일수만큼 대출이 정지됩니다.
- 대출 도서의 분실 및 훼손 시 동일 도서 변상 또는 현 시가 변상이 필요합니다.
- **주소·전화번호 변동 또는 대출카드 분실 시에는 즉시 신고해야 합니다.**
- 도서관을 방문하기 곤란한 경우 우편(선불)으로 반납할 수 있고, 자료실 이용시간 외의 반납은 도서관 외부의 「도서반납함」을 이용할 수 있습니다.
- **신고하지 않은 대출증 분실에 따른 모든 책임은 회원 본인에게 있습니다.**

> 이 섹션은 RAG에서 가장 자주 검색되는 청크입니다.
> 신규 FAQ가 발생하면 즉시 추가하고 \`last_updated\`를 갱신합니다.

**Q. 책은 한 번에 몇 권까지, 며칠 동안 빌릴 수 있나요?**
A. 도서는 1인 10권을 2주(14일) 동안 대출할 수 있고, 1회 1주(7일) 연기가 가능합니다. 단, 예약자료는 연기할 수 없습니다.

**Q. DVD도 대출할 수 있나요?**
A. 네, DVD는 1인 2점을 1주(7일) 동안 대출할 수 있습니다. 다만 DVD는 도서와 달리 **연기가 불가능**하므로 반납 기한을 정확히 지켜주세요.

**Q. 회원증 없이도 도서관에 들어갈 수 있나요?**
A. 네, 자료 열람은 누구나 가능합니다. 다만 도서 대출에는 자료대출회원 등록이 필요합니다.

**Q. 홈페이지에서 회원가입만 하면 바로 책을 빌릴 수 있나요?**
A. 아니요. 홈페이지 가입(웹회원)만으로는 자료대출 및 전자도서관 이용이 불가합니다. 구비서류를 가지고 자료실(일반·청소년은 종합자료실, 어린이는 어린이자료실)에 방문하여 자료대출회원 등록을 마쳐야 이용 가능합니다.

**Q. 어린이가 회원가입을 하려면 어떻게 해야 하나요?**
A. 만 14세 미만의 유아·초등학생은 보호자가 동반해야 합니다. 보호자 신분증과 가족관계 확인이 가능한 의료보험증 또는 주민등록등본 등을 지참하시고, 보호자가 회원가입신청서를 작성합니다. 어린이자료실에서 등록을 진행합니다.

**Q. 경상남도에 살지 않는데 가입할 수 있나요?**
A. 경상남도 내에 직장을 두고 계신 타 시·도 거주자라면 재직증명서 또는 사원증을 가지고 종합자료실에서 가입 가능합니다.

**Q. 휴관일이나 야간에 책을 빌리거나 반납할 수 있는 방법이 있나요?**
A. 네, 두 가지 방법이 있습니다.
- **반납**: 자료실 운영시간 외에는 본관 1층 건물 밖 반납함을 이용하세요.
- **대출·반납**: 본관과 별도로 운영되는 **스마트도서관**은 365일 24시간 무인으로 운영됩니다.

**Q. 자율학습실은 월요일에도 이용할 수 있나요?**
A. 네. 다른 자료실과 달리 자율학습실은 매주 월요일에도 08:00~18:00 운영합니다. 단, **매월 마지막 주 월요일**에는 휴관합니다.

**Q. 책을 잃어버렸어요. 어떻게 변상하나요?**
A. 동일한 도서로 변상하거나, 현재 시가로 변상하실 수 있습니다. 우선 자료실에 방문하여 사서와 상의해 주세요.

**Q. 연체하면 어떻게 되나요?**
A. 연체 일수만큼 대출이 정지됩니다. 예를 들어 5일 연체하여 반납하면 그 후 5일간 대출이 정지됩니다.

**Q. 대출카드를 잃어버렸는데 신고해야 하나요?**
A. 네, **반드시 즉시 신고**하셔야 합니다. 신고하지 않은 대출증 분실에 따른 모든 책임은 회원 본인에게 있습니다.

**Q. 종합자료실은 누구나 이용할 수 있나요?**
A. 열람은 누구나 가능합니다만, 이용 대상은 **중학생 이상 일반인**입니다. 초등학생 이하는 어린이자료실을 이용해 주세요.

**Q. 어린이자료실은 어른도 들어갈 수 있나요?**
A. 어린이자료실의 이용 대상은 유아와 초등학생입니다. 보호자 등 성인의 동반 입장은 가능합니다.

**Q. 다문화자료실은 외국인만 이용할 수 있나요?**
A. 아닙니다. 외국인 이주자와 다문화 가정을 주 대상으로 하지만, **자료실 이용자 누구나** 이용 가능합니다.

**Q. 도서관 컴퓨터를 사용하고 싶어요.**
A. 디지털자료실에서 총 9대의 PC를 이용할 수 있습니다(출력·스캔 전용 2대 포함). 1인당 2시간 이용 가능합니다. 단, 채팅·게임·음란사이트 이용은 불가합니다.

**Q. 다른 도서관에 있는 책을 창녕도서관에서 받아볼 수 있나요?**
A. 네, **상호대차 서비스**를 이용하면 됩니다. 경상남도교육청 통합회원이라면 홈페이지 자료검색의 상호대차 메뉴에서 신청할 수 있으며, 도서운송비는 **무료(연간 20책)**입니다.

**Q. 상호대차로 한 번에 몇 권까지 신청할 수 있나요?**
A. 1회 최대 3책까지 신청 가능합니다. 이 3책은 통합회원 총 대출 20책 한도에 포함됩니다.

**Q. 상호대차 도서는 언제까지 찾아가야 하나요?**
A. 도서 도착 통보를 받은 후 **3일 이내**에 직접 신청 도서관에서 수령해야 합니다. 기한 내에 찾아가지 않으면 향후 도서 대출에 불이익이 생길 수 있으니 주의하세요.

**Q. 상호대차로 받은 책을 다른 도서관에 반납해도 되나요?**
A. 네, 경상남도교육청 소속 도서관 **어디에서나** 반납 가능합니다. 단, 경상남도교육청 북카페 **「지혜의방」에서는 반납이 불가**합니다.

**Q. 빌려간 책을 예약할 수 있나요?**
A. 현재 대출 중인 도서는 홈페이지 또는 자료실 방문을 통해 예약 신청할 수 있습니다. 반납되면 연락을 드리며, **연락 받은 후 3일 이내**에 수령하셔야 합니다.

**Q. 도서관에 없는 책을 사달라고 요청할 수 있나요?**
A. 네, 구입희망도서를 **홈페이지 또는 자료실**에 신청하실 수 있습니다. **1인 월 3권** 한도이며, 도서관의 선정 절차를 거쳐 구입 여부가 결정됩니다.

**Q. 구입희망도서로 만화책이나 소설을 신청할 수 있나요?**
A. 무협·판타지·로맨스·일반 오락성 만화 등은 구입 제외 대상입니다. 다만 학습 만화나 우량 만화는 선정될 수 있습니다.

**Q. 수험서나 자격증 책을 신청할 수 있나요?**
A. 아니요. 개인의 학습을 위한 자격증 학습서, 수험서, 문제집 등은 구입 제외 대상입니다.

**Q. 시리즈로 나온 책을 한꺼번에 여러 권 신청할 수 있나요?**
A. 시리즈물의 경우 월 3권 이내로 제한됩니다. 또한 낱권 단위로 등록해야 하며, 수량이 많은 전집·시리즈는 신청이 취소될 수 있습니다.

**Q. 5년 된 책도 희망도서로 신청할 수 있나요?**
A. 출판된 지 5년이 지난 자료는 최신성·시사성이 부족한 것으로 보아 구입 제외 대상입니다.

**Q. 비싼 전문 서적도 신청할 수 있나요?**
A. 정가 5만 원 이상의 고가 전문 도서는 구입 제외 대상입니다.

**Q. 자료실에서 복사를 할 수 있나요?**
A. 네, 종합자료실 등에서 복사가 가능합니다. 다만 **복사카드를 구입한 후 본인이 직접** 복사해야 하며, 직원이 대신 복사해 드리지는 않습니다.

**Q. 스마트도서관 「책드림」에서 빌린 책을 자료실 반납함에 반납해도 되나요?**
A. 안 됩니다. 책드림에서 대출한 도서는 **반드시 대출한 스마트도서관 기기에서만 반납**해야 합니다. 본관 자료실 반납대나 건물 외부 도서반납함에는 반납할 수 없습니다.

**Q. 스마트도서관 「책드림」에서는 몇 권까지 빌릴 수 있나요?**
A. 1인 5권, 14일(1회 7일 연기 가능)입니다. 이 5권은 자료실에서 빌리는 10권과 **별도로 계산**됩니다. 즉 자료실 10권 + 책드림 5권, 총 15권까지 동시에 빌릴 수 있습니다.

**Q. 장애인도 이용할 수 있는 특별한 서비스가 있나요?**
A. 네. 도서관 2층에 **장애인 정보누리터**가 있으며, 장애인(시각·청각·뇌병변 장애 등) 및 노인을 대상으로 합니다. 탁상용·휴대용 독서확대기, 데이지플레이어(시각·독서장애인용), 공공이용보청기, 전동식 높낮이 조절 책상, 화면 확대 S/W 컴퓨터, 휠체어 등 7종의 독서보조기기도 구비되어 있습니다. 문의: ☎ 055-532-9561

**Q. 휠체어를 빌릴 수 있나요?**
A. 네, 종합/디지털자료실에 휠체어 1대가 비치되어 있습니다. 도서관 데스크(☎ 532-9561)로 문의하세요.

**Q. 우포 북카페는 어디에 있나요? 누구나 이용할 수 있나요?**
A. 우포 북카페는 **별관 1층**에 있으며, 도서관 이용자라면 누구나 이용 가능한 휴식 공간입니다.

**Q. 평생학습 프로그램 강좌는 어디서 열리나요?**
A. 평생학습 프로그램, 인문학 강좌, 독서동아리 등은 주로 **별관 1층 문화강좌실 1~3**에서 진행됩니다. 공연·체육 활동 등 규모가 큰 행사는 **별관 2층 아트홀**에서 열립니다.

**Q. 도서관에서 신문을 볼 수 있나요? 어떤 신문을 구독하나요?**
A. 네, 종합자료실에서 총 7종의 신문을 열람할 수 있습니다. 일간지(경남신문·스포츠서울·조선일보·중앙일보·한국경제신문)와 월간 지역신문(창녕신문·우포신문)입니다. 신문은 대출 없이 관내 열람만 가능합니다.

**Q. 잡지는 어떤 것을 구독하나요?**
A. 종합자료실에 10종(건강다이제스트·과학동아·내셔널지오그래픽·브라보마이라이프·행복이 가득한 집·사람과 산·월간조선·중학 독서평설·뚜르드몽드·한겨레21), 어린이자료실에 6종(내셔널지오그래픽kids·파티시에·어린이과학동아·까사리빙·위즈키즈·초등독서평설)이 있습니다. 잡지도 관내 열람만 가능합니다.

**Q. 학위논문이나 학술자료를 열람할 수 있나요?**
A. 네, 디지털자료실 PC-1번에서 국립중앙도서관 원문DB(dlibrary.go.kr)와 국회도서관 원문DB(nanet.go.kr)를 통해 석박사학위논문·학술지·법률자료 등을 무료로 열람할 수 있습니다. 출력은 가능하며(A4 1장 60원, 복사카드 이용), 파일 저장은 불가합니다.

**Q. 원문DB는 집에서도 이용할 수 있나요?**
A. 아니요. 국립중앙도서관 및 국회도서관 원문 열람과 출력은 **디지털자료실 지정 PC-1번에서만** 이용 가능합니다. 기타 문의는 디지털자료실(☎ 532-9501)로 연락해 주세요.

**Q. 종합자료실은 몇 층에 있나요?**
A. 종합자료실은 **본관 2층**에 있습니다. 디지털자료실도 함께 2층에 있습니다.

**Q. 어린이자료실은 어디에 있나요?**
A. 어린이자료실과 다문화자료실은 **본관 1층**에 함께 있습니다.

**Q. 자율학습실은 어디에 있나요?**
A. 자율학습실은 **별관 2층**에 있습니다. 아트홀과 휴게공간도 별관 2층에 함께 있습니다.

        agents: [
          { id: "dm05-pr-partnership-domain", name: "홍보협력 도메인", icon: "🧭", description: "지시를 분석해 D5 리프에 위임, 요청 시 실적 취합" },
          { id: "pr",                    name: "홍보물 작성", icon: "📢", description: "보도자료·홈페이지 포스터·SNS 콘텐츠 제작" },
          { id: "f02-partner-relations", name: "협력기관",     description: "협력기관 MOU, 지역구 의원 소통, 운영위원회 관리" },
          { id: "f03-grant-program",     name: "공모사업",     description: "외부 공모사업 탐색·접수 공문 등록·신청 지원" },
          { id: "f04-newsletter",        name: "소식지",       description: "월간·계간 소식지 하이라이트 취합 및 초안 생성" },
        ],
      },
    ];

    // ── 총괄 지시: 도메인 에이전트의 ROUTE 위임 블록 파싱 ──────────
    // DM-0x가 지시를 특정 리프에 위임하기로 결정하면 응답 끝에 ===ROUTE===...===ROUTE_END=== 블록을 낸다.
    // 다른 DM으로의 재위임은 막아(무한 라우팅 방지) 리프로만 향하게 한다.
    const ROUTABLE_LEAF_IDS = new Set(
      DOMAINS.flatMap(d => d.agents.filter(a => !a.id.startsWith("dm0")).map(a => a.id))
    );
    const ROUTE_BLOCK_RE = /===ROUTE===([\s\S]*?)===ROUTE_END===/;
    const stripRouteBlock = (text) => text.replace(ROUTE_BLOCK_RE, "").trim();
    const parseRouteBlock = (text) => {
      const m = ROUTE_BLOCK_RE.exec(text);
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      if (!Array.isArray(parsed.targets)) return null;
      const targets = parsed.targets.filter(t => typeof t === "string" && ROUTABLE_LEAF_IDS.has(t));
      if (targets.length === 0) return null;
      return { targets, note: typeof parsed.note === "string" ? parsed.note : "" };
    };

    // ── 연간 업무 스케줄 헬퍼 (annual_schedule_data.js 로드 데이터 기반) ──
    // chief-coordinator의 "0단계 스케줄 인지"용: 88행 원문을 프롬프트에 넣지 않고,
    // 대상 기간에 걸리는 업무만 담당 매핑과 함께 발췌해 주입한다.
    const SCHEDULE_ROWS = typeof ANNUAL_SCHEDULE_ROWS !== "undefined" ? ANNUAL_SCHEDULE_ROWS : [];
    const SCHEDULE_TASK_MAP = typeof TASK_AGENT_MAP !== "undefined" ? TASK_AGENT_MAP : {};
    const DM_LABELS = {
      "dm01-collection-domain": "DM-01 장서",
      "dm02-patron-domain": "DM-02 이용자",
      "dm03-reading-culture-domain": "DM-03 독서문화",
      "dm04-lifelong-learning-domain": "DM-04 평생학습",
      "dm05-pr-partnership-domain": "DM-05 홍보협력",
      "a03-budget-management": "A-03 예산",
      "chief": "chief-coordinator 직접",
    };
    const scheduleTasks = (() => {
      const byName = new Map();
      SCHEDULE_ROWS.forEach(r => {
        if (!byName.has(r.taskName)) byName.set(r.taskName, { taskName: r.taskName, taskType: r.taskType, cycle: r.cycle, timings: [] });
        if (r.timing) byName.get(r.taskName).timings.push(r.timing);
      });
      return [...byName.values()];
    })();
    const SCHEDULE_IRREGULAR_RE = /비정기|수시|상이/;
    // "11월"이 1월에 걸리지 않도록 앞이 숫자가 아닌 경우만 매칭
    const taskMatchesMonth = (task, m) => {
      const texts = [task.cycle, ...task.timings];
      for (const t of texts) {
        for (const rm of t.matchAll(/(\d{1,2})\s*~\s*(\d{1,2})월/g)) {
          if (+rm[1] <= m && m <= +rm[2]) return true;
        }
      }
      if (/매월|매주/.test(task.cycle)) return true;
      const singleRe = new RegExp(`(^|[^0-9])${m}월`);
      return texts.some(t => singleRe.test(t.replace(/\d{1,2}\s*~\s*\d{1,2}월/g, "")));
    };
    // "해당월 전월/분기의 전월" 준비 업무: 다음 달이 실행 월이면 이번 달이 준비 기간
    const taskPrepForMonth = (task, m) =>
      !/매월|매주/.test(task.cycle) && /전월/.test(task.timings.join(" ")) &&
      taskMatchesMonth(task, m === 12 ? 1 : m + 1);
    const tasksForMonth = (m) => {
      const active = [], reference = [];
      scheduleTasks.forEach(task => {
        if (SCHEDULE_IRREGULAR_RE.test(task.cycle)) {
          if (taskMatchesMonth(task, m)) active.push({ task, why: "일정에 해당 월 명시" });
          else reference.push(task);
        } else if (taskMatchesMonth(task, m)) {
          active.push({ task, why: null });
        } else if (taskPrepForMonth(task, m)) {
          active.push({ task, why: "익월 실행분 준비(전월 진행)" });
        }
      });
      return { active, reference };
    };
    const isoWeekInfo = (d = new Date()) => {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const day = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - day);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      const week = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() || 7) - 1));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const fmt = (x) => `${x.getMonth() + 1}/${x.getDate()}`;
      return { label: `${date.getUTCFullYear()}-W${String(week).padStart(2, "0")}`, range: `${fmt(mon)}~${fmt(sun)}` };
    };
    const buildChiefScheduleContext = (now = new Date()) => {
      const m = now.getMonth() + 1;
      const nextM = m === 12 ? 1 : m + 1;
      const week = isoWeekInfo(now);
      const lineFor = ({ task, why }) => {
        const map = SCHEDULE_TASK_MAP[task.taskName] || {};
        const owners = (map.owners || []).map(o => DM_LABELS[o] || o).join(" + ") || "담당 미지정(키워드 라우팅으로 판단)";
        const hint = map.leafHint ? ` [리프: ${map.leafHint}]` : "";
        const note = map.note ? ` — ${map.note}` : "";
        return `- ${task.taskName} (주기: ${task.cycle})${why ? ` (${why})` : ""} → 담당: ${owners}${hint}${note}`;
      };
      const cur = tasksForMonth(m), nxt = tasksForMonth(nextM);
      const weeklyTasks = scheduleTasks.filter(t => /매주/.test(t.cycle));
      return [
        `## 연간 업무 스케줄 발췌 (자동 주입 — 오늘: ${now.getFullYear()}. ${m}. ${now.getDate()}., 이번 주: ${week.label}(${week.range}))`,
        `### 이번 달(${m}월) 예정 업무`,
        ...(cur.active.length ? cur.active.map(lineFor) : ["- (예정 업무 없음)"]),
        `### 다음 달(${nextM}월) 예정 업무 (참고 — 이번 달 준비 필요 여부 판단용)`,
        ...(nxt.active.length ? nxt.active.map(lineFor) : ["- (예정 업무 없음)"]),
        `### 매주 반복 업무 (주간 계획 핵심 소스)`,
        ...(weeklyTasks.length ? weeklyTasks.map(t => lineFor({ task: t, why: null })) : ["- (없음)"]),
        `### 비정기 업무 (참고 — 별도 지시가 있을 때만)`,
        ...(cur.reference.length ? cur.reference.map(t => lineFor({ task: t, why: null })) : ["- (없음)"]),
      ].join("\n");
    };

    // ── chief-coordinator (총괄 조정자) — v4 단일 접점 오케스트레이터 ────
    // 인간 최고관리자는 홈 콘솔에서 chief-coordinator하고만 대화한다. chief가 스스로 담당
    // DM(들)을 선정해 DISPATCH 블록으로 위임하고, 시스템이 순차 실행·취합한 결과를 다시
    // 받아 통합 계획서/보고서를 작성한다. (스펙: .claude/agents/chief-coordinator.md v4)
    const CHIEF_DISPATCHABLE_IDS = [
      "dm01-collection-domain", "dm02-patron-domain", "dm03-reading-culture-domain",
      "dm04-lifelong-learning-domain", "dm05-pr-partnership-domain",
      "a03-budget-management", // ④예산 개요 섹션 실데이터용 — 기존 예산 왕복 기계 재사용
    ];
    const CHIEF_DISPATCHABLE_SET = new Set(CHIEF_DISPATCHABLE_IDS);
    const CHIEF_SYSTEM_PROMPT_CORE = `당신은 LibrarAI 업무 총괄 에이전트(chief-coordinator)입니다. 인간 최고관리자와 도메인 에이전트(DM-01~05)·공통 도구(A-03 예산) 사이의 최상위 오케스트레이터입니다.

## 단일 접점 원칙 (가장 중요)
- 최고관리자는 오직 당신하고만 대화합니다. "이번달 업무 계획 제출해줘", "이번 주 업무 계획 제출해줘", "이번달 실적 결과보고 해줘" 같은 러프한 지시, 또는 예정에 없던 새 업무 지시를 받습니다.
- 담당 DM 선정은 전적으로 당신의 판단입니다. "어느 에이전트가 처리할까요?"라고 되묻지 않습니다 — 모호하면 스스로 판단하고, 정말 불가피할 때만 좁은 확인 질문 1개를 합니다.
- DM·리프는 최고관리자에게 직접 확인·승인을 요청하지 않습니다. 판단 필요 사안은 하위의 escalations로만 당신에게 올라오며, 당신이 계획서 ⑤절 또는 수시 미니 노트로 재포장해 전달합니다.

## 0단계 — 스케줄 인지
시스템 프롬프트 하단에 "연간 업무 스케줄 발췌"가 자동 주입됩니다. 계획서/보고서 지시를 받으면 반드시 이 발췌를 체크리스트로 삼으십시오:
- 대상 기간에 예정 업무가 있는 DM에는 instruction에 **구체적 업무명과 담당 리프 힌트를 명시**해 산출물 작성을 지시합니다(단순 조회가 아니라 실제 수행). 스케줄 발췌의 "[리프: ...]" 힌트를 instruction에 옮겨, DM이 그 리프에만 위임(게이팅)하고 예정 없는 리프로 확산하지 않도록 합니다.
- 예정 업무가 없는 DM은 위임 대상에서 제외해도 됩니다(5개 DM 전원에 빈 질문 금지).
- 담당이 "chief-coordinator 직접"인 업무(주요업무계획수립·월별통계작성·성과지표·도서관발전종합계획 등 기획담당 고유 업무)는 DM에 위임하지 않고 self_tasks에 넣은 뒤 최종 문서에서 직접 작성합니다.
- 스케줄상 예정 업무가 있는데 DM이 "해당 없음"으로 응답하면, 임의로 판단하지 말고 불일치를 원문 그대로 문서에 남깁니다.

## 라우팅 판단 기준 (스케줄·매핑에 없는 새 업무)
- 도서·수서·ISBN·복본·자료조직·장서 균형·장서점검 → dm01-collection-domain (DM-01 장서)
- 이용자·FAQ·키오스크·추천·상호대차·책나래/책바다/택배대출·만족도 → dm02-patron-domain (DM-02 이용자)
- 독서동아리·행사기획·독서문화 강사공모·순회문고·북큐레이션 → dm03-reading-culture-domain (DM-03 독서문화)
- 평생학습·강좌·수강생·출결·운영일지·인문학 프로그램 → dm04-lifelong-learning-domain (DM-04 평생학습)
- 홍보물·협력기관/MOU·공모사업·소식지 → dm05-pr-partnership-domain (DM-05 홍보협력)
- 예산 조회·집행 현황 → a03-budget-management (A-03 예산)
- 여러 도메인에 걸치면 분해해 각 DM에 나눠 지시합니다.

## 실행·계획 지시 vs 실적 결과보고 (매우 중요 — 오작동 방지)
"~업무를 실행/수행해줘", "~계획 세워줘", "8월 정례 업무 실행" 같은 지시(scope monthly/weekly/adhoc)는 **산출물(계획·문서 초안)을 생성**하라는 뜻입니다. 실제 운영이 아직 일어나지 않은 상태이므로:
- DISPATCH instruction에 **"실측 수치·실적·지원자 수·신청 인원·접수 건수·작성 건수·집행 실적을 회신하라"처럼 아직 발생하지 않은 결과 데이터를 요구하지 마십시오.** 그러면 리프는 데이터가 없어 "해당 없음"만 반복 반환합니다(현재 관찰된 오작동의 원인).
- 대신 **"담당 업무의 완성형 산출물(초안)을 작성하고, 계획 단계 수치(정원·예산·일정·차수)는 합리적 가정으로 채워 '(가정)'으로 표기해 회신하라"** 고 지시하십시오. 예: E-02에는 "지원자 수"가 아니라 "강사 공모 공고문 초안"을, E-03에는 "신청 인원"이 아니라 "수강생 모집 공고문·신청서 서식"을 요구합니다.
- 직전 실행에서 "해당 없음"이 나왔더라도 실측 수치를 **더 강하게 요구하지 마십시오** — 그것은 산출물 생성 지시로 재구성해야 풀립니다(수치를 조른다고 없는 데이터가 생기지 않습니다).
- 오직 사용자가 명시적으로 "실적/결과보고"를 요청하거나 scope가 event일 때만 실측 데이터를 요구하며, 이때 데이터가 없으면 "해당 없음"이 정상 응답입니다.

## DISPATCH 블록 (위임이 필요한 턴에만)
하위 조회·지시가 필요하면 응답 본문(최고관리자에게 보일 짧은 안내문: 어느 DM에 무엇을 조회하는지) 뒤에 아래 블록을 정확한 형식으로 붙이십시오. 위임 없이 답할 수 있는 질문(스케줄 문의, 이전 문서 재설명 등)에는 블록을 붙이지 않습니다.

===DISPATCH===
{"scope": "monthly", "target_period": "2026-08", "targets": [{"agent": "dm01-collection-domain", "instruction": "8월 장서 도메인 월간 업무 수행. 스케줄상 예정 업무: 정기도서수서(8월 실행분·리프 B-01), 희망도서수서(매주·리프 B-02/B-03), 장서현황보고(DM 직접). 이 업무의 담당 리프에만 ROUTE 위임하고(B-04-H·B-05·B-06 등 예정 없는 리프 제외), 리프 산출물을 원문 그대로 취합해 응답하십시오."}], "self_tasks": ["월별통계작성"]}
===DISPATCH_END===

- scope: "monthly" | "weekly" | "event" | "adhoc" (주간 계획은 target_period를 "2026-W30" 형식으로, 특별 행사는 "event_name" 필드 추가)
- targets의 agent는 다음 id만 사용: ${CHIEF_DISPATCHABLE_IDS.join(", ")}
- 리프 최종 선택은 각 DM이 하되, 이번 기간 활성 업무에 해당하는 리프만 다루도록 instruction에 업무명·리프 힌트를 명시합니다(게이팅 — DM이 담당 리프 전체로 확산하지 않게 함).
- self_tasks: "chief-coordinator 직접" 담당 업무명 배열(없으면 빈 배열).

## 집계 결과 수신 후 (2라운드)
"[집계 결과 — 시스템 자동 주입]"으로 시작하는 메시지를 받으면 **새 DISPATCH를 내지 말고** 통합 문서를 작성하십시오.
- 역할 경계: 각 DM이 취합한 산출물을 통합 문서로 **편집**합니다. ③도메인별 상세에는 리프 산출물 본문을 요약하지 말고 원문 그대로 포함하고, 표지·요약·escalations 절만 새로 작성합니다. 수치를 재계산하거나 escalation 내용을 재판단하지 않습니다(그대로 인용).
- 오류가 난 DM 섹션은 "수집 실패: (사유)"로 표기하고 나머지로 문서를 완성합니다.

**통합 문서 출력 형식 (사람이 읽는 보고서 + PDF 변환용) — 반드시 준수:**
통합 문서 전체를 \`===보고서시작===\` 과 \`===보고서끝===\` 구분자로 감쌉니다. 그 안은 **(1) 1페이지 총괄 요약 보고서 → (2) 도메인별 상세 기획안** 순서로 구성하고, **페이지가 나뉘어야 하는 지점마다 단독 행으로 \`---\` 를 넣습니다**(뷰어에서 구분선, PDF에서 페이지 넘김으로 처리됨). 요약과 상세는 **동일한 공문서체 톤앤매너로 통일**합니다(경어체 개조식, 금액 ₩·콤마, 날짜 \`2026. 8. 1.\` 표기).

\`===보고서시작===\` 안의 골격:
■ **1페이지 총괄 요약**(첫 페이지 한 장에 담기도록 압축):
  \`# [문서 제목 — 예: 2026년 8월 도서관 월간 업무계획]\`
  이어서 \`- 대상 기간 / 작성: 기획업무팀 기획담당 / 작성일 [YYYY. M. D.]\`
  \`## 총괄 요약\` — 도메인별 핵심 계획을 도메인당 1~2줄로 압축(전체 3~5줄 수준). 가능하면 "도메인 / 핵심 업무 / 예산 / 비고" 요약표 1개와 예산 소요 총계·최고관리자 확인 필요 항목 건수를 한눈에 제시.
\`---\`
■ **도메인별 상세 기획안**(DM-01~05 순, 각 도메인 사이에 \`---\` 페이지 구분):
  \`## [DM-XX 도메인명] 상세 기획안\` 아래에 각 DM이 취합한 **리프 산출물 본문을 요약하지 말고 원문 그대로** 포함(담당 업무 없는 도메인만 "해당 없음"). self_tasks의 기획담당 고유 업무도 해당 위치에 직접 작성.
\`---\`
■ 마지막 페이지: \`## 예산 소요 개요\`(A-03 데이터 반영 — 주간 계획은 생략 가능) / \`## 최고관리자 확인·승인 필요 항목\`(escalations 원문 인용·취합)

**실적 결과보고**도 동일하게 \`===보고서시작===\`~\`===보고서끝===\`로 감싸며, **1페이지 총괄 요약**(하위가 판정한 이상 징후는 재계산 없이 ⚠️와 함께 인용) → \`---\` → 도메인별 실적 현황 → \`---\` → 통합 수치 분석(ASCII 차트 — 막대/선형, 축·단위 한국어: 원·권·명·회) → 종합 평가 및 제언 → 확인·승인 필요 항목 순으로 구성합니다.

보고서 말미(\`===보고서끝===\` 직전)에 "본 문서는 초안이며 최고관리자 검토·확정 전까지 확정본이 아닙니다."를 명시하십시오. ⚠ 확인필요 미니 노트(===확인필요===)는 이 보고서 블록 **밖 맨 앞**에 그대로 둡니다.

## 어조·기관 컨텍스트
- 공문서체 한국어. 금액은 ₩·콤마 표기. 연간 예산 총 1억원(평생학습 강사료 1,500만원·교재비 300만원, 강사료 10만원/회차). 강의실: 1강의실(성인 20명), 2·3강의실(어린이 각 10명).
- 희망도서 기준: 1인 3권/월, 절판·외국도서·전자책·5년 초과·5만원 초과 제외. 복본: ISBN 동일 = 복본, 제목+저자 80% 이상 유사 = 상세조사.`;
    const buildChiefSystemPrompt = () => CHIEF_SYSTEM_PROMPT_CORE + "\n\n" + buildChiefScheduleContext();

    const DISPATCH_BLOCK_RE = /===DISPATCH===([\s\S]*?)===DISPATCH_END===/;
    const stripDispatchBlock = (text) => text.replace(DISPATCH_BLOCK_RE, "").trim();
    const parseDispatchBlock = (text) => {
      const m = DISPATCH_BLOCK_RE.exec(text || "");
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      const scope = ["monthly", "weekly", "event", "adhoc"].includes(parsed.scope) ? parsed.scope : "adhoc";
      if (!Array.isArray(parsed.targets)) return null;
      const seen = new Set();
      const targets = [];
      parsed.targets.forEach(t => {
        if (t && typeof t.agent === "string" && CHIEF_DISPATCHABLE_SET.has(t.agent) &&
            typeof t.instruction === "string" && t.instruction.trim() && !seen.has(t.agent)) {
          seen.add(t.agent);
          targets.push({ agent: t.agent, instruction: t.instruction.trim() });
        }
      });
      if (targets.length === 0) return null;
      return {
        scope,
        target_period: typeof parsed.target_period === "string" ? parsed.target_period : null,
        event_name: typeof parsed.event_name === "string" ? parsed.event_name : null,
        targets: targets.slice(0, 6),
        self_tasks: Array.isArray(parsed.self_tasks) ? parsed.self_tasks.filter(s => typeof s === "string") : [],
      };
    };

    // DM/A-03 → chief: 판단 필요 사안 버블업 블록 (v4 FN-08)
    const ESCALATIONS_BLOCK_RE = /===ESCALATIONS===([\s\S]*?)===ESCALATIONS_END===/;
    const stripEscalationsBlock = (text) => text.replace(ESCALATIONS_BLOCK_RE, "").trim();
    const parseEscalationsBlock = (text) => {
      const m = ESCALATIONS_BLOCK_RE.exec(text || "");
      if (!m) return [];
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return []; }
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(e => e && typeof e.item === "string" && e.item.trim())
        .map(e => ({
          item: e.item.trim(),
          urgency: e.urgency === "urgent" ? "urgent" : "normal",
          source_leaf: typeof e.source_leaf === "string" ? e.source_leaf : null,
        }));
    };

    // chief → 최고관리자: 수시 "확인 필요" 미니 노트 — 저장은 원문 그대로, 렌더 시 분리
    const CONFIRM_NOTE_RE = /===확인필요===([\s\S]*?)===확인필요끝===/g;
    // 어시스턴트 응답에서 확인필요 미니 노트를 떼어내 { notes:[본문...], body:"나머지" }로 반환.
    const splitConfirmNotes = (text) => {
      const src = text || "";
      const notes = [];
      let m;
      CONFIRM_NOTE_RE.lastIndex = 0;
      while ((m = CONFIRM_NOTE_RE.exec(src)) !== null) {
        const body = m[1].trim();
        if (body) notes.push(body);
      }
      const body = src.replace(CONFIRM_NOTE_RE, "").replace(/\n{3,}/g, "\n\n").trim();
      return { notes, body };
    };

    // ── B-03: 실제 DB 조회 요청 블록 파싱 ──────────────────────────
    // B-03이 복본 판정 전 ===DB_QUERY===...===DB_QUERY_END=== 블록으로 조회를 요청하면
    // 파싱해 api/books.js를 호출하고, 결과를 후속 메시지로 넣어 다시 답변을 받는다.
    const DB_QUERY_BLOCK_RE = /===DB_QUERY===([\s\S]*?)===DB_QUERY_END===/;
    const stripDbQueryBlock = (text) => text.replace(DB_QUERY_BLOCK_RE, "").trim();
    const parseDbQueryBlock = (text) => {
      const m = DB_QUERY_BLOCK_RE.exec(text);
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      if (typeof parsed.action !== "string") return null;
      return parsed;
    };

    // ── A-03: 실제 예산 조회·집행 요청 블록 파싱 ──────────────────────
    // A-03이 잔액 조회나 매칭·집행 전에 ===BUDGET_QUERY===...===BUDGET_QUERY_END=== 블록으로
    // 요청하면 파싱해 api/budget.js를 호출하고, 결과를 후속 메시지로 넣어 다시 답변을 받는다.
    const BUDGET_QUERY_BLOCK_RE = /===BUDGET_QUERY===([\s\S]*?)===BUDGET_QUERY_END===/;
    const parseBudgetQueryBlock = (text) => {
      const m = BUDGET_QUERY_BLOCK_RE.exec(text);
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      if (typeof parsed.action !== "string") return null;
      return parsed;
    };

    // ── D-02: 행사 준비물·재료 구매 링크 조회 요청 블록 파싱 ───────────
    // D-02가 준비물·재료의 실제 구매처·가격·링크를 알려주기 전에
    // ===SHOPPING_QUERY===...===SHOPPING_QUERY_END=== 블록으로 조회를 요청하면
    // 파싱해 api/naver-shopping.js를 호출하고, 결과를 후속 메시지로 넣어 다시 답변을 받는다.
    const SHOPPING_QUERY_BLOCK_RE = /===SHOPPING_QUERY===([\s\S]*?)===SHOPPING_QUERY_END===/;
    const parseShoppingQueryBlock = (text) => {
      const m = SHOPPING_QUERY_BLOCK_RE.exec(text);
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      if (!Array.isArray(parsed.items)) return null;
      const items = parsed.items.filter(it => it && typeof it.name === "string" && it.name.trim());
      if (items.length === 0) return null;
      return { items };
    };

    // 요청된 준비물·재료명마다 네이버 쇼핑 검색을 실행해 실제 상품명·가격·판매처·링크를 조회한다.
    // 검색어 하나가 실패해도 나머지는 계속 진행하고, 결과 없음은 그대로 빈 배열로 반환한다(지어내지 않음).
    const runShoppingQuery = async (body) => {
      const items = await Promise.all(body.items.map(async (it) => {
        try {
          const res = await bibApiLimit(() => fetch(NAVER_SHOPPING_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: it.name, display: 5, sort: "sim" }),
          }));
          const data = await res.json();
          const results = (data.items || []).slice(0, 3).map(p => ({
            title: (p.title || "").replace(/<[^>]+>/g, ""),
            price: p.lprice || "",
            mallName: p.mallName || "",
            link: p.link || "",
          }));
          return { query_id: it.query_id, name: it.name, results };
        } catch (e) {
          return { query_id: it.query_id, name: it.name, results: [], error: e.message };
        }
      }));
      return { items };
    };

    // ── B-02: 희망도서 신청 건 포맷(전자책 여부·제본형태) 조회 요청 블록 파싱 ──
    // 2026-07-18 사서 지시: B-02는 R-04(포맷) 반려 기준을 SEOJI의 EBOOK_YN/FORM/FORM_DETAIL로
    // 자동 판정한다. B-02가 ===SEOJI_FORMAT_QUERY===...===SEOJI_FORMAT_QUERY_END=== 블록으로
    // 조회를 요청하면 파싱해 api/seoji.js를 호출하고, 결과를 후속 메시지로 넣어 다시 답변을 받는다.
    const SEOJI_FORMAT_QUERY_BLOCK_RE = /===SEOJI_FORMAT_QUERY===([\s\S]*?)===SEOJI_FORMAT_QUERY_END===/;
    const parseSeojiFormatQueryBlock = (text) => {
      const m = SEOJI_FORMAT_QUERY_BLOCK_RE.exec(text);
      if (!m) return null;
      const raw = m[1].trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return null; }
      if (!Array.isArray(parsed.items)) return null;
      const items = parsed.items.filter(it => it && typeof it === "object" && (it.isbn || it.title));
      if (items.length === 0) return null;
      return { items };
    };

    // 신청 건마다 SEOJI를 ISBN(우선) 또는 서명으로 조회해 EBOOK_YN·FORM·FORM_DETAIL을 확인한다.
    // 검색 결과가 없으면 자동 판정 불가로 명시하고(사서 수동 확인 필요), 지어내지 않는다.
    const runB02SeojiFormatQuery = async (body) => {
      const items = await Promise.all(body.items.map(async (it) => {
        try {
          const res = await bibApiLimit(() => fetch(SEOJI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(it.isbn ? { isbn: it.isbn, pageSize: 1 } : { title: it.title, pageSize: 1 }),
          }));
          const data = await res.json();
          const doc = data.docs && data.docs[0];
          if (!doc) return { query_id: it.query_id, isbn: it.isbn, title: it.title, found: false };
          return {
            query_id: it.query_id, isbn: it.isbn, title: it.title, found: true,
            ebookYn: doc.EBOOK_YN || "", form: doc.FORM || "", formDetail: doc.FORM_DETAIL || "",
          };
        } catch (e) {
          return { query_id: it.query_id, isbn: it.isbn, title: it.title, found: false, error: e.message };
        }
      }));
      return { items };
    };

    const AGENT_STYLES = {
      "planner":              { gradient: "var(--grad-d3)", label: "D-02" },
      "reading-club":         { gradient: "var(--grad-d3)", label: "D-01" },
      "instructor-sourcing":  { gradient: "var(--grad-d3)", label: "D-03" },
      "d06-mobile-library":   { gradient: "var(--grad-d3)", label: "D-06" },
      "ll-planner":           { gradient: "var(--grad-d4)", label: "E-01" },
      "ll-recruiter":         { gradient: "var(--grad-d4)", label: "E-02" },
      "ll-student-recruiter": { gradient: "var(--grad-d4)", label: "E-03" },
      "ll-operation-log":     { gradient: "var(--grad-d4)", label: "E-04" },
      "ll-result-reporter":   { gradient: "var(--grad-d4)", label: "E-05" },
      "pr":                   { gradient: "var(--grad-d5)", label: "F-01" },
    };

    // 마크다운 표(파이프 구분) 줄 배열을 헤더 구분선을 제거한 2차원 배열로 변환 — 화면 렌더링과 Excel 내보내기가 공유
    const parseMarkdownTableRows = (tableLines) =>
      tableLines
        .map(r => r.split("|").map(c => c.trim()).filter((_, j, a) => j > 0 && j < a.length - 1))
        .filter(r => !r.every(c => /^[-:]+$/.test(c)));

    // ── MarkdownRenderer ──────────────────────────────────────────
    function MarkdownRenderer({ text }) {
      const lines = text.split("\n");
      const elements = [];
      let i = 0;
      let tableBuffer = [];
      let inTable = false;

      const flushTable = () => {
        if (!tableBuffer.length) return;
        const rows = parseMarkdownTableRows(tableBuffer);
        elements.push(
          <div key={"t" + elements.length} style={{ overflowX: "auto", margin: "10px 0" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", fontSize: "13px", fontVariantNumeric: "tabular-nums" }}>
              <tbody>
                {rows.map((row, ri) => (
                  <tr key={ri} style={{ background: ri === 0 ? "var(--bg-sunken)" : ri % 2 === 0 ? "var(--bg-elevated)" : "white" }}>
                    {row.map((cell, ci) => {
                      const T = ri === 0 ? "th" : "td";
                      return <T key={ci} style={{ border: "1px solid var(--line)", padding: "6px 10px", textAlign: "left", fontWeight: ri === 0 ? "600" : "normal" }}>{cell}</T>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
        tableBuffer = [];
        inTable = false;
      };

      while (i < lines.length) {
        const line = lines[i];
        if (line.trim().startsWith("|") && line.includes("|")) {
          inTable = true;
          tableBuffer.push(line);
          i++;
          continue;
        }
        if (inTable) flushTable();
        const key = "l" + i;
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
          elements.push(<hr key={key} style={{ border: "none", borderTop: "1px dashed var(--line-strong)", margin: "16px 0" }} />);
        } else if (line.startsWith("# ")) {
          elements.push(<h1 key={key} style={{ fontFamily: "var(--font-display)", fontWeight: "400", fontSize: "18px", margin: "14px 0 6px", color: "var(--ink)", borderBottom: "2px solid var(--chrome)", paddingBottom: "4px" }}>{line.slice(2)}</h1>);
        } else if (line.startsWith("## ")) {
          elements.push(<h2 key={key} style={{ fontFamily: "var(--font-display)", fontWeight: "400", fontSize: "15px", margin: "12px 0 5px", color: "var(--chrome)" }}>{line.slice(3)}</h2>);
        } else if (line.startsWith("### ")) {
          elements.push(<h3 key={key} style={{ fontSize: "14px", fontWeight: "600", margin: "10px 0 4px", color: "var(--ink-muted)" }}>{line.slice(4)}</h3>);
        } else if (/^[-*]\s/.test(line)) {
          const c = line.replace(/^[-*]\s/, "");
          elements.push(
            <div key={key} style={{ display: "flex", gap: "6px", margin: "2px 0", paddingLeft: "4px" }}>
              <span style={{ color: "var(--chrome)", flexShrink: 0 }}>·</span>
              <span style={{ lineHeight: "1.6" }} dangerouslySetInnerHTML={{ __html: c.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />
            </div>
          );
        } else if (/^\d+\.\s/.test(line)) {
          elements.push(<p key={key} style={{ margin: "2px 0", paddingLeft: "8px", lineHeight: "1.6" }} dangerouslySetInnerHTML={{ __html: line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />);
        } else if (line.startsWith("※")) {
          elements.push(<p key={key} style={{ margin: "4px 0", fontSize: "12px", color: "var(--ink-faint)" }}>{line}</p>);
        } else if (line.trim() === "") {
          elements.push(<div key={key} style={{ height: "5px" }} />);
        } else {
          elements.push(<p key={key} style={{ margin: "2px 0", lineHeight: "1.7" }} dangerouslySetInnerHTML={{ __html: line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />);
        }
        i++;
      }
      if (inTable) flushTable();
      return <div>{elements}</div>;
    }

    // ── Excel(xlsx) 다운로드 — B-01 FN-05 선정 목록 ────────────────
    let _xlsxLoadPromise = null;
    const loadXLSX = () => {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (_xlsxLoadPromise) return _xlsxLoadPromise;
      _xlsxLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js";
        script.onload = () => resolve(window.XLSX);
        script.onerror = () => reject(new Error("Excel 라이브러리 로드에 실패했습니다. 네트워크를 확인해주세요."));
        document.head.appendChild(script);
      });
      return _xlsxLoadPromise;
    };

    const downloadAsExcel = async (tableMarkdown, filenameBase) => {
      const XLSXLib = await loadXLSX();
      const rows = parseMarkdownTableRows(tableMarkdown.trim().split("\n"));
      if (!rows.length) throw new Error("표 형식을 인식할 수 없습니다.");
      const ws = XLSXLib.utils.aoa_to_sheet(rows);
      const wb = XLSXLib.utils.book_new();
      XLSXLib.utils.book_append_sheet(wb, ws, "선정목록");
      const wbout = XLSXLib.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${filenameBase}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    // ── hwpx 다운로드 ──────────────────────────────────────────────
    // hwpx-autofill-conversion 스킬과 동일한 방식: 검증된 기본 양식(hwpx_base_template.js에
    // base64로 내장)의 Contents/section0.xml만 교체해 재압축한다. MVP 범위로, 표·서식은
    // 반영하지 않고 텍스트를 그대로 문단으로 흘려 넣는다(합의된 구현 범위).
    let _jszipLoadPromise = null;
    const loadJSZip = () => {
      if (window.JSZip) return Promise.resolve(window.JSZip);
      if (_jszipLoadPromise) return _jszipLoadPromise;
      _jszipLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js";
        script.onload = () => resolve(window.JSZip);
        script.onerror = () => reject(new Error("JSZip 로드에 실패했습니다. 네트워크를 확인해주세요."));
        document.head.appendChild(script);
      });
      return _jszipLoadPromise;
    };

    const HWPX_NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';

    const HWPX_SECPR = '<hp:p id="1" paraPrIDRef="29" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0"><hp:secPr id="" textDirection="HORIZONTAL" spaceColumns="1134" tabStop="8000" outlineShapeIDRef="1" memoShapeIDRef="1" textVerticalWidthHead="0" masterPageCnt="0"><hp:grid lineGrid="0" charGrid="0" wonggojiFormat="0"/><hp:startNum pageStartsOn="BOTH" page="0" pic="0" tbl="0" equation="0"/><hp:visibility hideFirstHeader="0" hideFirstFooter="0" hideFirstMasterPage="0" border="SHOW_ALL" fill="SHOW_ALL" hideFirstPageNum="0" hideFirstEmptyLine="0" showLineNumber="0"/><hp:lineNumberShape restartType="0" countBy="0" distance="0" startNumber="0"/><hp:pagePr landscape="WIDELY" width="59528" height="84188" gutterType="LEFT_ONLY"><hp:margin header="4251" footer="4251" gutter="0" left="5669" right="5669" top="4251" bottom="4251"/></hp:pagePr><hp:footNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="-1" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="283" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="EACH_COLUMN" beneathText="0"/></hp:footNotePr><hp:endNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="14692344" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="0" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="END_OF_DOCUMENT" beneathText="0"/></hp:endNotePr><hp:pageBorderFill type="BOTH" borderFillIDRef="1" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill><hp:pageBorderFill type="EVEN" borderFillIDRef="1" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill><hp:pageBorderFill type="ODD" borderFillIDRef="1" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill></hp:secPr><hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl></hp:run></hp:p>';

    const escapeHwpxText = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    const hwpxPara = (pid, text, paraPr = 7, style = 0, charPr = 5) =>
      `<hp:p id="${pid}" paraPrIDRef="${paraPr}" styleIDRef="${style}" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${charPr}"><hp:t>${escapeHwpxText(text)}</hp:t></hp:run></hp:p>`;

    const hwpxParaEmpty = (pid) =>
      `<hp:p id="${pid}" paraPrIDRef="7" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="5"><hp:t/></hp:run></hp:p>`;

    // segments: [text, charPr][] — 한 문단(hp:p) 안에 여러 hp:run을 넣어 인라인 **볼드**를 표현한다.
    const hwpxParaMultiRun = (pid, segments, paraPr = 7, style = 0) => {
      const runs = segments.map(([text, charPr]) => `<hp:run charPrIDRef="${charPr}"><hp:t>${escapeHwpxText(text)}</hp:t></hp:run>`).join("");
      return `<hp:p id="${pid}" paraPrIDRef="${paraPr}" styleIDRef="${style}" pageBreak="0" columnBreak="0" merged="0">${runs}</hp:p>`;
    };

    // hwpx_base_template.js의 header.xml에 추가된 붙임 서식용 커스텀 스타일 ID.
    // (기존 본문 스타일 paraPr=7/style=0/charPr=5는 그대로 두고 끝에만 추가했다 — HWPX_STYLES.md 없음, 아래가 유일한 참조표)
    //   charPr  44=제목용 굵게 15pt / 45=소제목용 굵게 12pt / 46=인라인 볼드·표 헤더용 굵게 10pt
    //   paraPr  52=제목 문단(좌측정렬+상단여백) / 53=소제목 문단 / 54=목록(들여쓰기) / 55=표 헤더 셀(가운데정렬) / 56=표 본문 셀(좌측정렬)
    //   borderFill 33=표 테두리(가는 실선 4방향)
    const HWPX_INLINE_BOLD_RE = /\*\*([^*]+)\*\*/g;
    const splitInlineBold = (text, normalCharPr, boldCharPr) => {
      const segments = [];
      let lastIndex = 0;
      let m;
      HWPX_INLINE_BOLD_RE.lastIndex = 0;
      while ((m = HWPX_INLINE_BOLD_RE.exec(text)) !== null) {
        if (m.index > lastIndex) segments.push([text.slice(lastIndex, m.index), normalCharPr]);
        segments.push([m[1], boldCharPr]);
        lastIndex = HWPX_INLINE_BOLD_RE.lastIndex;
      }
      if (lastIndex < text.length) segments.push([text.slice(lastIndex), normalCharPr]);
      return segments.length ? segments : [[text, normalCharPr]];
    };

    const HWPX_TABLE_ROW_RE = /^\s*\|(.+)\|\s*$/;
    const HWPX_TABLE_SEP_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
    const HWPX_HEADING_RE = /^(#{1,3})\s+(.+)$/;
    const HWPX_BULLET_RE = /^\s*[-*]\s+(.+)$/;
    const HWPX_TABLE_USABLE_WIDTH = 48190; // 페이지폭 59528 - 좌우여백 5669*2 (secPr 기준)
    const HWPX_TABLE_ROW_HEIGHT = 620;

    let _hwpxTblIdSeq = 1000000000;
    const nextHwpxTblId = () => ++_hwpxTblIdSeq;

    // 마크다운 표(| ... | 행 + |---|---| 구분선)를 실제 hwpx 표(hp:tbl)로 변환한다.
    // 첫 행은 표 헤더(가운데정렬+굵게), 나머지는 본문 셀(좌측정렬)로 렌더링한다.
    const buildHwpxTable = (rows, nextId) => {
      const colCnt = rows[0].length;
      const rowCnt = rows.length;
      const colWidth = Math.floor(HWPX_TABLE_USABLE_WIDTH / colCnt);
      const trs = rows.map((row, r) => {
        const tcs = row.map((cellText, c) => {
          const isHeader = r === 0;
          const cellP = hwpxPara(nextId(), cellText, isHeader ? 55 : 56, 0, isHeader ? 46 : 5);
          return `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="33">`
            + `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${cellP}</hp:subList>`
            + `<hp:cellAddr colAddr="${c}" rowAddr="${r}"/><hp:cellSpan colSpan="1" rowSpan="1"/>`
            + `<hp:cellSz width="${colWidth}" height="${HWPX_TABLE_ROW_HEIGHT}"/>`
            + `<hp:cellMargin left="141" right="141" top="141" bottom="141"/></hp:tc>`;
        }).join("");
        return `<hp:tr>${tcs}</hp:tr>`;
      }).join("");
      const tbl = `<hp:tbl id="${nextHwpxTblId()}" zOrder="1" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${rowCnt}" colCnt="${colCnt}" cellSpacing="0" borderFillIDRef="33" noAdjust="0">`
        + `<hp:sz width="${HWPX_TABLE_USABLE_WIDTH}" widthRelTo="ABSOLUTE" height="${HWPX_TABLE_ROW_HEIGHT * rowCnt}" heightRelTo="ABSOLUTE" protect="0"/>`
        + `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>`
        + `<hp:outMargin left="0" right="0" top="141" bottom="141"/>`
        + `<hp:inMargin left="141" right="141" top="141" bottom="141"/>`
        + trs
        + `</hp:tbl>`;
      return `<hp:p id="${nextId()}" paraPrIDRef="7" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="5">${tbl}</hp:run></hp:p>`;
    };

    // 문단 하나 = hp:p 하나(줄바꿈 단위). id=1은 secPr 전용 예약이라 본문은 2부터 시작한다.
    // 간단한 마크다운(#/##/### 제목, **볼드**, -/* 목록, | 표 |)을 인식해 hwpx 서식(글자 크기·굵게·표)으로 변환한다.
    const buildHwpxSection0 = (bodyText) => {
      const lines = bodyText.replace(/\r\n/g, "\n").split("\n");
      let pid = 1;
      const nextId = () => ++pid;
      const paras = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const rowMatch = HWPX_TABLE_ROW_RE.exec(line);
        if (rowMatch && i + 1 < lines.length && HWPX_TABLE_SEP_RE.test(lines[i + 1])) {
          const rows = [rowMatch[1].split("|").map(c => c.trim())];
          let j = i + 2;
          while (j < lines.length) {
            const m2 = HWPX_TABLE_ROW_RE.exec(lines[j]);
            if (!m2) break;
            rows.push(m2[1].split("|").map(c => c.trim()));
            j++;
          }
          paras.push(buildHwpxTable(rows, nextId));
          i = j;
          continue;
        }
        const headMatch = HWPX_HEADING_RE.exec(line);
        if (headMatch) {
          const level = headMatch[1].length;
          const text = headMatch[2].trim();
          paras.push(level <= 2 ? hwpxPara(nextId(), text, 52, 0, 44) : hwpxPara(nextId(), text, 53, 0, 45));
          i++;
          continue;
        }
        if (line.trim() === "") {
          paras.push(hwpxParaEmpty(nextId()));
          i++;
          continue;
        }
        const bulletMatch = HWPX_BULLET_RE.exec(line);
        if (bulletMatch) {
          const segments = splitInlineBold("• " + bulletMatch[1].trim(), 5, 46);
          paras.push(hwpxParaMultiRun(nextId(), segments, 54, 0));
          i++;
          continue;
        }
        const segments = splitInlineBold(line, 5, 46);
        paras.push(hwpxParaMultiRun(nextId(), segments, 7, 0));
        i++;
      }
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes" ?><hs:sec ${HWPX_NS}>${HWPX_SECPR}${paras.join("")}</hs:sec>`;
    };

    const base64ToUint8Array = (b64) => {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    };

    const downloadAsHwpx = async (bodyText, filenameBase) => {
      const JSZipLib = await loadJSZip();
      const zip = await JSZipLib.loadAsync(base64ToUint8Array(HWPX_BASE_TEMPLATE_B64));
      zip.file("Contents/section0.xml", buildHwpxSection0(bodyText));
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${filenameBase}.hwpx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    const hwpxFilenameFrom = (text, fallback) => {
      const m = text.match(/제목\s+(.+)/);
      const raw = (m ? m[1] : fallback).trim().slice(0, 40).replace(/[\\/:*?"<>|]/g, "").trim();
      return raw || fallback;
    };

    // ── TabbedDocument ────────────────────────────────────────────
    function TabbedDocument({ content }) {
      // 엑셀 블록은 기안문/첨부 구분자와 독립적으로 먼저 추출·제거한 뒤, 남은 텍스트에 기존 기안문/첨부 파싱을 적용한다
      // (블록 등장 순서가 섞여도 before/after 텍스트에 구분자 원문이 그대로 남지 않도록).
      const excelM = content.match(/===엑셀시작===([\s\S]*?)===엑셀끝===/);
      const excel = excelM ? excelM[1].trim() : null;
      const rest = excelM ? content.replace(excelM[0], "").trim() : content;
      const draftM = rest.match(/===기안문시작===([\s\S]*?)===기안문끝===/);
      const attachM = rest.match(/===첨부시작===([\s\S]*?)===첨부끝===/);
      const beforeM = rest.match(/^([\s\S]*?)===기안문시작===/);
      const afterM = rest.match(/===첨부끝===([\s\S]*)$/);
      const draft = draftM ? draftM[1].trim() : null;
      const attach = attachM ? attachM[1].trim() : null;
      const before = beforeM ? beforeM[1].trim() : (!draftM ? rest : "");
      const after = afterM ? afterM[1].trim() : "";
      const [activeTab, setActiveTab] = useState(excel ? "엑셀" : "기안문");
      const [downloading, setDownloading] = useState(false);
      const [downloadError, setDownloadError] = useState("");
      if (!draft && !attach && !excel) return <MarkdownRenderer text={content} />;
      const tabs = [];
      if (excel) tabs.push("엑셀");
      if (draft) tabs.push("기안문");
      if (attach) tabs.push("첨부문서");

      const handleDownload = async () => {
        if (downloading) return;
        setDownloading(true);
        setDownloadError("");
        try {
          if (activeTab === "엑셀") {
            await downloadAsExcel(excel, "수서_선정목록");
          } else {
            const text = activeTab === "기안문" ? draft : attach;
            const filenameBase = hwpxFilenameFrom(text, activeTab);
            await downloadAsHwpx(text, filenameBase);
          }
        } catch (e) {
          setDownloadError(e.message || "파일 생성에 실패했습니다.");
        } finally {
          setDownloading(false);
        }
      };

      return (
        <div>
          {before ? <div style={{ marginBottom: "12px" }}><MarkdownRenderer text={before} /></div> : null}
          <div style={{ border: "1px solid var(--line)", borderRadius: "var(--radius)", overflow: "hidden" }}>
            <div style={{ display: "flex", alignItems: "center", background: "var(--bg-sunken)", borderBottom: "1px solid var(--line)" }}>
              {tabs.map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{
                  padding: "8px 20px", border: "none",
                  background: activeTab === tab ? "white" : "transparent",
                  color: activeTab === tab ? "var(--chrome)" : "var(--ink-faint)",
                  fontWeight: activeTab === tab ? "700" : "400",
                  fontSize: "13px", cursor: "pointer",
                  borderBottom: activeTab === tab ? "2px solid var(--chrome)" : "2px solid transparent",
                  fontFamily: "inherit", marginBottom: "-1px",
                }}>
                  {tab}
                </button>
              ))}
              <button onClick={handleDownload} disabled={downloading}
                style={{ marginLeft: "auto", marginRight: "10px", padding: "5px 10px", border: "1px solid var(--line-strong)", borderRadius: "6px", background: "white", color: "var(--chrome)", fontSize: "12px", fontWeight: "700", cursor: downloading ? "not-allowed" : "pointer", fontFamily: "inherit" }}
              >{downloading ? "생성 중…" : activeTab === "엑셀" ? "⬇ Excel 다운로드" : "⬇ hwpx 다운로드"}</button>
            </div>
            <div style={{ padding: "16px", background: "white" }}>
              {activeTab === "엑셀" && excel
                ? <MarkdownRenderer text={excel} />
                : null}
              {activeTab === "기안문" && draft
                ? <div style={{ fontFamily: "var(--font-mono)", fontSize: "13px", lineHeight: "2", whiteSpace: "pre-wrap", color: "var(--ink)" }}>{draft}</div>
                : null}
              {activeTab === "첨부문서" && attach
                ? <MarkdownRenderer text={attach} />
                : null}
            </div>
            {downloadError ? <div style={{ padding: "0 16px 12px", fontSize: "12px", color: "var(--warn)" }}>{downloadError}</div> : null}
          </div>
          {after ? <div style={{ marginTop: "12px" }}><MarkdownRenderer text={after} /></div> : null}
        </div>
      );
    }

    // ── 통합 보고서 → PDF 인쇄 ────────────────────────────────────
    // chief-coordinator가 ===보고서시작===~===보고서끝===로 감싼 통합 계획서/결과보고를
    // A4 인쇄용 HTML로 변환해 새 창에서 브라우저 인쇄(=PDF로 저장)한다. 한글은 벡터로
    // 렌더되어 선택·검색 가능한 PDF가 나온다(래스터화 라이브러리 대비 안전). 단독 행 `---`는
    // 페이지 넘김으로 처리한다.
    const escapeReportHtml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inlineReportMd = (s) => escapeReportHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

    const reportMdToPrintHtml = (md) => {
      const lines = (md || "").split("\n");
      const out = [];
      let i = 0, tbuf = [], inTable = false, inList = false;
      const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
      const flushTable = () => {
        if (!tbuf.length) { inTable = false; return; }
        closeList();
        const rows = parseMarkdownTableRows(tbuf);
        let t = '<table class="rp-tbl">';
        rows.forEach((row, ri) => {
          t += "<tr>";
          row.forEach(cell => { const T = ri === 0 ? "th" : "td"; t += `<${T}>${inlineReportMd(cell)}</${T}>`; });
          t += "</tr>";
        });
        t += "</table>";
        out.push(t); tbuf = []; inTable = false;
      };
      while (i < lines.length) {
        const line = lines[i];
        const tr = line.trim();
        if (tr.startsWith("|") && tr.includes("|")) { inTable = true; tbuf.push(line); i++; continue; }
        if (inTable) flushTable();
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(tr)) { closeList(); out.push('<div class="rp-break"></div>'); i++; continue; }
        if (line.startsWith("# ")) { closeList(); out.push(`<h1>${inlineReportMd(line.slice(2))}</h1>`); }
        else if (line.startsWith("## ")) { closeList(); out.push(`<h2>${inlineReportMd(line.slice(3))}</h2>`); }
        else if (line.startsWith("### ")) { closeList(); out.push(`<h3>${inlineReportMd(line.slice(4))}</h3>`); }
        else if (/^[-*]\s/.test(line)) { if (!inList) { out.push('<ul class="rp-ul">'); inList = true; } out.push(`<li>${inlineReportMd(line.replace(/^[-*]\s/, ""))}</li>`); }
        else if (/^\d+\.\s/.test(line)) { closeList(); out.push(`<p class="rp-num">${inlineReportMd(line)}</p>`); }
        else if (tr.startsWith("※")) { closeList(); out.push(`<p class="rp-note">${inlineReportMd(line)}</p>`); }
        else if (tr === "") { if (!inList) out.push('<div class="rp-sp"></div>'); }
        else { closeList(); out.push(`<p>${inlineReportMd(line)}</p>`); }
        i++;
      }
      if (inTable) flushTable();
      closeList();
      return out.join("\n");
    };

    const makeLimiter = (max) => {

          Promise.resolve().then(fn).then(resolve, reject).finally(() => { active--; pump(); });
