      const [expandedDispatch, setExpandedDispatch] = useState(null); // "runId:idx" — 진행 패널 결과 전문 펼침

      const bottomRef   = useRef(null);
      const chiefBottomRef = useRef(null); // 총괄 채팅(홈) 하단 앵커 — 새 메시지·진행 갱신 시 스크롤
      const chiefInputRef = useRef(null);  // 총괄 채팅 입력창 — 자동 높이 조절
      const textareaRef = useRef(null);
      const stepInputRefs = useRef({}); // "planId:stepIndex" 등 draftKey → 계획 화면 답변용 textarea DOM 노드

      // 계획 화면의 답변/추가 지시 textarea들은 개수가 동적이라 useEffect 대신
      // 이벤트에서 바로 높이를 재는 방식으로 최대 120px까지 자동으로 늘린다.
      const autoGrow = (e) => {
        e.target.style.height = "auto";
        e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
      };

      // ── Navigation ──
      const goHome  = () => { setMainView("home"); };
      const goAgent = (agentId) => { setMainView("agent"); setActiveTab(agentId); };
      const goPlan  = (planId)  => { setMainView("plan"); setSelectedPlanId(planId); };

      // ── Agent lookup helpers (코드 칩 / 이름 / 소속 도메인) ──
      // 레지스트리 기반 에이전트(B/A/C/F) 설정을 id로 조회 — 순서는 무관, 각 레지스트리 id는 서로 겹치지 않음
      const configFor = (id) => B_AGENTS_CONFIG[id] || A_AGENTS_CONFIG[id] || C_AGENTS_CONFIG[id] || F_AGENTS_CONFIG[id] || DM_AGENTS_CONFIG[id];
      const codeFor   = (id) => (configFor(id) && configFor(id).sub) || (AGENT_STYLES[id] && AGENT_STYLES[id].label) || id;
      const nameFor   = (id) => (configFor(id) && configFor(id).name) || (DOMAINS.flatMap(d => d.agents).find(a => a.id === id) || {}).name || id;
      const domainOf  = (id) => DOMAINS.find(d => d.agents.some(a => a.id === id));

      // 임의 에이전트 id에 대한 시스템 프롬프트 조회 (activeTab 전용 sysPrompt 계산과 동일한 매핑)
      const systemPromptFor = (id) => {
        if (configFor(id)) return configFor(id).systemPrompt;
        switch (id) {
          case "planner":             return PLANNER_SYSTEM_PROMPT;
          case "reading-club":        return buildClubSystemPrompt(clubType);
          case "ll-planner":          return LL_PLANNER_SYSTEM_PROMPT;
          case "ll-recruiter":        return LL_RECRUITER_SYSTEM_PROMPT;
          case "ll-student-recruiter":return LL_STUDENT_RECRUITER_SYSTEM_PROMPT;
          case "ll-operation-log":    return LL_OPERATION_LOG_SYSTEM_PROMPT;
          case "instructor-sourcing": return D03_SYSTEM_PROMPT;
          case "d06-mobile-library":  return D06_SYSTEM_PROMPT;
          default:                    return LL_RESULT_REPORTER_SYSTEM_PROMPT;
        }
      };

      // 응답 첫 줄을 타임라인 카드용 1줄 요약으로 축약
      const summarizeReply = (text) => {
        const firstLine = (text || "").split("\n").map(s => s.trim()).find(Boolean) || "";
        const clean = firstLine.replace(/^#+\s*/, "").replace(/\*\*/g, "");
        return clean.length > 70 ? clean.slice(0, 70) + "…" : clean;
      };

      // 임의의 탭 id에 대한 현재 메시지 배열 조회 (렌더링/전송/홈 목록에서 공통 사용)
      const getTabMessages = (tab) =>
        configFor(tab) ? bAgentMsgs[tab]
        : tab === "planner" ? plannerMsgs
        : tab === "reading-club" ? clubMsgs
        : tab === "ll-planner" ? llPlannerMsgs
        : tab === "ll-recruiter" ? llRecruiterMsgs
        : tab === "ll-student-recruiter" ? llStudentRecruiterMsgs
        : tab === "ll-operation-log" ? llOperationLogMsgs
        : tab === "instructor-sourcing" ? d03Msgs
        : tab === "d06-mobile-library" ? d06Msgs
        : llResultReporterMsgs;

      const selectedPlan = plans.find(p => p.id === selectedPlanId);

      const deletePlan = (planId) => {
        if (!window.confirm("이 작업(채팅)을 삭제하시겠습니까? 되돌릴 수 없습니다.")) return;
        setPlans(prev => prev.filter(p => p.id !== planId));
        if (selectedPlanId === planId) goHome();
      };

      // ── Message / prompt mapping ──
      const isBTab     = !!configFor(activeTab);
      const messages   = getTabMessages(activeTab);
      const setMsgs    = isBTab ? (updater => setBAgentMsgs(prev => ({ ...prev, [activeTab]: typeof updater === "function" ? updater(prev[activeTab]) : updater }))) : activeTab === "planner" ? setPlannerMsgs : activeTab === "reading-club" ? setClubMsgs : activeTab === "ll-planner" ? setLlPlannerMsgs : activeTab === "ll-recruiter" ? setLlRecruiterMsgs : activeTab === "ll-student-recruiter" ? setLlStudentRecruiterMsgs : activeTab === "ll-operation-log" ? setLlOperationLogMsgs : activeTab === "instructor-sourcing" ? setD03Msgs : activeTab === "d06-mobile-library" ? setD06Msgs : setLlResultReporterMsgs;
      const sysPrompt  = isBTab ? configFor(activeTab).systemPrompt : activeTab === "planner" ? PLANNER_SYSTEM_PROMPT : activeTab === "reading-club" ? buildClubSystemPrompt(clubType) : activeTab === "ll-planner" ? LL_PLANNER_SYSTEM_PROMPT : activeTab === "ll-recruiter" ? LL_RECRUITER_SYSTEM_PROMPT : activeTab === "ll-student-recruiter" ? LL_STUDENT_RECRUITER_SYSTEM_PROMPT : activeTab === "ll-operation-log" ? LL_OPERATION_LOG_SYSTEM_PROMPT : activeTab === "instructor-sourcing" ? D03_SYSTEM_PROMPT : activeTab === "d06-mobile-library" ? D06_SYSTEM_PROMPT : LL_RESULT_REPORTER_SYSTEM_PROMPT;
      const agentStyle = AGENT_STYLES[activeTab] || (isBTab ? { gradient: configFor(activeTab).gradient, label: configFor(activeTab).sub } : AGENT_STYLES["planner"]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      // 총괄 채팅(홈)도 새 메시지·진행 패널 갱신마다 하단으로 스크롤한다.
      useEffect(() => {
        if (mainView === "home") chiefBottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chiefMsgs, chiefRuns, chiefLoading, mainView]);

      // 입력창 자동 높이 조절 — rows=1 고정 높이에 flex:1만 걸려 있으면 줄바꿈된 내용이
      // 옆으로 밀리거나 잘려 보인다. 입력 내용에 맞춰 최대 120px까지 늘렸다가 그 이상은 스크롤한다.
      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }, [input]);

      useEffect(() => {
        const el = chiefInputRef.current;
        if (!el) return;
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }, [chiefInput]);

      // ── API ──
      // overrides.model / overrides.plugins로 사이드바 선택 모델·OpenRouter 플러그인(예: 웹 검색)을 개별 호출 단위로 바꿀 수 있다.
      // overrides.reasoning으로 호출 단위 추론 예산도 바꿀 수 있다 — 예: 문서 생성처럼 판단이 적은 작업은
      // { enabled: false }, 반대로 복잡한 위임 판단은 { max_tokens: 2000 }.
      const requestApi = async (apiMessages, temperature, overrides = {}) => {
        let res;
        try {
          res = await fetch(CHAT_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: overrides.model || chatModel, max_tokens: overrides.max_tokens || 8000, temperature, messages: apiMessages, reasoning: overrides.reasoning || { max_tokens: REASONING_MAX_TOKENS }, ...(overrides.plugins ? { plugins: overrides.plugins } : {}) }),
            ...(overrides.signal ? { signal: overrides.signal } : {}),
          });
        } catch (e) {
          if (e && e.name === "AbortError") throw e;
          throw new Error("서버에 연결할 수 없습니다. 네트워크를 확인해주세요.");
        }
        const contentType = res.headers.get("content-type") || "";

        // 스트리밍 응답 — SSE 청크를 누적하며 overrides.onChunk로 실시간 진행 상황을 전달한다.
        if (contentType.includes("text/event-stream") && res.body) {
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let accumulated = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop(); // 마지막 줄은 다음 청크와 이어질 수 있으니 남겨둔다
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("data:")) continue;
              const payload = trimmed.slice(5).trim();
              if (!payload || payload === "[DONE]") continue;
              let json;
              try { json = JSON.parse(payload); } catch { continue; } // 청크 경계에 걸친 불완전한 조각은 건너뜀
              if (json.error) throw new Error(typeof json.error === "string" ? json.error : (json.error.message || JSON.stringify(json.error)));
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                accumulated += delta;
                if (overrides.onChunk) overrides.onChunk(accumulated);
              }
            }
          }
          return accumulated || "응답을 가져오지 못했습니다.";
        }

        // 스트리밍이 아닌 응답(주로 요청 자체가 거부된 에러) — 기존 방식대로 처리
        const rawText = await res.text();
        if (!rawText || !rawText.trim()) {
          if (res.status === 404) throw new Error("채팅 API 엔드포인트를 찾을 수 없습니다. Vercel 배포 상태를 확인해주세요.");
          throw new Error(`HTTP ${res.status}: 빈 응답이 반환되었습니다. 잠시 후 다시 시도해주세요.`);
        }
        let data;
        try { data = JSON.parse(rawText); } catch {
          if (res.status === 404) throw new Error("채팅 API 엔드포인트를 찾을 수 없습니다. Vercel 배포 상태를 확인해주세요.");
          throw new Error(`HTTP ${res.status}: 응답을 파싱할 수 없습니다.`);
        }
        // 404여도 OpenRouter/모델 쪽 에러 메시지(JSON body)가 있으면 그걸 우선 보여준다 — "엔드포인트 없음"으로 뭉개지 않음
        if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error)));
        if (res.status === 404) throw new Error("채팅 API 엔드포인트를 찾을 수 없습니다. Vercel 배포 상태를 확인해주세요.");
        if (!res.ok) throw new Error(`채팅 API 요청에 실패했습니다. (HTTP ${res.status})`);
        return data.choices?.[0]?.message?.content ?? "응답을 가져오지 못했습니다.";
      };

      // B-03 전용: api/books.js로 실제 Supabase public.books 조회를 요청한다.
      const runBooksQuery = async (body) => {
        let res;
        try {
          res = await fetch(BOOKS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } catch (e) {
          throw new Error("DB 조회 서버에 연결할 수 없습니다. 네트워크를 확인해주세요.");
        }
        const rawText = await res.text();
        if (!rawText || !rawText.trim()) throw new Error(`HTTP ${res.status}: DB 조회에서 빈 응답이 반환되었습니다.`);
        let data;
        try { data = JSON.parse(rawText); } catch { throw new Error(`HTTP ${res.status}: DB 조회 응답을 파싱할 수 없습니다.`); }
        if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error)));
        if (!res.ok) throw new Error(`DB 조회 요청에 실패했습니다. (HTTP ${res.status})`);
        return data;
      };

      // A-03 전용: api/budget.js로 실제 Supabase 예산 잔액 조회·집행 기록을 요청한다.
      const runBudgetQuery = async (body) => {
        let res;
        try {
          res = await fetch(BUDGET_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } catch (e) {
          throw new Error("예산 서버에 연결할 수 없습니다. 네트워크를 확인해주세요.");
        }
        const rawText = await res.text();
        if (!rawText || !rawText.trim()) throw new Error(`HTTP ${res.status}: 예산 조회에서 빈 응답이 반환되었습니다.`);
        let data;
        try { data = JSON.parse(rawText); } catch { throw new Error(`HTTP ${res.status}: 예산 조회 응답을 파싱할 수 없습니다.`); }
        if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error)));
        if (!res.ok) throw new Error(`예산 조회 요청에 실패했습니다. (HTTP ${res.status})`);
        return data;
      };

      // A-03 전용: ===BUDGET_QUERY===...===BUDGET_QUERY_END=== 블록이 더 이상 나오지 않을 때까지(최대 4회)
      // api/budget.js를 호출해 실제 잔액 조회·집행 결과를 대화에 주입한 뒤 최종 답변을 받는다.
      // (조회 1회 → 매칭 확인 → 집행 1회, 두 단계가 보통이라 왕복이 여러 번 필요할 수 있다.)
      const resolveBudgetReply = async (prompt, convoMessages, firstReply) => {
        let reply = firstReply;
        let convo = convoMessages;
        let rounds = 0;
        while (parseBudgetQueryBlock(reply) && rounds < 4) {
          const req = parseBudgetQueryBlock(reply);
          let followUpContent;
          try {
            const result = await runBudgetQuery(req);
            followUpContent = `[예산 조회/집행 결과]\n${JSON.stringify(result)}`;
          } catch (e) {
            followUpContent = `[예산 조회/집행 실패: ${e.message}]`;
          }
          convo = [...convo, { role: "assistant", content: reply }, { role: "user", content: followUpContent }];
          reply = await callApi(prompt, convo);
          rounds++;
        }
        return reply;
      };

      // B-01 전용: OpenRouter 경유로 Gemini + 구글 검색 그라운딩(native 웹 검색 플러그인)을 호출해
      // 신간·화제 도서를 웹에서 직접 탐색한다. engine:"native"를 명시해 Exa 폴백이 아닌 실제 구글 검색을 강제한다.
      // (2026-07-10 테스트 전환. 결과가 만족스럽지 않으면 아래 requestGeminiApi/GEMINI_CHAT_API_URL 경로로 되돌릴 것.)
      const requestB01SearchApi = async (systemPrompt, msgs) => {
        const apiMessages = [
          { role: "system", content: systemPrompt },
          ...msgs.map(m => ({ role: m.role, content: m.content })),
        ];
        return requestApi(apiMessages, 0.7, {
          // native 웹서치는 Gemini 3 계열부터 지원(2.5 이하는 미지원 → OpenRouter가 404 반환). 2026-07-10 확인.
          model: "google/gemini-3.5-flash",
          plugins: [{ id: "web", engine: "native" }],
        });
      };

      // [백업 경로 — 현재 미사용] B-01을 Gemini 다이렉트 API(api/gemini.js)로 되돌릴 때 callApi에서 다시 연결.
      const requestGeminiApi = async (systemPrompt, msgs) => {
        // Gemini generateContent는 contents가 반드시 user 역할로 시작해야 하고 빈 텍스트 파트를 거부한다.
        // 위반 시 "Request contains an invalid argument."(INVALID_ARGUMENT, HTTP 400)를 반환한다.
        // 직접 탭은 첫 메시지가 인사말(role:"assistant")이라 그대로 보내면 model 역할로 시작해 400이 난다
        // (DM/chief 위임 경로는 user 메시지로 시작해 문제없음). 선두의 비-user 메시지와 빈 내용을 제거한다.
        const contents = msgs
          .filter(m => typeof m.content === "string" && m.content.trim())
          .map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));
        while (contents.length && contents[0].role !== "user") contents.shift();
        if (!contents.length) throw new Error("Gemini에 보낼 유효한 대화 내용이 없습니다.");
        let res;
        try {
          res = await fetch(GEMINI_CHAT_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ systemInstruction: systemPrompt, contents }),
          });
        } catch (e) {
          throw new Error("Gemini 서버에 연결할 수 없습니다. 네트워크를 확인해주세요.");
        }
        const rawText = await res.text();
        if (res.status === 404) throw new Error("Gemini API 엔드포인트를 찾을 수 없습니다. Vercel 배포 상태를 확인해주세요.");
        if (!rawText || !rawText.trim()) throw new Error(`HTTP ${res.status}: Gemini에서 빈 응답이 반환되었습니다.`);
        let data;
        try { data = JSON.parse(rawText); } catch { throw new Error(`HTTP ${res.status}: Gemini 응답을 파싱할 수 없습니다.`); }
        if (data.error) {
          // Gemini 오류는 message가 뭉뚱그려질 때가 많아(예: "Request contains an invalid argument.")
          // status와 details의 reason/description을 함께 노출해 원인 파악을 돕는다.
          const e = data.error;
          if (typeof e === "string") throw new Error(e);
          const extras = [e.status, ...(Array.isArray(e.details) ? e.details.map(d => d.reason || d.description || d.fieldViolations?.[0]?.description) : [])].filter(Boolean);
          throw new Error((e.message || JSON.stringify(e)) + (extras.length ? ` (${extras.join(" / ")})` : ""));
        }
        if (!res.ok) throw new Error(`Gemini API 요청에 실패했습니다. (HTTP ${res.status})`);
        const parts = data.candidates?.[0]?.content?.parts || [];
        const text = parts.map(p => p.text || "").join("");
        return text || "응답을 가져오지 못했습니다.";
      };

      // B-01 전용: SEOJI(국립중앙도서관 서지정보유통지원시스템)를 결정론적으로 수집. 2026-07-26 하이브리드
      // 재설계에서 이 함수는 "보충 수집원" 역할 — 그라운딩 발굴·검증으로 채우지 못한 부족분을 메운다.
      // window({startDate,endDate} YYYYMMDD)가 주어지면 SEOJI 출간일 범위 검색(start/end_publish_date +
      // sort=PUBLISH_PREDATE)을 쓴다(예전 등록일 INPUT_DATE 정렬은 CIP 등록이 출간보다 앞서 7~8월에 쏠리는
      // 버그가 있었음 — 2026-07-26 확인). window가 없으면 종전대로 등록일 최신순.
      // 전자책 제외(ebook_yn=N)·종이책(form=종이책)은 서버측 필터, 제본형태는 B01_ALLOWED_FORM_DETAILS만 남긴다.
      const fetchB01SeojiCandidates = async (window = null, limit = 150) => {
        const seen = new Set();
        const raw = [];
        await Promise.all([1, 2].map(async (pageNo) => {
          try {
            const body = { ebookYn: "N", form: "종이책", orderBy: "DESC", pageNo, pageSize: 200 };
            if (window && window.startDate) {
              body.startDate = window.startDate; body.endDate = window.endDate; body.sort = "PUBLISH_PREDATE";
            } else {
              body.sort = "INPUT_DATE";
            }
            const res = await bibApiLimit(() => fetch(SEOJI_API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }));
            const data = await res.json();
            (data.docs || []).forEach(doc => raw.push(doc));
          } catch (e) {
            // 특정 페이지 실패는 건너뛰고 나머지 결과로 계속 진행
          }
        }));
        const candidates = [];
        raw.forEach(doc => {
          const isbn = (doc.EA_ISBN || "").trim();
          const title = (doc.TITLE || "").trim();
          const formDetail = (doc.FORM_DETAIL || "").trim();
          if (!isbn || !title) return; // ISBN·서명 없는 이상치 제외
          if (!B01_ALLOWED_FORM_DETAILS.includes(formDetail)) return; // 무선제본/양장본/보드북 외 제본형태 제외
          if (/세트|전\d+권/.test(title)) return; // 묶음 상품 제외
          if (seen.has(isbn)) return;
          seen.add(isbn);
          const price = /^\d+$/.test(doc.PRE_PRICE || "") ? doc.PRE_PRICE : "";
          candidates.push({
            title, isbn, formDetail,
            pubdate: doc.PUBLISH_PREDATE || doc.REAL_PUBLISH_DATE || "",
            author: (doc.AUTHOR || "").trim(),
            publisher: (doc.PUBLISHER || "").trim(),
            price, link: "",
          });
        });
        return await enrichB01PriceViaNaver(candidates.slice(0, limit));
      };

      // SEOJI는 CIP 등록 시점의 예정 정가(PRE_PRICE)를 제공하지만, 등록 직후라 아직 정가가 확정되지 않은
      // 경우가 흔하다. 정가가 비어있는 후보만 네이버 책 검색(2차)으로 제목 조회해 ISBN이 정확히 일치하는
      // 결과가 있으면 정가·표지·링크를 보완한다. 신간이라 네이버 쇼핑에 아직 등록 안 된 경우도 많아 실패해도
      // "확인필요"로 남기고 전체 수집을 막지 않는다(전체 후보를 다 재조회하지 않아 호출량도 제어됨).
      const enrichB01PriceViaNaver = async (candidates) => {
        const suspects = candidates.filter(c => !c.price);
        if (!suspects.length) return candidates;
        const enriched = await Promise.all(suspects.map(async (c) => {
          try {
            const res = await bibApiLimit(() => fetch(NAVER_BOOKS_API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: c.title, display: 5, sort: "sim" }),
            }));
            const data = await res.json();
            const match = (data.items || []).find(item => (item.isbn || "").trim() === c.isbn);
            if (match) {
              return {
                ...c,
                price: match.discount && match.discount !== "0" ? match.discount : c.price,
                link: match.link || "",
                naverChecked: true,
              };
            }
            return { ...c, naverChecked: true };
          } catch (e) {
            return c; // 네이버 조회 실패 시 기존 상태 그대로 유지
          }
        }));
        const byIsbn = new Map(enriched.map(c => [c.isbn, c]));
        return candidates.map(c => byIsbn.get(c.isbn) || c);
      };

      // 확정 후보를 B-01에게 보낼 텍스트 블록으로 직렬화.
      // ⚠ 헤더 프리픽스 "[SEOJI 신간 후보 수집 결과"와 불릿 "- ... | ISBN: xxx | ..." 형식은 반드시 유지한다 —
      // extractKnownB01Isbns 가드 정규식과 단일탭 재수집 체크(includes)가 이 형식에 의존한다.
      const formatB01SeojiBlock = (candidates, opts = {}) => {
        if (!candidates.length) return "\n\n[SEOJI 신간 후보 수집 결과]\n(확정 후보 없음 — 그라운딩 발굴·SEOJI 검증에서 조건에 맞는 실존 신간을 찾지 못했거나 API 응답 오류입니다. 지어내지 말고 사실대로 보고하고 재수집 또는 사서 후보 추가를 요청하세요.)";
        const lines = candidates.map(c => {
          const priceLabel = c.price ? `${c.price}원` : "확인필요";
          const pop = c.popnote ? ` | 인기신호: ${c.popnote}` : "";
          const unv = opts.degraded ? " | ⚠미검증(SEOJI 무응답)" : "";
          return `- ${c.title} | 저자: ${c.author || "미상"} | 출판사: ${c.publisher || "미상"} | 출간일: ${c.pubdate || "미상"} | 정가: ${priceLabel} | ISBN: ${c.isbn || "미상"} | 링크: ${c.link || "확인불가"} | 제본: ${c.formDetail || "미상"}${pop}${unv}`;
        });
        if (opts.degraded) {
          // a안: SEOJI 전면 무응답 → 검증·보충 모두 불가. 미검증 발굴분만 참고 제공하고, 부족분은 채우지 않고 미달을 정직 보고.
          return `\n\n[SEOJI 신간 후보 수집 결과 — ⚠ SEOJI 무응답으로 실존 검증·부족분 보충 모두 불가. 아래 ${candidates.length}건은 웹 검색(구글 그라운딩)으로 발굴한 미검증 후보이며 실존·서지가 확인되지 않았습니다. 목표 권수에 미달할 수 있고(SEOJI 무응답으로 보충 불가), 각 후보는 사서 확인이 필수이며 SEOJI 복구 후 재실행을 권장합니다]\n${lines.join("\n")}`;
        }
        const gcount = candidates.filter(c => c.source === "그라운딩→SEOJI확정").length;
        const scount = candidates.length - gcount;
        return `\n\n[SEOJI 신간 후보 수집 결과 — 총 ${candidates.length}건(그라운딩 발굴→SEOJI 실존 검증확정 ${gcount}건 + SEOJI 출간일 수집 보충 ${scount}건). 모두 SEOJI 실존 확정본이며 전자책·부적합제본·정가 5만원 이상·출간창 밖은 제외됨. "인기신호"는 그라운딩 발굴분에만 표기(사회적관심도 근거)]\n${lines.join("\n")}`;
      };

      // B-01 결정론적 검증 가드: KDC가 좁게 지정되는 등 실제 수집 후보와 잘 안 맞는 요청에서
      // 모델(gemini-flash-latest, thinkingBudget:0)이 "절대 규칙"을 어기고 실재하지 않는 도서를
      // 지어내는 사례가 있어(2026-07-16 확인), 프롬프트 준수에만 기대지 않고 코드 레벨에서 한 번 더 막는다.
      // 대화에 실제로 첨부됐던 [SEOJI 신간 후보 수집 결과] 블록에서 ISBN을 모두 모아 "실재 후보 집합"을 만들고,
      // 최종 엑셀 표의 각 행 ISBN을 이 집합과 대조해 없는 행(=허구 도서)은 자동 제외한다.
      const normalizeIsbn = (s) => (s || "").replace(/[^0-9Xx]/g, "").toUpperCase();

      // 반드시 formatB01SeojiBlock()이 실제로 첨부한 데이터 블록(불릿 줄) 안의 ISBN만 인정한다.
      // 메시지 전체를 훑으면 AI가 과거 턴 본문에서 지어낸 책의 "ISBN: xxx" 문구까지 "실재"로
      // 잘못 등록되어(자기 오염), 다음 턴 검증에서 그 허구 ISBN이 통과해버리는 사례가 있었다(2026-07-18 확인).
      const extractKnownB01Isbns = (msgs) => {
        const isbns = new Set();
        const blockRe = /\[SEOJI 신간 후보 수집 결과[^\n]*\]\n((?:- .*(?:\n|$))*)/g;
        const isbnRe = /ISBN:\s*([0-9Xx]+)/g;
        msgs.forEach(m => {
          if (typeof m.content !== "string") return;
          let blockMatch;
          while ((blockMatch = blockRe.exec(m.content))) {
            let isbnMatch;
            isbnRe.lastIndex = 0;
            while ((isbnMatch = isbnRe.exec(blockMatch[1]))) isbns.add(normalizeIsbn(isbnMatch[1]));
          }
        });
        return isbns;
      };

      // ISBN-13 체크디지트 검증 — 화이트리스트 매칭과 무관하게 형식 자체가 무효한 번호를 걸러낸다.
      const isValidIsbn13Checksum = (isbn) => {
        if (!/^\d{13}$/.test(isbn)) return false;
        const digits = isbn.split("").map(Number);
        const sum = digits.slice(0, 12).reduce((acc, d, i) => acc + d * (i % 2 === 0 ? 1 : 3), 0);
        return ((10 - (sum % 10)) % 10) === digits[12];
      };

      const rowsToMarkdownTable = (rows) => {
        if (!rows.length) return "";
        const sep = rows[0].map(() => "---");
        const toLine = (r) => `| ${r.join(" | ")} |`;
        return [toLine(rows[0]), toLine(sep), ...rows.slice(1).map(toLine)].join("\n");
      };

      // 본문에 적힌 "선정 초안: N종"이 실제 최종 표 행 수와 어긋나는 경우(2026-07-18 확인: 45종이라 말하고
      // 표에는 10건만 실린 사례) 표 기준으로 정정한다 — 표는 구조적으로 검증되지만 서술 문구는 모델이 자유
      // 서술하는 부분이라 별도 카운트 불일치가 생길 수 있다.
      const B01_STATED_COUNT_RE = /(선정\s*초안\s*[:：]\s*)(\d+)(\s*종)/;

      const verifyB01ExcelIsbns = (content, knownIsbns) => {
        const excelM = content.match(/===엑셀시작===([\s\S]*?)===엑셀끝===/);
        if (!excelM) return content;
        const rows = parseMarkdownTableRows(excelM[1].trim().split("\n"));
        if (!rows.length) return content;
        const isbnIdx = rows[0].findIndex(h => /isbn/i.test(h));
        let kept, removed = 0;
        if (isbnIdx === -1) {
          kept = rows.slice(1); // ISBN 컬럼 자체가 없으면 존재 검증은 불가 — 건수 정합성만 확인한다
        } else {
          kept = [];
          rows.slice(1).forEach(r => {
            const isbn = normalizeIsbn(r[isbnIdx] || "");
            if (isbn && isValidIsbn13Checksum(isbn) && knownIsbns.has(isbn)) kept.push(r);
            else removed++;
          });
        }

        let result = content;
        if (removed) {
          const newTable = rowsToMarkdownTable([rows[0], ...kept]);
          const warning = `\n\n⚠️ **검증 실패 ${removed}건 자동 제외**: ISBN 형식이 유효하지 않거나 실제 SEOJI 신간 후보 수집 결과에 없는 항목이 포함되어 있어 선정 목록에서 제외했습니다(시스템이 수집하지 않았거나 형식이 올바르지 않은 항목은 존재를 신뢰할 수 없습니다). 지정하신 KDC·조건에 맞는 실제 후보가 부족했을 수 있습니다 — 재수집하거나 사서님이 직접 후보를 추가해 주세요.`;
          result = result.replace(excelM[0], `===엑셀시작===\n${newTable}\n===엑셀끝===`) + warning;
        }

        const countM = result.match(B01_STATED_COUNT_RE);
        if (countM && Number(countM[2]) !== kept.length) {
          const stated = countM[2];
          result = result.replace(B01_STATED_COUNT_RE, `$1${kept.length}$3`)
            + `\n\n⚠️ **선정 건수 표기 정정**: 응답 본문에는 "${stated}종"으로 기재되어 있었으나 실제 최종 선정 목록 표는 ${kept.length}건입니다 — 표 기준으로 정정했습니다.`;
        }

        return result;
      };

      const callApi = async (prompt, msgs, onChunk, opts = {}) => {
        const isPrRequest = prompt.startsWith(PR_SYSTEM_PROMPT);
        const isB01Request = prompt.startsWith(B01_SYSTEM_PROMPT);
        const apiMessages = [
          { role: "system", content: prompt },
          ...msgs.map(m => ({ role: m.role, content: m.content })),
        ];
        // B-01 메인 답변: 2026-07-26부터 직접 Gemini(api/gemini.js) 대신 OpenRouter 경유 Gemini(google/gemini-3.5-flash)로
        // 고정한다. 직접 Gemini 키가 무료 티어라 gemini-3.6-flash 요청이 20 RPM에서 RESOURCE_EXHAUSTED로 막혔음(2026-07-26).
        // OpenRouter 경유로 바꾸면 OpenRouter 크레딧을 쓰고 앱 전체와 통일된다. 서지 정확도는 SEOJI 검증+ISBN 가드가
        // 담당하므로 temperature 0으로 환각을 억제한다. 그라운딩 발굴은 여전히 별도 호출(b01GroundingDiscovery)이다.
        // (구 경로 requestGeminiApi/requestB01SearchApi는 폴백용으로 남겨둠 — 현재 미사용.)
        if (isB01Request) return await requestApi(apiMessages, 0, { model: "google/gemini-3.5-flash", onChunk, ...opts });
        let reply = await requestApi(apiMessages, isPrRequest ? 0.2 : 0.7, { onChunk, ...opts });
        const hasBrokenKorean = /[㐀-䶿一-鿿豈-﫿�]/.test(reply);
        if (isPrRequest && hasBrokenKorean) {
          reply = await requestApi([
            ...apiMessages,
            { role: "assistant", content: reply },
            { role: "user", content: "위 답변의 내용과 형식은 유지하되, 섞여 있는 한자·중국어·일본어 문자와 깨진 글자를 모두 자연스러운 현대 한국어 한글로 고쳐주세요. 설명 없이 교정된 전체 최종본만 출력하세요." },
          ], 0, { onChunk });
        }
        return reply;
      };

      // 스트리밍 청크로 마지막 말풍선을 점진적으로 갱신하는 헬퍼.
      // 최초 청크에서 새 말풍선을 추가(streaming: true로 표시 — 렌더링 쪽에서 깜빡이는 커서를 붙임)하고,
      // 이후 청크는 그 말풍선 내용만 교체한다. finalize(content)로 streaming 플래그를 내려 커서를 없애고
      // 최종본으로 마무리한다(에러 시에도 같은 말풍선을 에러 메시지로 교체해 중복 말풍선이 남지 않게 한다).
      const makeStreamHandler = (applyUpdate, extra = {}) => {
        let started = false;
        const onChunk = (accumulated) => {
          if (!started) {
            started = true;
            applyUpdate(prev => [...prev, { role: "assistant", content: accumulated, streaming: true, ...extra }]);
          } else {
            applyUpdate(prev => {
              const next = [...prev];
              next[next.length - 1] = { ...next[next.length - 1], content: accumulated, streaming: true };
              return next;
            });
          }
        };
        const finalize = (content) => {
          applyUpdate(prev => {
            if (!started) return [...prev, { role: "assistant", content, ...extra }];
            const next = [...prev];
            next[next.length - 1] = { ...next[next.length - 1], content, streaming: false };
            return next;
          });
        };
        return { onChunk, finalize };
      };

      // 총괄 지시 단계의 최초 사용자 메시지 구성 — 러너 첫 실행 및 replyToStep의 구버전 데이터 복구에서 공용
      const buildInitialStepUserMsg = (plan, step, stepIndex) => {
        const prevStep = stepIndex > 0 ? plan.steps[stepIndex - 1] : null;
        let userMsg = `[총괄 지시]\n${plan.command}`;
        if (step.routedBy) {
          userMsg += `\n\n[${nameFor(step.routedBy)} 위임 사항]\n${step.routeNote || "위 지시를 처리해 주세요."}`;
        } else if (prevStep && prevStep.summary) {
          userMsg += `\n\n[이전 단계 처리 요약 — ${nameFor(prevStep.agentId)}]\n${prevStep.summary}`;
        }
        userMsg += `\n\n위 지시에 따라 ${nameFor(step.agentId)} 담당 업무를 처리해 주세요.`;
        return userMsg;
      };

      // ── 총괄 지시 순차 실행 러너 ──
      // plans 안의 각 단계는 agentId별 systemPrompt로 callApi를 순차 호출한다.
      // 한 단계가 끝나면 다음 pending 단계를 "running"으로 바꾸고, 그 변화가 이 effect를 다시 트리거해 다음 호출을 잇는다.
      // 단계가 "needs_review"에서 사용자 답변(replyToStep)으로 다시 "running"이 되면, 처음부터 다시 묻지 않고
      // 그 단계의 누적 대화(step.messages)를 이어서 같은 에이전트에게 보낸다.
      useEffect(() => {
        plans.forEach(plan => {
          const idx = plan.steps.findIndex(s => s.status === "running");
          if (idx === -1) return;
          const key = plan.id + ":" + idx;
          if (runningStepsRef.current.has(key)) return;
          runningStepsRef.current.add(key);

          const step = plan.steps[idx];
          const priorMessages = step.messages || []; // 구버전 저장 데이터(필드 없음) 방어
          const callMessages = priorMessages.length === 0
            ? [{ role: "user", content: buildInitialStepUserMsg(plan, step, idx) }]
            : priorMessages;

          callApi(systemPromptFor(step.agentId) + ORCHESTRATION_HITL_SUFFIX, callMessages)
            .then(reply => {
              const needsReview = /⚠/.test(reply); // 시스템 프롬프트들이 사서 확인 필요 지점에 공통으로 ⚠️를 표기하는 관례를 신호로 사용 (오케스트레이션 접미사로 전 에이전트에 강제)
              // 도메인 에이전트(DM-0x)가 리프에 위임을 확정한 턴에는 ROUTE 블록이 붙는다 — 파싱해 계획에 다음 단계로 끼워 넣는다.
              const route = !needsReview ? parseRouteBlock(reply) : null;
              const displayReply = route ? stripRouteBlock(reply) : reply;
              const newMessages = [...callMessages, { role: "assistant", content: reply }];
              setPlans(prev => prev.map(p => {
                if (p.id !== plan.id) return p;
                const steps = p.steps.map((s, i) =>
                  i === idx ? { ...s, status: needsReview ? "needs_review" : "done", summary: summarizeReply(displayReply), result: displayReply, isError: false, messages: newMessages } : s
                );
                if (!needsReview) {
                  if (route) {
                    const routedSteps = route.targets.map((agentId, i) => ({
                      agentId,
                      label: nameFor(agentId),
                      status: i === 0 ? "running" : "pending",
                      summary: i === 0 ? "실행 준비 중…" : `${nameFor(step.agentId)} 위임 대기 중…`,
                      result: null,
                      isError: false,
                      messages: [],
                      routedBy: step.agentId,
                      routeNote: route.note,
                    }));
                    steps.splice(idx + 1, 0, ...routedSteps);
                  } else if (idx + 1 < steps.length) {
                    steps[idx + 1] = { ...steps[idx + 1], status: "running", summary: "실행 중…" };
                  }
                }
                const allDone = steps.every(s => s.status === "done");
                return { ...p, steps, status: allDone ? "done" : needsReview ? "needs_review" : "running" };
              }));
              runningStepsRef.current.delete(key);
            })
            .catch(err => {
              setPlans(prev => prev.map(p => {
                if (p.id !== plan.id) return p;
                const steps = p.steps.map((s, i) =>
                  i === idx ? { ...s, status: "needs_review", summary: "오류: " + err.message, result: "오류가 발생했습니다.\n\n" + err.message, isError: true } : s
                );
                return { ...p, steps, status: "needs_review" };
              }));
              runningStepsRef.current.delete(key);
            });
        });
      }, [plans]);

      // plans를 localStorage에 보존 — 새로고침해도 진행 중인 계획이 유지된다
      useEffect(() => {
        try { localStorage.setItem("librarai_plans", JSON.stringify(plans)); } catch {}
      }, [plans]);

      // 리프/도메인 에이전트 탭 대화도 localStorage에 보존 — 새로고침해도 "진행 중인 대화"가 유지된다
      useEffect(() => {
        try {
          localStorage.setItem("librarai_tab_state", JSON.stringify({
            bAgentMsgs, plannerMsgs, clubMsgs, llPlannerMsgs, llRecruiterMsgs,
            llStudentRecruiterMsgs, llOperationLogMsgs, llResultReporterMsgs,
            d03Msgs, d06Msgs, tabActivity,
          }));
        } catch {}
      }, [bAgentMsgs, plannerMsgs, clubMsgs, llPlannerMsgs, llRecruiterMsgs, llStudentRecruiterMsgs, llOperationLogMsgs, llResultReporterMsgs, d03Msgs, d06Msgs, tabActivity]);

      // chief 채팅·실행 기록도 localStorage에 보존 — 새로고침 시 진행 중 run은 복원 단계에서 "중단됨"으로 강등된다
      useEffect(() => {
        try { localStorage.setItem("librarai_chief_state", JSON.stringify({ chiefMsgs, chiefRuns })); } catch {}
      }, [chiefMsgs, chiefRuns]);

      // 사서가 "확인 필요" 단계를 승인 → 완료 처리하고 다음 단계를 시작
      const approveStep = (planId, stepIndex) => {
        setPlans(prev => prev.map(p => {
          if (p.id !== planId) return p;
          const steps = p.steps.map((s, i) => i === stepIndex ? { ...s, status: "done", isError: false } : s);
          if (stepIndex + 1 < steps.length) {
            steps[stepIndex + 1] = { ...steps[stepIndex + 1], status: "running", summary: "실행 중…" };
          }
          const allDone = steps.every(s => s.status === "done");
          return { ...p, steps, status: allDone ? "done" : "running" };
        }));
      };

      // 오류로 멈춘 단계를 재시도
      const retryStep = (planId, stepIndex) => {
        setPlans(prev => prev.map(p => {
          if (p.id !== planId) return p;
          const steps = p.steps.map((s, i) => i === stepIndex ? { ...s, status: "running", summary: "재시도 중…", isError: false } : s);
          return { ...p, steps, status: "running" };
        }));
      };

      // 사서가 "확인 필요" 단계 또는 이미 완료된 이전 단계에 텍스트로 답변 → 같은 에이전트와의 대화를 이어서 진행.
      // stepIndex보다 뒤에 있는 단계는 그 결과가 이 단계의 (수정 전) 응답을 전제로 만들어졌으므로 더 이상 유효하지 않다.
      // 재실행되도록 대기 상태로 되돌린다 — 이렇게 해야 e-01을 고쳤을 때 e-02·e-03이 새 e-01 내용을 반영해 다시 진행된다.
      const replyToStep = (planId, stepIndex, replyText) => {
        const text = (replyText || "").trim();
        if (!text) return;
        setPlans(prev => prev.map(p => {
          if (p.id !== planId) return p;
          const steps = p.steps.map((s, i) => {
            if (i > stepIndex) {
              return { ...s, status: "pending", summary: "이전 단계 완료 후 자동 시작", result: null, isError: false, messages: [] };
            }
            if (i !== stepIndex) return s;
            let messages = s.messages || [];
            if (messages.length === 0) {
              // 이 필드가 없던 구버전 계획이 needs_review 상태로 저장되어 있던 경우:
              // 최초 사용자 메시지 + 마지막으로 알려진 응답(step.result)을 assistant 턴으로 삼아 대화 맥락을 복원한다.
              messages = [
                { role: "user", content: buildInitialStepUserMsg(p, s, stepIndex) },
                { role: "assistant", content: s.result || "" },
              ];
            }
            return { ...s, status: "running", summary: "답변 처리 중…", isError: false, messages: [...messages, { role: "user", content: text }] };
          });
          return { ...p, steps, status: "running" };
        }));
      };

      // DM-0x 탭에서 직접 지시를 받아 ROUTE로 위임된 리프를 순차 실행 — 총괄 지시 러너(위 useEffect, plans 기반)와
      // 같은 규칙(⚠ 있으면 정지, 없으면 다음 리프로 자동 진행)을 별도 plans/단계 UI 없이 그 DM 탭 자신의 대화창에서 재현한다.
      // 각 리프 턴은 bAgentMsgs[tab]에 agentId를 붙여 별도 말풍선으로 쌓이고, ⚠로 멈추면 dmChains[tab]에 진행 상태를 남겨
      // 사서의 다음 메시지가 그 리프와의 대화를 이어가도록 한다.
      // ── 리프 실데이터 사이드이펙트 공용 처리 ─────────────────────────
      // targetId의 응답(reply)에 실데이터 조회 블록이 있으면 프록시 API 왕복 후 최종 응답으로 치환한다.
      // runDmChain / sendMessage / chief 디스패치 러너 세 경로가 공유한다.
      // prompt에는 호출 경로별 접미사(ORCHESTRATION_HITL_SUFFIX 등)가 이미 포함된 상태로 받는다.
      const resolveLeafSideEffects = async (targetId, prompt, msgs, reply) => {
        const roundTrip = async (label, req, runner) => {
          let followUpContent;
          try {
            const result = await runner(req);
            followUpContent = `[${label} 결과]\n${JSON.stringify(result)}`;
          } catch (e) {
            followUpContent = `[${label} 실패: ${e.message}]`;
          }
          return callApi(prompt, [...msgs, { role: "assistant", content: reply }, { role: "user", content: followUpContent }]);
        };
        if (targetId === "b03-duplicate") {
          const dbReq = parseDbQueryBlock(reply);
          if (dbReq) reply = await roundTrip("DB 조회", dbReq, runBooksQuery);
        }
        if (targetId === "a03-budget-management" && parseBudgetQueryBlock(reply)) {
          reply = await resolveBudgetReply(prompt, msgs, reply);
        }
        if (targetId === "planner") {
          const shoppingReq = parseShoppingQueryBlock(reply);
          if (shoppingReq) reply = await roundTrip("네이버 쇼핑 조회", shoppingReq, runShoppingQuery);
        }
        if (targetId === "b02-wishlist") {
          const seojiReq = parseSeojiFormatQueryBlock(reply);
          if (seojiReq) reply = await roundTrip("SEOJI 포맷 조회", seojiReq, runB02SeojiFormatQuery);
        }
        if (targetId === "b01-acquisition") {
          reply = verifyB01ExcelIsbns(reply, extractKnownB01Isbns(msgs));
        }
        return reply;
      };
      // ── B-01 하이브리드 파이프라인 (2026-07-26) ────────────────────────────────
      // SEOJI(CIP 등록 DB)는 등록일이 출간보다 앞서고 학술·정부·자가출판이 뒤섞여 "인기 신간 발굴원"으로
      // 부적합했다(실측: 1~6월 요청에 7~8월 쏠림·쓰레기 후보). 그래서 순서를 역전한다:
      //   ① 구글 그라운딩(tools 없는 Gemini 단독 호출)으로 서점 데이터 기반 인기 신간을 발굴
      //   ② SEOJI로 각 발굴 후보의 실존·서지·적격성을 검증확정 — SEOJI에서 확인 안 되면 제외(할루시네이션 차단)
      //   ③ 부족분은 출간일 필터를 고친 SEOJI 대량수집으로 보충(결정론적·저비용)
      // 스모크테스트 결론상 그라운딩과 tools는 한 호출에 못 섞으므로 발굴은 tools 없는 별도 호출이다.
      const B01_GROUNDING_TIMEOUT_MS = 25000;  // 서버리스 30초 천장 이전에 스스로 취소
      const B01_DISCOVERY_CAP = 20;            // 발굴·검증 배치 상한 = SEOJI 검증 호출 상한(회당 ≤20+보충2). SEOJI 소프트쿼터 대비. 여유 확인되면 상향
      const B01_CANDIDATE_POOL = 150;          // 최종 후보 풀 총량(그라운딩 확정 + SEOJI 보충)

      // "2026년 1월~6월", "상반기", "1월 1일 ~ 6월 30일" 등에서 출간일 창(YYYYMMDD)을 추출. 없으면 null.
      const parseB01PubWindow = (text) => {
        if (typeof text !== "string" || !text) return null;
        const pad = (n) => String(n).padStart(2, "0");
        const ymd = (y, m, d) => `${y}${pad(m)}${pad(d)}`;
        const lastDay = (y, m) => new Date(y, m, 0).getDate();
        let m;
        if ((m = text.match(/(20\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일[^\d]{0,6}?[~\-–]\s*(?:(20\d{2})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) {
          const y1 = +m[1], y2 = +(m[4] || m[1]); return { startDate: ymd(y1, +m[2], +m[3]), endDate: ymd(y2, +m[5], +m[6]) };
        }
        if ((m = text.match(/(20\d{2})\s*년\s*(\d{1,2})\s*월[^\d]{0,6}?[~\-–부터]{1,3}\s*(\d{1,2})\s*월/))) {
          const y = +m[1], m1 = +m[2], m2 = +m[3]; return { startDate: ymd(y, m1, 1), endDate: ymd(y, m2, lastDay(y, m2)) };
        }
        if ((m = text.match(/(20\d{2})\s*년\s*(상반기|하반기)/))) {
          const y = +m[1]; return m[2] === "상반기" ? { startDate: ymd(y, 1, 1), endDate: ymd(y, 6, 30) } : { startDate: ymd(y, 7, 1), endDate: ymd(y, 12, 31) };
        }
        if ((m = text.match(/(20\d{2})\s*년\s*(\d{1,2})\s*월/))) {
          const y = +m[1], mo = +m[2]; return { startDate: ymd(y, mo, 1), endDate: ymd(y, mo, lastDay(y, mo)) };
        }
        if ((m = text.match(/(20\d{2})\s*년/))) { const y = +m[1]; return { startDate: ymd(y, 1, 1), endDate: ymd(y, 12, 31) }; }
        return null;
      };

      // 그라운딩 발굴 응답(파이프 구분 한 줄/도서)을 후보 객체 배열로 파싱.
      const parseB01DiscoveryLines = (text) => {
        const out = [];
        (text || "").split("\n").forEach(line => {
          const l = line.replace(/^[\s\-*\d.)]+/, "").trim(); // 불릿·번호 접두 제거
          if (!l.includes("|")) return;
          const parts = l.split("|").map(s => s.trim());
          const [title, author, publisher, isbnRaw, pubdateRaw, ...rest] = parts;
          if (!title || /^제목$/.test(title)) return; // 헤더 줄 스킵
          const isbn = normalizeIsbn(isbnRaw || "");
          const pd = (pubdateRaw || "").replace(/[^0-9]/g, "");
          out.push({
            title, author: author || "", publisher: publisher || "",
            isbn: /^\d{13}$/.test(isbn) ? isbn : "",
            pubdate: (pubdateRaw && !/미상/.test(pubdateRaw)) ? pubdateRaw.trim() : "",
            popnote: rest.join(" | ").trim(),
          });
        });
        return out;
      };

      // ① 그라운딩 발굴: tools 없는 Gemini 그라운딩 단독 호출로 인기 신간을 찾는다. 실패/타임아웃 시 [] 반환.
      const b01GroundingDiscovery = async (userText, window) => {
        const periodLabel = window
          ? `${window.startDate.slice(0, 4)}년 ${+window.startDate.slice(4, 6)}월~${window.endDate.slice(0, 4)}년 ${+window.endDate.slice(4, 6)}월`
          : "최근 6개월";
        const sys = "너는 공공도서관 수서 사서 보조다. 웹 검색으로 실제 출간이 확인된 국내 신간만 제시한다. 존재가 불확실하거나 검색으로 확인되지 않는 책은 넣지 않는다. 각 도서를 정확히 한 줄로, 필드는 파이프(|)로 구분해 출력하고 그 외 머리말·설명·번호는 쓰지 않는다.";
        const user = `사서 요청: ${userText}\n\n위 요청에 맞춰 ${periodLabel}에 국내 출간된 대중적으로 인기 있거나 화제성이 높은 신간 도서를 최대 ${B01_DISCOVERY_CAP}종 웹 검색으로 찾아라. 공공도서관 수서 대상인 일반 단행본만 — 학술보고서·논문·정부간행물·자가출판·전자책·외국서적은 제외한다. **각 도서의 ISBN13(13자리 숫자)을 서점·출판사 페이지에서 반드시 확인해 포함하라. ISBN을 확인하지 못한 책은 아예 목록에 넣지 마라** — ISBN 없는 항목은 이후 SEOJI 검증에서 자동 탈락한다. 각 도서를 아래 형식의 한 줄로만 출력하라:\n제목 | 저자 | 출판사 | ISBN13(13자리 숫자) | 출간일 YYYY-MM-DD(모르면 미상) | 인기근거(베스트셀러 순위·수상·화제 등 한 구절)`;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), B01_GROUNDING_TIMEOUT_MS);
        try {
          const text = await requestApi(
            [{ role: "system", content: sys }, { role: "user", content: user }],
            0.5,
            { model: "google/gemini-3.5-flash", plugins: [{ id: "web", engine: "native" }], max_tokens: 2500, signal: ctrl.signal }
          );
          return parseB01DiscoveryLines(text).slice(0, B01_DISCOVERY_CAP);
        } catch (e) {
          return []; // 발굴 실패는 전체 수서를 막지 않는다 — 보충 경로로 폴백
        } finally {
          clearTimeout(timer);
        }
      };

      // ② SEOJI 검증확정: 발굴 후보를 SEOJI로 ISBN 조회해 실존·서지·적격성을 확정. 확인 안 되면 제외.
      // SEOJI 호출량·오탐을 줄이기 위해 ISBN이 확보된 후보만 검증한다(ISBN 없는 발굴분은 검증 생략 → 제외).
      // 제목검색 매칭은 오탐 위험이 크고 호출을 배로 늘려 제거함 — 대신 발굴 프롬프트에서 ISBN을 강제한다.
      const b01VerifyViaSeoji = async (candidates, window) => {
        const results = await Promise.all(candidates.map(async (cand) => {
          if (!cand.isbn) return null; // ISBN 없는 후보는 검증 생략(호출·오탐 회피) → 제외
          try {
            const res = await bibApiLimit(() => fetch(SEOJI_API_URL, {
              method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ isbn: cand.isbn, pageSize: 5 }),
            }));
            const data = await res.json();
            const docs = data.docs || [];
            const doc = docs.find(d => normalizeIsbn(d.EA_ISBN) === cand.isbn) || null;
            if (!doc) return null; // SEOJI 미확인 → 제외(할루시네이션 차단)
            const isbn = normalizeIsbn(doc.EA_ISBN || "");
            if (!/^\d{13}$/.test(isbn)) return null;
            const ebookYn = (doc.EBOOK_YN || "").trim().toUpperCase();
            const form = (doc.FORM || "").trim();
            const formDetail = (doc.FORM_DETAIL || "").trim();
            if (ebookYn === "Y" || (form && form !== "종이책")) return null;                 // R-04 전자책·비종이책
            if (formDetail && !B01_ALLOWED_FORM_DETAILS.includes(formDetail)) return null;   // R-04 부적합 제본
            const price = /^\d+$/.test(doc.PRE_PRICE || "") ? doc.PRE_PRICE : "";
            if (price && parseInt(price, 10) >= 50000) return null;                          // R-08 고가
            const pubdate = doc.PUBLISH_PREDATE || doc.REAL_PUBLISH_DATE || "";
            if (window && pubdate) {
              const pd = pubdate.replace(/[^0-9]/g, "").slice(0, 8);
              if (pd.length === 8 && (pd < window.startDate || pd > window.endDate)) return null; // 출간창 밖
            }
            if (/세트|전\d+권/.test(doc.TITLE || "")) return null;
            return {
              title: (doc.TITLE || cand.title).trim(), isbn, formDetail: formDetail || "무선제본",
              pubdate, author: (doc.AUTHOR || cand.author || "").trim(),
              publisher: (doc.PUBLISHER || cand.publisher || "").trim(),
              price, link: "", popnote: cand.popnote || "", source: "그라운딩→SEOJI확정",
            };
          } catch (e) {
            return null;
          }
        }));
        const seen = new Set();
        const confirmed = [];
        results.forEach(r => { if (r && !seen.has(r.isbn)) { seen.add(r.isbn); confirmed.push(r); } });
        return confirmed;
      };

      // B-01 최초 실행 시 후보 풀을 구성해 사용자 메시지에 붙이는 공용 헬퍼:
      // 그라운딩 발굴 → SEOJI 검증확정 → (부족분) SEOJI 출간일 수집 보충.
      const b01CandidatesBlock = async (userText = "") => {
        const window = parseB01PubWindow(userText);
        const discovered = await b01GroundingDiscovery(userText, window);
        let confirmed = discovered.length ? await b01VerifyViaSeoji(discovered, window) : [];
        confirmed = await enrichB01PriceViaNaver(confirmed);
        const need = B01_CANDIDATE_POOL - confirmed.length;
        let supplement = [];
        let seojiPoolCount = 0;
        if (need > 0) {
          const have = new Set(confirmed.map(c => normalizeIsbn(c.isbn)));
          const pool = await fetchB01SeojiCandidates(window, need + 50);
          seojiPoolCount = pool.length;
          supplement = pool
            .filter(c => !have.has(normalizeIsbn(c.isbn)))
            .slice(0, need)
            .map(c => ({ ...c, popnote: "", source: "SEOJI보충" }));
        }
        // degraded(a안): 발굴은 됐는데 SEOJI 검증확정 0건 + 보충 수집 0건이면 SEOJI 전면 무응답으로 간주.
        // (정상이면 넓은 보충 쿼리가 다수 반환하므로 seojiPoolCount 0은 무응답의 강한 신호.) 이때는 SEOJI로
        // 보충을 시도하지 않고 미검증 발굴분만 참고 제공하며, 부족분은 채우지 않고 미달을 정직 보고한다.
        if (discovered.length && confirmed.length === 0 && seojiPoolCount === 0) {
          const degradedRows = discovered.map(c => ({
            title: c.title, isbn: c.isbn, formDetail: "", pubdate: c.pubdate || "",
            author: c.author, publisher: c.publisher, price: "", link: "",
            popnote: c.popnote, source: "그라운딩(미검증)",
          }));
          return formatB01SeojiBlock(degradedRows, { degraded: true });
        }
        return formatB01SeojiBlock([...confirmed, ...supplement]);
      };

      const runDmChain = async (tab, initialState) => {
        let state = initialState;
        while (state.idx < state.targets.length) {
          const targetId = state.targets[state.idx];
          let leafMessages = state.leafMessages;
          if (leafMessages.length === 0) {
            let userMsg = `[${nameFor(tab)} 위임 사항]\n${state.note || "위 지시를 처리해 주세요."}`;
            if (state.idx > 0 && state.prevReply) {
              userMsg += `\n\n[이전 단계 처리 요약 — ${nameFor(state.prevTargetId)}]\n${summarizeReply(state.prevReply)}`;
            }
            userMsg += `\n\n원본 지시: ${state.originalInstruction}`;
            // B-01이 DM 위임으로 처음 실행될 때도, 직접 B-01 탭에서 대화할 때와 동일하게
            // SEOJI 신간 후보 수집을 자동으로 먼저 실행해 결과를 붙여준다 — 그래야 B-01이
            // "수집 결과를 달라"고 되묻지 않고 곧바로 목록 작성을 시작한다.
            if (targetId === "b01-acquisition") {
              userMsg += await b01CandidatesBlock(state.originalInstruction || state.note || "");
            }
            leafMessages = [{ role: "user", content: userMsg }];
          }
          let reply;
          try {
            const leafPrompt = systemPromptFor(targetId) + ORCHESTRATION_HITL_SUFFIX;
            reply = await callApi(leafPrompt, leafMessages);
            // DM 위임 경로도 직접 탭 대화와 동일하게 실데이터 조회·검증(B-03 DB, A-03 예산,
            // D-02 쇼핑, B-02 SEOJI, B-01 ISBN 가드)을 수행한다.
            reply = await resolveLeafSideEffects(targetId, leafPrompt, leafMessages, reply);
          } catch (err) {
            setBAgentMsgs(prev => ({ ...prev, [tab]: [...prev[tab], { role: "assistant", content: "오류가 발생했습니다.\n\n" + err.message, agentId: targetId }] }));
            setDmChains(prev => ({ ...prev, [tab]: { ...state, leafMessages } }));
            return;
          }
          setBAgentMsgs(prev => ({ ...prev, [tab]: [...prev[tab], { role: "assistant", content: reply, agentId: targetId }] }));
          if (/⚠/.test(reply)) {
            setDmChains(prev => ({ ...prev, [tab]: { ...state, leafMessages: [...leafMessages, { role: "assistant", content: reply }] } }));
            return;
          }
          state = { ...state, idx: state.idx + 1, leafMessages: [], prevReply: reply, prevTargetId: targetId };
        }
        setDmChains(prev => { const next = { ...prev }; delete next[tab]; return next; });
      };

      // ══ chief-coordinator 오케스트레이션 루프 (v4 단일 접점) ══════════
      // 홈 콘솔의 chief 채팅 1차 턴 → DISPATCH 파싱 → DM/A-03 순차 실행(DM의 ROUTE는
      // 리프까지 이어서 실행) → 집계 주입 → chief 2차 턴(통합 문서)의 전체 사이클.
      // 지시 1건당 디스패치 사이클은 1회 — 2차 턴의 재-DISPATCH는 무시한다.
      const CHIEF_RESULT_CHAR_LIMIT = 14000; // 집계 주입 시 디스패치별 본문 상한(완성형 산출물 수용)
      const LEAF_RELAY_CHAR_LIMIT = 12000;   // 리프→DM 전달 시 산출물 본문 상한
      const LEAF_MAX_TOKENS = 6000;          // 레버2 — 리프 산출물 1건 초안(콜당 경량화, 120초 천장 여유)
      const DM_MAX_TOKENS = 8000;            // 레버2 — DM 라우팅 판단·리프 산출물 취합
      const CHIEF_COMPILE_MAX_TOKENS = 10000;// 레버2 — chief 통합 문서(재필사 없이 편집)
      const chiefLimit = makeLimiter(3);     // 레버4 — 전체 동시 in-flight ≤3(429 안전선)
      const clipForRelay = (t) => (t && t.length > LEAF_RELAY_CHAR_LIMIT) ? t.slice(0, LEAF_RELAY_CHAR_LIMIT) + "\n…(길이 제한으로 이하 생략)" : (t || "");
      // API 이력: 진행 패널 앵커(kind:"execution")는 제외, 집계 주입(kind:"aggregate")은 포함
      const chiefApiHistory = (msgs) => msgs.filter(m => m.kind !== "execution").map(m => ({ role: m.role, content: m.content }));

      // DM이 ROUTE 블록으로 리프에 위임한 경우: runDmChain과 동일한 순차 실행이되
      // ①진행 상태를 dispatch.leafSteps에 기록 ②⚠에도 멈추지 않음(사람 판단은 escalation으로 구조화)
      // ③CHIEF_DISPATCH_SUFFIX 사용. 취소 시 null 반환.
      const runChiefLeafChain = async (run, dIdx, route, instruction, signal, sync) => {
        const dispatch = run.dispatches[dIdx];
        dispatch.leafSteps = route.targets.map(t => ({ agentId: t, status: "pending", summary: "" }));
        sync();
        // 레버4 — 리프들을 제한적 병렬로 실행(전역 chiefLimit로 총 in-flight ≤3). 계획 모드에서는 각 리프가
        // "(가정)"으로 초안을 완성하므로 이전 리프 산출물을 넘기지 않아도 됨(취합은 DM 단계에서 재조정).
        const runLeaf = async (targetId, i) => {
          if (chiefCancelRef.current) return null;
          dispatch.leafSteps[i].status = "running"; sync();
          let userMsg = `[${nameFor(dispatch.agent)} 위임 사항]\n${route.note || "위 지시를 처리해 주세요."}\n\n원본 지시: ${instruction}`;
          if (targetId === "b01-acquisition") userMsg += await b01CandidatesBlock(instruction);
          const leafMessages = [{ role: "user", content: userMsg }];
          try {
            const leafPrompt = systemPromptFor(targetId) + CHIEF_DISPATCH_SUFFIX;
            let reply = await chiefLimit(() => callApi(leafPrompt, leafMessages, undefined, { signal, max_tokens: LEAF_MAX_TOKENS }));
            reply = await resolveLeafSideEffects(targetId, leafPrompt, leafMessages, reply);
            dispatch.leafSteps[i] = { agentId: targetId, status: "done", summary: summarizeReply(reply) };
            sync();
            return { targetId, reply };
          } catch (err) {
            if (err && err.name === "AbortError") return null;
            dispatch.leafSteps[i] = { agentId: targetId, status: "error", summary: err.message };
            sync();
            return null;
          }
        };
        const settled = await Promise.all(route.targets.map((t, i) => runLeaf(t, i)));
        if (chiefCancelRef.current) return null;
        return settled.filter(Boolean); // 순서 유지(Promise.all), 실패/취소 건 제외
      };

      const cancelChiefRun = () => {
        chiefCancelRef.current = true;
        if (chiefAbortRef.current) chiefAbortRef.current.abort();
      };

      const sendChiefMessage = async (textArg) => {
        const userText = (textArg !== undefined ? textArg : chiefInput).trim();
        if (!userText || chiefLoading) return;
        setChiefInput("");
        setChiefLoading(true);
        chiefCancelRef.current = false;
        const controller = new AbortController();
        chiefAbortRef.current = controller;
        const signal = controller.signal;
        const baseMsgs = [...chiefMsgs, { role: "user", content: userText }];
        setChiefMsgs(baseMsgs);
        const stream = makeStreamHandler(setChiefMsgs);
        let curRun = null, curSync = null; // catch 블록에서 run 상태를 마무리하기 위한 참조
        try {
          // ① chief 1차 턴 — 위임 판단
          const firstReply = await requestApi(
            [{ role: "system", content: buildChiefSystemPrompt() }, ...chiefApiHistory(baseMsgs)],
            0.3, { onChunk: stream.onChunk, signal });
          const dispatchMeta = parseDispatchBlock(firstReply);
          if (!dispatchMeta) { stream.finalize(firstReply); return; } // 위임 불필요 — 일반 답변
          const announce = stripDispatchBlock(firstReply) || "관련 도메인 에이전트에 조회를 시작합니다.";
          stream.finalize(announce);

          // ② run 등록 + 진행 패널 앵커 메시지
          const runId = "run_" + Date.now();
          const run = {
            status: "running",
            scope: dispatchMeta.scope, target_period: dispatchMeta.target_period, event_name: dispatchMeta.event_name,
            self_tasks: dispatchMeta.self_tasks,
            startedAt: new Date().toISOString(),
            dispatches: dispatchMeta.targets.map(t => ({
              agent: t.agent, instruction: t.instruction,
              status: "pending", resultText: "", escalations: [], leafSteps: [],
            })),
          };
          const sync = () => setChiefRuns(prev => ({ ...prev, [runId]: JSON.parse(JSON.stringify(run)) }));
          curRun = run; curSync = sync;
          sync();
          setChiefMsgs(prev => [...prev, { role: "assistant", kind: "execution", runId, content: "" }]);

          // ③ 디스패치 실행 — 레버4: 제한적 병렬(전역 chiefLimit로 총 in-flight ≤3, 429 안전).
          //    오류 난 대상만 error로 표기하고 나머지는 계속 진행.
          const reqJson = {
            requester_agent: "chief-coordinator",
            request_type: run.scope === "event" ? "event_result_request" : "plan_request",
            scope: run.scope,
            ...(run.target_period ? { target_period: run.target_period } : {}),
            ...(run.event_name ? { event_name: run.event_name } : {}),
          };
          const runOneDispatch = async (d, i) => {
            if (chiefCancelRef.current) return;
            d.status = "running"; sync();
            const dmMessages = [{ role: "user", content: `[chief-coordinator 요청]\n${JSON.stringify(reqJson)}\n\n[지시 내용]\n${d.instruction}` }];
            try {
              // DM은 라우터 접미사(리프 실제 호출 강제), A-03 등 비-DM은 산출물 접미사를 붙인다.
              const isDM = !!DM_AGENTS_CONFIG[d.agent];
              const dmPrompt = systemPromptFor(d.agent) + (isDM ? CHIEF_DM_SUFFIX : CHIEF_DISPATCH_SUFFIX);
              let reply = await chiefLimit(() => callApi(dmPrompt, dmMessages, undefined, { signal, max_tokens: DM_MAX_TOKENS }));
              reply = await resolveLeafSideEffects(d.agent, dmPrompt, dmMessages, reply);
              // DM이 리프 위임(ROUTE)을 냈다면 리프까지 실행 후 결과를 DM에 되돌려 취합을 받는다.
              // 디스패치당 ROUTE 1라운드 상한 — DM 2차 응답의 재-ROUTE는 무시(strip)한다.
              const route = isDM ? parseRouteBlock(reply) : null;
              if (route) {
                const leafResults = await runChiefLeafChain(run, i, route, d.instruction, signal, sync);
                if (leafResults === null) return; // 취소됨
                if (leafResults.length) {
                  const followUp = `[리프 산출물]\n${leafResults.map(r => `### ${codeFor(r.targetId)} ${nameFor(r.targetId)}\n${clipForRelay(r.reply)}`).join("\n\n")}\n\n위 리프 산출물을 도메인 계획 상세로 취합하되, 각 산출물 본문을 요약하지 말고 원문 그대로 포함해 응답하십시오. 추가 위임(ROUTE) 없이 취합 결과와 필요 시 escalations 블록만 응답합니다.`;
                  reply = await chiefLimit(() => callApi(dmPrompt, [...dmMessages, { role: "assistant", content: stripRouteBlock(reply) }, { role: "user", content: followUp }], undefined, { signal, max_tokens: DM_MAX_TOKENS }));
                }
                reply = stripRouteBlock(reply);
              }
              d.escalations = parseEscalationsBlock(reply);
              d.resultText = stripEscalationsBlock(reply);
              d.status = "done";
            } catch (err) {
              if (err && err.name === "AbortError") return;
              d.status = "error";
              d.resultText = "수집 실패: " + err.message;
            }
            sync();
          };
          await Promise.all(run.dispatches.map((d, i) => runOneDispatch(d, i)));

          if (chiefCancelRef.current) {
            run.status = "cancelled"; sync();
            setChiefMsgs(prev => [...prev, { role: "assistant", content: "지시 실행을 중단했습니다. 필요하시면 다시 지시해 주세요." }]);
            return;
          }

          // ④ 집계 주입 (UI에서는 접힌 형태로 렌더, API 이력에는 포함)
          run.status = "compiling"; sync();
          const allEscalations = run.dispatches.flatMap(d => d.escalations.map(e => ({ ...e, source_dm: codeFor(d.agent) })));
          const aggregate = [
            "[집계 결과 — 시스템 자동 주입]",
            ...run.dispatches.map(d => {
              const body = (d.resultText || "(응답 없음)");
              const clipped = body.length > CHIEF_RESULT_CHAR_LIMIT ? body.slice(0, CHIEF_RESULT_CHAR_LIMIT) + "\n…(길이 제한으로 이하 생략)" : body;
              return `### ${codeFor(d.agent)} ${nameFor(d.agent)} (${d.status === "done" ? "완료" : "수집 실패"})\n${clipped}`;
            }),
            `### escalations 취합\n${allEscalations.length ? JSON.stringify(allEscalations, null, 1) : "(없음)"}`,
            `### chief 직접 담당 업무\n${run.self_tasks.length ? run.self_tasks.map(s => `- ${s}`).join("\n") : "(없음)"}`,
          ].join("\n\n");
          setChiefMsgs(prev => [...prev, { role: "user", kind: "aggregate", content: aggregate }]);

          // ⑤ chief 2차 턴 — 통합 문서 작성 (스트리밍)
          const convo = [
            ...chiefApiHistory(baseMsgs),
            { role: "assistant", content: announce },
            { role: "user", content: aggregate },
          ];
          const stream2 = makeStreamHandler(setChiefMsgs);
          let finalReply = await requestApi(
            [{ role: "system", content: buildChiefSystemPrompt() }, ...convo],
            0.3, { onChunk: stream2.onChunk, signal, max_tokens: CHIEF_COMPILE_MAX_TOKENS });
          if (DISPATCH_BLOCK_RE.test(finalReply)) {
            finalReply = stripDispatchBlock(finalReply) + "\n\n(추가 위임이 필요하면 새 지시로 요청해 주세요.)";
          }
          stream2.finalize(finalReply);
          run.status = "done"; sync();
        } catch (err) {
          const aborted = (err && err.name === "AbortError") || chiefCancelRef.current;
          if (curRun && curSync) { curRun.status = aborted ? "cancelled" : "error"; curSync(); }
          if (aborted) {
            setChiefMsgs(prev => [...clearStreamingFlags(prev), { role: "assistant", content: "지시 실행을 중단했습니다. 필요하시면 다시 지시해 주세요." }]);
          } else {
            setChiefMsgs(prev => [...clearStreamingFlags(prev), { role: "assistant", content: "오류가 발생했습니다.\n\n" + err.message }]);
          }
        } finally {
          chiefAbortRef.current = null;
          setChiefLoading(false);
        }
      };

      const sendMessage = async (textArg) => {
        const userText = (textArg !== undefined ? textArg : input).trim();
        if (!userText || loading) return;
        setInput("");
        const tab = activeTab;
        const tabIsB = !!configFor(tab);
        const isDmTab = !!DM_AGENTS_CONFIG[tab];
        const currentMsgs = getTabMessages(tab);
        const setter      = tabIsB ? (updater => setBAgentMsgs(prev => ({ ...prev, [tab]: typeof updater === "function" ? updater(prev[tab]) : updater }))) : tab === "planner" ? setPlannerMsgs : tab === "reading-club" ? setClubMsgs : tab === "ll-planner" ? setLlPlannerMsgs : tab === "ll-recruiter" ? setLlRecruiterMsgs : tab === "ll-student-recruiter" ? setLlStudentRecruiterMsgs : tab === "ll-operation-log" ? setLlOperationLogMsgs : tab === "instructor-sourcing" ? setD03Msgs : tab === "d06-mobile-library" ? setD06Msgs : setLlResultReporterMsgs;
        const prompt      = tabIsB ? configFor(tab).systemPrompt : tab === "planner" ? PLANNER_SYSTEM_PROMPT : tab === "reading-club" ? buildClubSystemPrompt(clubType) : tab === "ll-planner" ? LL_PLANNER_SYSTEM_PROMPT : tab === "ll-recruiter" ? LL_RECRUITER_SYSTEM_PROMPT : tab === "ll-student-recruiter" ? LL_STUDENT_RECRUITER_SYSTEM_PROMPT : tab === "ll-operation-log" ? LL_OPERATION_LOG_SYSTEM_PROMPT : tab === "instructor-sourcing" ? D03_SYSTEM_PROMPT : tab === "d06-mobile-library" ? D06_SYSTEM_PROMPT : LL_RESULT_REPORTER_SYSTEM_PROMPT;
        const newMsgs = [...currentMsgs, { role: "user", content: userText }];
        setter(newMsgs);
        setLoading(true);
        let stream = null;
        try {
          const pausedChain = isDmTab ? dmChains[tab] : null;
          if (pausedChain) {
            // 리프가 ⚠로 멈춰 사서 답변을 기다리던 중이었다면, 이번 메시지는 새 DM 지시가 아니라
            // 그 리프와의 대화를 이어가는 답변이다.
            await runDmChain(tab, { ...pausedChain, leafMessages: [...pausedChain.leafMessages, { role: "user", content: userText }] });
          } else {
            // B-01: 이 대화에서 아직 SEOJI 수집 데이터를 받은 적이 없거나, 사서가 재수집을 요청한 경우에만
            // SEOJI 검색 결과를 API 호출용 메시지에만 첨부한다 (화면에 보이는 채팅 로그는 깔끔하게 유지).
            // 과거에는 "수집|후보|신간|찾아|검색" 키워드 매칭으로 트리거했으나, "수서 목록 작성해줘"처럼
            // 키워드가 없는 요청에서는 수집이 누락되어 에이전트가 데이터 대기 상태로 멈추는 문제가 있었다.
            let apiMsgs = newMsgs;
            if (tab === "b01-acquisition") {
              const alreadyCollected = currentMsgs.some(m => typeof m.content === "string" && m.content.includes("[SEOJI 신간 후보 수집 결과"));
              const wantsRecollect = /재수집|다시\s*(수집|검색|찾)/.test(userText);
              if (!alreadyCollected || wantsRecollect) {
                apiMsgs = newMsgs.slice(0, -1).concat({ role: "user", content: userText + await b01CandidatesBlock(userText) });
              }
            }
            stream = makeStreamHandler(setter);
            const reply = await callApi(prompt, apiMsgs, stream.onChunk);
            if (isDmTab) {
              // DM 자신의 응답에 리프 위임(ROUTE) 블록이 있으면, 리프에게 위임했다는 설명만 보여주고 끝내지 않고
              // 즉시 해당 리프를 실행해 실제 산출물까지 이어간다.
              const route = parseRouteBlock(reply);
              const displayReply = route ? stripRouteBlock(reply) : reply;
              stream.finalize(displayReply);
              if (route) {
                await runDmChain(tab, { targets: route.targets, idx: 0, note: route.note, originalInstruction: userText, leafMessages: [], prevReply: null, prevTargetId: null });
              }
            } else {
              // 실데이터 조회 블록(B-03 DB, A-03 예산, D-02 쇼핑, B-02 SEOJI)이 있으면 화면에는
              // 보여주지 않고 프록시 API를 왕복해 최종 답변을 받는다. B-01은 ISBN 검증 가드 적용.
              const finalReply = await resolveLeafSideEffects(tab, prompt, apiMsgs, reply);
              stream.finalize(finalReply);
            }
          }
        } catch (err) {
          if (stream) stream.finalize("오류가 발생했습니다.\n\n" + err.message);
          else setter(prev => [...prev, { role: "assistant", content: "오류가 발생했습니다.\n\n" + err.message }]);
        }
        setTabActivity(prev => ({ ...prev, [tab]: new Date().toISOString() }));
        setLoading(false);
      };

      // 홈 화면 "진행 중인 대화" 카드에서 사서가 정리할 때도 쓸 수 있도록 tab 인자를 받는다(기본값 activeTab).
      const resetCurrent = (tabArg) => {
        const activeTabAtCall = tabArg !== undefined ? tabArg : activeTab;
        const msgs = getTabMessages(activeTabAtCall);
        if (msgs.length > 1) {
          const firstUserMsg = msgs.find(m => m.role === "user");
          const lastAssistantMsg = [...msgs].reverse().find(m => m.role === "assistant");
          const titleSrc = firstUserMsg ? firstUserMsg.content : nameFor(activeTabAtCall);
          const snapshotPlan = {
            id: "chat-" + Date.now(),
            title: titleSrc.length > 26 ? titleSrc.slice(0, 26) + "…" : titleSrc,
            command: firstUserMsg ? firstUserMsg.content : "",
            createdAt: new Date().toISOString(),
            status: "done",
            steps: [{
              agentId: activeTabAtCall, label: nameFor(activeTabAtCall), status: "done",
              summary: summarizeReply(lastAssistantMsg ? lastAssistantMsg.content : ""),
              result: lastAssistantMsg ? lastAssistantMsg.content : "",
              isError: false, messages: msgs,
            }],
          };
          setPlans(prev => [snapshotPlan, ...prev]);
        }
        if (configFor(activeTabAtCall)) {
          const tab = activeTabAtCall;
          setBAgentMsgs(prev => ({ ...prev, [tab]: [{ role: "assistant", content: configFor(tab).init }] }));
          // 대화를 리셋하면 진행 중이던 리프 위임 체인(있다면)도 함께 정리한다 — 그래야 다음 메시지가
          // 옛 체인을 이어받지 않고 새 DM 지시로 취급된다.
          if (DM_AGENTS_CONFIG[tab]) setDmChains(prev => { const next = { ...prev }; delete next[tab]; return next; });
        }
        else if (activeTabAtCall === "planner")           setPlannerMsgs([{ role: "assistant", content: PLANNER_INIT }]);
        else if (activeTabAtCall === "reading-club") setClubMsgs([{ role: "assistant", content: CLUB_INIT }]);
        else if (activeTabAtCall === "ll-planner")           setLlPlannerMsgs([{ role: "assistant", content: LL_PLANNER_INIT }]);
        else if (activeTabAtCall === "ll-recruiter")         setLlRecruiterMsgs([{ role: "assistant", content: LL_RECRUITER_INIT }]);
        else if (activeTabAtCall === "ll-student-recruiter") setLlStudentRecruiterMsgs([{ role: "assistant", content: LL_STUDENT_RECRUITER_INIT }]);
        else if (activeTabAtCall === "ll-operation-log")     setLlOperationLogMsgs([{ role: "assistant", content: LL_OPERATION_LOG_INIT }]);
        else if (activeTabAtCall === "instructor-sourcing")  setD03Msgs([{ role: "assistant", content: D03_INIT }]);
        else if (activeTabAtCall === "d06-mobile-library")   setD06Msgs([{ role: "assistant", content: D06_INIT }]);
        else                                           setLlResultReporterMsgs([{ role: "assistant", content: "안녕하세요! E-05 결과보고 에이전트입니다." }]);
        setTabActivity(prev => { const next = { ...prev }; delete next[activeTabAtCall]; return next; });
        if (activeTabAtCall === activeTab) setInput("");
      };

      const handleKeyDown = (e) => {
