    const PLANNER_SYSTEM_PROMPT = `당신은 한국 공공도서관의 월별 행사 기획 전문가입니다. 도서관 이용자의 연령층과 관심사를 깊이 이해하고, 독서 문화 진흥과 지역사회 참여를 이끌어내는 창의적이고 실현 가능한 행사를 기획하는 것이 당신의 전문 영역입니다.

## 역할 및 책임
당신은 매월 하나의 핵심 주제를 중심으로 도서관 행사 전체 기획안을 작성합니다. 기획은 두 단계로 진행됩니다.

---

## 1단계: 월별 주제 후보군 제시

사용자가 특정 월(또는 다음 달)의 행사 기획을 요청하면, 먼저 **5개의 주제 후보군**을 제시합니다.

### 주제 선정 기준 (세 가지를 균형 있게 반영)
1. **그 달에만 존재하는 기념일**: 국가 기념일, 세계 기념일(UN 지정 등), 한국 고유 절기 및 문화 행사 등
2. **그 달이 가지는 특수한 의미**: 계절적 특성, 학사 일정(개학·방학·수능), 사회적 맥락 등
3. **시대 트렌드 반영 주제**: 최근 사회 이슈, MZ세대 관심사, 환경/기술/문화 트렌드 등

### 주제 후보 제시 형식
각 후보는 다음을 포함해야 합니다:
- **주제명** (간결하고 감각적인 슬로건 형태)
- **선정 근거** (위 세 기준 중 어느 것에 해당하는지, 1~2문장)
- **행사 방향 힌트** (이 주제로 어떤 행사가 가능할지 간략 언급)

후보 제시 후, 사용자에게 하나를 선택해달라고 명확히 요청합니다.

---

## 2단계: 선택된 주제로 행사 기획안 작성

사용자가 주제를 선택하면, 기본적으로 **6개 행사**로 구성된 월간 행사 기획안 전체를 작성합니다.

### 기본 행사 구성 (6개)
1. **어린이 북큐레이션** (1개) — 주제와 연관된 어린이 도서 5~8권 추천 + 큐레이션 설명
2. **성인 북큐레이션** (1개) — 주제와 연관된 성인 도서 5~8권 추천 + 큐레이션 설명
3. **어린이 참여형 행사** (2개) — 어린이가 직접 참여하는 체험·창작·독후 활동 등
4. **성인 참여형 행사** (2개) — 성인이 참여하는 강연·워크숍·토론·만들기 등

### 각 행사 기획서에 포함할 내용
- **행사명**: 창의적이고 직관적인 이름
- **대상**: 연령 및 참여 조건 (예: 초등 저학년, 성인 누구나 등)
- **목적**: 이 행사가 달성하고자 하는 교육적·문화적 목표
- **내용 및 진행 방식**: 구체적인 프로그램 흐름 (시간 배분 포함)
- **장소**: 강의실 1(성인 20명), 강의실 2·3(어린이 각 10명)
- **정원**: 권장 인원
- **소요 예산**: 강사비 ₩100,000/회차(₩50,000/hr×2hr), 재료비 등 항목별 산출
- **준비물 및 필요 자원**
- **홍보 포인트**: 이 행사를 알릴 때 강조할 1~2가지 매력 포인트

### 북큐레이션 도서 추천 기준
- 국내 출판 도서 위주, 최근 5년 내 출판 우선
- 어린이: 그림책, 동화, 어린이 비문학 포함
- 성인: 소설, 에세이, 비문학(인문/과학/사회) 균형
- 각 도서: 제목, 저자, 출판사, 간략 소개(1~2문장), 주제 연관성

---

## 유연한 기획 원칙
- **행사 개수 조정**: "4개만 해줘", "8개로 늘려줘" 등 요청 시 구성 변경
- **대상 조정**: "어린이 위주로", "성인 중심으로" 요청 시 비중 확대
- **유형 조정**: "북큐레이션 없이", "체험 위주로" 등 요청 시 조정
- **주제 직접 지정**: 사용자가 주제를 직접 제시하면 후보 제시 단계 생략 가능
- **부분 재기획**: 특정 행사만 수정 요청 시 해당 행사만 다시 작성

## 출력 형식 규칙
- 전체 기획안은 마크다운 형식으로 작성하여 가독성을 높입니다
- 섹션 구분을 명확히 하고, 표·목록·헤딩을 적극 활용합니다
- 한국어로 작성하며, 공공기관 문서 어투를 유지합니다

## 운영 지침
- 반드시 주제 후보 제시 → 사용자 선택 → 전체 기획 순으로 진행 (사용자가 주제를 직접 제시한 경우 예외)
- 예산·공간·인력을 고려한 실현 가능한 행사를 기획합니다
- 매년 반복되는 뻔한 행사보다 참신한 접근을 추구합니다
- 사용자가 월을 명시하지 않은 경우, 현재 날짜 기준 다음 달을 가정하고 진행 의사를 묻습니다`;

    const PR_SYSTEM_PROMPT = `당신은 한국 공공도서관의 홍보 전문가입니다. 확정된 행사 기획안을 바탕으로 홍보물을 작성합니다.

담당자 표기: 기획업무팀 기획담당
알 수 없는 정보(전화번호, 주소 등)는 반드시 [정보] 형식의 플레이스홀더로 표시합니다.

---

## 홍보물 1: 보도자료
- 배포일, 제목/부제, 리드 문단(육하원칙), 본문(행사 취지·내용·대상·장소·신청방법), 관계자 코멘트(사서/관장 인용 형식), 문의처
- 문체: 격식체, 3인칭 보도 스타일

## 홍보물 2: 홈페이지/인쇄물 포스터
- 이미지 요소 지시문: 배경 이미지, 색상 테마, 그래픽 요소를 구체적으로 묘사
- 헤드라인, 핵심 정보(기간·장소·대상·신청방법·문의처), 텍스트 레이아웃 가이드

## 홍보물 3: SNS(인스타그램)
- 이미지: 1:1 정방형, 포스터와 톤 통일, 핵심 정보만 간결하게 구성
- 캡션: 친근하고 감각적인 문체, 이모지 적절히 사용, 해시태그 포함

## 작업 방식
- 3종 모두 요청: 보도자료 → 포스터 → SNS 순서로 모두 작성
- 특정 매체만 요청: 해당 매체만 작성
- 수정 요청: 해당 부분만 다시 작성
- 기획안에 없는 정보는 임의로 창작하지 않고 [정보] 표시
- 전체 출력은 마크다운 형식으로 가독성 있게 작성`;

    const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

    // ── MarkdownRenderer ──────────────────────────────────────────

    function MarkdownRenderer({ text }) {
      const lines = text.split("\n");
      const elements = [];
      let i = 0;
      let tableBuffer = [];
      let inTable = false;

      const flushTable = () => {
        if (!tableBuffer.length) return;
        const rows = tableBuffer
          .map(r => r.split("|").map(c => c.trim()).filter((_, j, a) => j > 0 && j < a.length - 1))
          .filter(r => !r.every(c => /^[-:]+$/.test(c)));
        elements.push(
          <div key={"t" + elements.length} style={{ overflowX: "auto", margin: "10px 0" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", fontSize: "13px" }}>
              <tbody>
                {rows.map((row, ri) => (
                  <tr key={ri} style={{ background: ri === 0 ? "#e0f2f1" : ri % 2 === 0 ? "#f8f9fa" : "white" }}>
                    {row.map((cell, ci) => {
                      const T = ri === 0 ? "th" : "td";
                      return <T key={ci} style={{ border: "1px solid #b2dfdb", padding: "6px 10px", textAlign: "left", fontWeight: ri === 0 ? "600" : "normal" }}>{cell}</T>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
        tableBuffer = [];
        inTable = false;
      };

      while (i < lines.length) {
        const line = lines[i];
        if (line.trim().startsWith("|") && line.includes("|")) {
          inTable = true;
          tableBuffer.push(line);
          i++;
          continue;
        }
        if (inTable) flushTable();
        const key = "l" + i;
        if (line.startsWith("# ")) {
          elements.push(<h1 key={key} style={{ fontSize: "17px", fontWeight: "700", margin: "14px 0 6px", color: "#004d40", borderBottom: "2px solid #00897b", paddingBottom: "4px" }}>{line.slice(2)}</h1>);
        } else if (line.startsWith("## ")) {
          elements.push(<h2 key={key} style={{ fontSize: "15px", fontWeight: "700", margin: "12px 0 5px", color: "#00695c" }}>{line.slice(3)}</h2>);
        } else if (line.startsWith("### ")) {
          elements.push(<h3 key={key} style={{ fontSize: "14px", fontWeight: "600", margin: "10px 0 4px", color: "#37474f" }}>{line.slice(4)}</h3>);
        } else if (/^[-*]\s/.test(line)) {
          const c = line.replace(/^[-*]\s/, "");
          elements.push(
            <div key={key} style={{ display: "flex", gap: "6px", margin: "2px 0", paddingLeft: "4px" }}>
              <span style={{ color: "#00897b", flexShrink: 0 }}>○</span>
              <span style={{ lineHeight: "1.6" }} dangerouslySetInnerHTML={{ __html: c.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />
            </div>
          );
        } else if (/^\d+\.\s/.test(line)) {
          elements.push(<p key={key} style={{ margin: "2px 0", paddingLeft: "8px", lineHeight: "1.6" }} dangerouslySetInnerHTML={{ __html: line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />);
        } else if (line.startsWith("※")) {
          elements.push(<p key={key} style={{ margin: "4px 0", fontSize: "12px", color: "#666" }}>{line}</p>);
        } else if (line.trim() === "") {
          elements.push(<div key={key} style={{ height: "5px" }} />);
        } else {
          elements.push(<p key={key} style={{ margin: "2px 0", lineHeight: "1.7" }} dangerouslySetInnerHTML={{ __html: line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>") }} />);
        }
        i++;
      }
      if (inTable) flushTable();
      return <div>{elements}</div>;
    }

    // ── TabbedDocument ────────────────────────────────────────────

    function TabbedDocument({ content }) {
      const [activeTab, setActiveTab] = useState("기안문");
      const draftM = content.match(/===기안문시작===([\s\S]*?)===기안문끝===/);
      const attachM = content.match(/===첨부시작===([\s\S]*?)===첨부끝===/);
      const beforeM = content.match(/^([\s\S]*?)===기안문시작===/);
      const afterM = content.match(/===첨부끝===([\s\S]*)$/);
      const draft = draftM ? draftM[1].trim() : null;
      const attach = attachM ? attachM[1].trim() : null;
      const before = beforeM ? beforeM[1].trim() : "";
      const after = afterM ? afterM[1].trim() : "";
      if (!draft && !attach) return <MarkdownRenderer text={content} />;
      const tabs = [];
      if (draft) tabs.push("기안문");
      if (attach) tabs.push("첨부문서");
      return (
        <div>
          {before ? <div style={{ marginBottom: "12px" }}><MarkdownRenderer text={before} /></div> : null}
          <div style={{ border: "1px solid #b2dfdb", borderRadius: "10px", overflow: "hidden" }}>
            <div style={{ display: "flex", background: "#e0f2f1", borderBottom: "1px solid #b2dfdb" }}>
              {tabs.map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{
                  padding: "8px 20px", border: "none",
                  background: activeTab === tab ? "white" : "transparent",
                  color: activeTab === tab ? "#004d40" : "#888",
                  fontWeight: activeTab === tab ? "700" : "400",
                  fontSize: "13px", cursor: "pointer",
                  borderBottom: activeTab === tab ? "2px solid #00897b" : "2px solid transparent",
                  fontFamily: "inherit", marginBottom: "-1px",
                }}>
                  {tab === "기안문" ? "📄 기안문" : "📎 첨부문서"}
                </button>
              ))}
            </div>
            <div style={{ padding: "16px", background: "white" }}>
              {activeTab === "기안문" && draft
                ? <div style={{ fontSize: "13.5px", lineHeight: "2", whiteSpace: "pre-wrap", color: "#1a1a1a" }}>{draft}</div>
                : null}
              {activeTab === "첨부문서" && attach
                ? <MarkdownRenderer text={attach} />
                : null}
            </div>
          </div>
          {after ? <div style={{ marginTop: "12px" }}><MarkdownRenderer text={after} /></div> : null}
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────────────

    function App() {
      const PLANNER_INIT = "안녕하세요! 월별 행사 기획 전문 AI입니다.\n\n기획할 월을 알려주시거나, 좌측의 월 버튼을 눌러 바로 시작하세요.\n\n예시:\n- \"7월 행사를 기획해주세요\"\n- \"어린이 위주로 4개 행사만 기획해줘\"\n- \"주제는 환경으로 바로 기획해줘\"";
      const PR_INIT = "안녕하세요! 홍보물 작성 AI입니다.\n\n**행사 기획** 탭에서 기획안을 완성한 뒤, 입력창 위의 **「기획 확정 → 홍보물 작성」** 버튼을 눌러주세요.\n\n확정된 기획안을 바탕으로 다음 3종을 작성해드립니다:\n- 📰 보도자료\n- 🖼️ 홈페이지/인쇄물 포스터\n- 📱 SNS(인스타그램) 콘텐츠";

      const [activeTab, setActiveTab] = useState("planner");
      const [plannerMsgs, setPlannerMsgs] = useState([{ role: "assistant", content: PLANNER_INIT }]);
      const [prMsgs, setPrMsgs] = useState([{ role: "assistant", content: PR_INIT }]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);

      const bottomRef = useRef(null);
      const textareaRef = useRef(null);

      const messages = activeTab === "planner" ? plannerMsgs : prMsgs;
      const hasPlan = plannerMsgs.some(m => m.role === "user");

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      const callApi = async (sysPrompt, msgs) => {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            max_tokens: 8000,
            messages: [
              { role: "system", content: sysPrompt },
              ...msgs.map(m => ({ role: m.role, content: m.content })),
            ],
          }),
        });
        const rawText = await res.text();
        if (!rawText || !rawText.trim()) throw new Error(`HTTP ${res.status}: 빈 응답이 반환되었습니다. 잠시 후 다시 시도해주세요.`);
        let data;
        try { data = JSON.parse(rawText); } catch { throw new Error(`HTTP ${res.status}: 응답을 파싱할 수 없습니다.`); }
        if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || JSON.stringify(data.error)));
        return data.choices?.[0]?.message?.content ?? "응답을 가져오지 못했습니다.";
      };

      const sendMessage = async (textArg) => {
        const userText = (textArg !== undefined ? textArg : input).trim();
        if (!userText || loading) return;
        setInput("");

        const tab = activeTab;
        const currentMsgs = tab === "planner" ? plannerMsgs : prMsgs;
        const setMsgs = tab === "planner" ? setPlannerMsgs : setPrMsgs;
        const sysPrompt = tab === "planner" ? PLANNER_SYSTEM_PROMPT : PR_SYSTEM_PROMPT;

        const newMsgs = [...currentMsgs, { role: "user", content: userText }];
        setMsgs(newMsgs);
        setLoading(true);

        try {
          const reply = await callApi(sysPrompt, newMsgs);
          setMsgs(prev => [...prev, { role: "assistant", content: reply }]);
        } catch (err) {
          setMsgs(prev => [...prev, { role: "assistant", content: "오류가 발생했습니다.\n\n" + err.message + "\n\nAPI 키를 확인하고 다시 시도해주세요." }]);
        }
        setLoading(false);
      };

      const confirmPlan = async () => {
        if (loading) return;
        const lastAI = [...plannerMsgs].reverse().find(m => m.role === "assistant" && m.content !== PLANNER_INIT);
        if (!lastAI) return;

        const userMsg = `다음 행사 기획안이 확정되었습니다. 홍보물 3종(보도자료, 홈페이지/인쇄물 포스터, SNS 콘텐츠)을 모두 작성해주세요.\n\n---\n${lastAI.content}`;
        setActiveTab("pr");
        const initMsgs = [{ role: "user", content: userMsg }];
        setPrMsgs(initMsgs);
        setLoading(true);

        try {
          const reply = await callApi(PR_SYSTEM_PROMPT, initMsgs);
          setPrMsgs([...initMsgs, { role: "assistant", content: reply }]);
        } catch (err) {
          setPrMsgs([...initMsgs, { role: "assistant", content: "오류가 발생했습니다.\n\n" + err.message }]);
        }
        setLoading(false);
      };

      const resetCurrent = () => {
        if (activeTab === "planner") {
          setPlannerMsgs([{ role: "assistant", content: PLANNER_INIT }]);
        } else {
          setPrMsgs([{ role: "assistant", content: PR_INIT }]);
        }
        setInput("");
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      };

      const sidebarBtn = (label, onClick) => (
        <button onClick={onClick} disabled={loading} key={label}
          style={{
            width: "100%", padding: "9px 12px", marginBottom: "4px",
            background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.15)",
            borderRadius: "8px", color: "rgba(255,255,255,0.85)",
            cursor: loading ? "not-allowed" : "pointer",
            textAlign: "left", fontSize: "12px", fontFamily: "inherit",
          }}
        >{label}</button>
      );

      return (
        <div style={{ display: "flex", height: "100vh", fontFamily: "'Noto Sans KR','Apple SD Gothic Neo',sans-serif", background: "#f0f7f5", fontSize: "14px" }}>

          {/* 사이드바 */}
          <div style={{
            width: "220px", background: "linear-gradient(160deg,#004d40 0%,#00695c 55%,#00897b 100%)",
            display: "flex", flexDirection: "column", flexShrink: 0, boxShadow: "2px 0 12px rgba(0,0,0,0.15)",
          }}>
            <div style={{ padding: "24px 16px 20px", borderBottom: "1px solid rgba(255,255,255,0.1)" }}>
              <div style={{ fontSize: "10px", color: "rgba(255,255,255,0.45)", letterSpacing: "2px", marginBottom: "6px" }}>LIBRARY AI</div>
              <div style={{ fontSize: "15px", fontWeight: "700", color: "white", lineHeight: "1.4" }}>월별 행사<br />기획 에이전트</div>
              <div style={{ fontSize: "11px", color: "rgba(255,255,255,0.5)", marginTop: "6px" }}>기획 · 홍보물 작성</div>
            </div>

            <div style={{ padding: "12px 8px", flex: 1, overflowY: "auto" }}>
              {activeTab === "planner" ? (
                <>
                  <div style={{ fontSize: "10px", color: "rgba(255,255,255,0.4)", letterSpacing: "1px", padding: "0 6px", marginBottom: "8px" }}>빠른 시작</div>
                  {sidebarBtn("이번 달 기획", () => sendMessage("이번 달 행사를 기획해주세요."))}
                  {sidebarBtn("다음 달 기획", () => sendMessage("다음 달 행사를 기획해주세요."))}
                  <div style={{ fontSize: "10px", color: "rgba(255,255,255,0.4)", letterSpacing: "1px", padding: "10px 6px 6px" }}>월 선택</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "4px", padding: "0 2px" }}>
                    {MONTHS.map(m => (
                      <button key={m} onClick={() => sendMessage(m + " 행사를 기획해주세요.")} disabled={loading}
                        style={{
                          padding: "7px 4px", background: "rgba(255,255,255,0.08)",
                          border: "1px solid rgba(255,255,255,0.12)", borderRadius: "6px",
                          color: "rgba(255,255,255,0.75)", cursor: loading ? "not-allowed" : "pointer",
                          fontSize: "11px", fontFamily: "inherit", textAlign: "center",
                        }}
                      >{m}</button>
                    ))}
                  </div>
                </>
              ) : (
                <>
                  <div style={{ fontSize: "10px", color: "rgba(255,255,255,0.4)", letterSpacing: "1px", padding: "0 6px", marginBottom: "8px" }}>홍보물 선택</div>
                  {sidebarBtn("📰 보도자료만", () => sendMessage("보도자료만 작성해주세요."))}
                  {sidebarBtn("🖼️ 포스터만", () => sendMessage("홈페이지/인쇄물 포스터만 작성해주세요."))}
                  {sidebarBtn("📱 SNS만", () => sendMessage("SNS(인스타그램) 콘텐츠만 작성해주세요."))}
                  {sidebarBtn("✨ 3종 모두", () => sendMessage("홍보물 3종을 모두 작성해주세요."))}
                </>
              )}
            </div>

            <div style={{ padding: "12px 8px", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
              <button onClick={resetCurrent}
                style={{
                  width: "100%", padding: "8px", background: "rgba(255,255,255,0.07)",
                  border: "1px solid rgba(255,255,255,0.15)", borderRadius: "8px",
                  color: "rgba(255,255,255,0.6)", cursor: "pointer", fontSize: "12px", fontFamily: "inherit",
                }}
              >↺ 현재 탭 초기화</button>
            </div>
          </div>

          {/* 메인 영역 */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

            {/* 탭 바 */}
            <div style={{ display: "flex", background: "white", borderBottom: "1px solid #d0ebe8", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              {[
                { id: "planner", icon: "📅", label: "행사 기획" },
                { id: "pr",      icon: "📢", label: "홍보물 작성" },
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  style={{
                    padding: "14px 24px", border: "none", background: "transparent",
                    borderBottom: activeTab === tab.id ? "2px solid #00897b" : "2px solid transparent",
                    color: activeTab === tab.id ? "#004d40" : "#999",
                    fontWeight: activeTab === tab.id ? "700" : "400",
                    fontSize: "14px", cursor: "pointer", fontFamily: "inherit",
                    display: "flex", alignItems: "center", gap: "6px",
                  }}
                >
                  {tab.icon} {tab.label}
                  {tab.id === "pr" && hasPlan && (
                    <span style={{ fontSize: "10px", background: "#00897b", color: "white", borderRadius: "10px", padding: "1px 7px", marginLeft: "2px" }}>
                      준비됨
                    </span>
                  )}
                </button>
              ))}
            </div>

            {/* 메시지 영역 */}
            <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px", display: "flex", flexDirection: "column", gap: "16px" }}>
              {messages.map((msg, i) => (
                <div key={i} style={{ display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start", alignItems: "flex-start", gap: "10px" }}>
                  {msg.role === "assistant" && (
                    <div style={{
                      width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0,
                      background: activeTab === "planner"
                        ? "linear-gradient(135deg,#004d40,#00897b)"
                        : "linear-gradient(135deg,#5c35a0,#7b52cc)",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: "11px", color: "white", fontWeight: "700",
                    }}>{activeTab === "planner" ? "기획" : "PR"}</div>
                  )}
                  <div style={{
                    maxWidth: "75%",
                    padding: msg.role === "user" ? "10px 14px" : "14px 16px",
                    borderRadius: msg.role === "user" ? "18px 4px 18px 18px" : "4px 18px 18px 18px",
                    background: msg.role === "user" ? "linear-gradient(135deg,#00897b,#004d40)" : "white",
                    color: msg.role === "user" ? "white" : "#2d3748",
                    boxShadow: "0 2px 8px rgba(0,0,0,0.08)",
                    lineHeight: "1.7", fontSize: "13.5px",
                  }}>
                    {msg.role === "assistant"
                      ? ((msg.content.includes("===기안문시작===") || msg.content.includes("===첨부시작==="))
                          ? <TabbedDocument content={msg.content} />
                          : <MarkdownRenderer text={msg.content} />)
                      : <span style={{ whiteSpace: "pre-wrap" }}>{msg.content}</span>}
                  </div>
                  {msg.role === "user" && (
                    <div style={{
                      width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0,
                      background: "#e0f2f1", display: "flex", alignItems: "center",
                      justifyContent: "center", fontSize: "14px", color: "#00695c", fontWeight: "700",
                    }}>나</div>
                  )}
                </div>
              ))}

              {loading && (
                <div style={{ display: "flex", alignItems: "flex-start", gap: "10px" }}>
                  <div style={{
                    width: "32px", height: "32px", borderRadius: "50%",
                    background: activeTab === "planner"
                      ? "linear-gradient(135deg,#004d40,#00897b)"
                      : "linear-gradient(135deg,#5c35a0,#7b52cc)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: "11px", color: "white", fontWeight: "700",
                  }}>{activeTab === "planner" ? "기획" : "PR"}</div>
                  <div style={{
                    padding: "14px 18px", borderRadius: "4px 18px 18px 18px",
                    background: "white", boxShadow: "0 2px 8px rgba(0,0,0,0.08)",
                    display: "flex", gap: "5px", alignItems: "center",
                  }}>
                    {[0,1,2].map(n => (
                      <div key={n} style={{
                        width: "7px", height: "7px", borderRadius: "50%", background: "#00897b",
                        opacity: 0.6, animation: "bounce 1.2s infinite", animationDelay: (n * 0.2) + "s",
                      }} />
                    ))}
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>

            {/* 입력 영역 */}
            <div style={{ padding: "8px 24px 16px", background: "white", borderTop: "1px solid #d0ebe8" }}>
              {activeTab === "planner" && hasPlan && (
                <button onClick={confirmPlan} disabled={loading}
                  style={{
                    width: "100%", padding: "10px", marginBottom: "8px",
                    background: loading ? "#b2dfdb" : "linear-gradient(135deg,#5c35a0,#7b52cc)",
                    border: "none", borderRadius: "10px", color: "white",
                    fontSize: "13px", fontWeight: "700", cursor: loading ? "not-allowed" : "pointer",
                    fontFamily: "inherit", letterSpacing: "0.3px",
                  }}
                >
                  기획 확정 → 홍보물 작성하기
                </button>
              )}
              <div style={{
                display: "flex", gap: "8px", alignItems: "flex-end",
                background: "#f0f7f5", borderRadius: "14px", padding: "8px",
                border: "1px solid #b2dfdb",
              }}>
                <textarea
                  ref={textareaRef}
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder={activeTab === "planner"
                    ? "기획할 월이나 요청을 입력하세요... (Shift+Enter: 줄바꿈)"
                    : "홍보물 수정 요청을 입력하세요... (Shift+Enter: 줄바꿈)"}
                  rows={1}
                  style={{
                    flex: 1, border: "none", background: "transparent", resize: "none",
                    outline: "none", fontSize: "14px", lineHeight: "1.6",
                    fontFamily: "inherit", color: "#2d3748", maxHeight: "120px", overflowY: "auto",
                  }}
                />
                <button
                  onClick={() => sendMessage()}
                  disabled={loading || !input.trim()}
                  style={{
                    width: "36px", height: "36px", borderRadius: "10px", border: "none",
                    background: (loading || !input.trim()) ? "#b2dfdb" : "linear-gradient(135deg,#00897b,#004d40)",
                    color: "white",
                    cursor: (loading || !input.trim()) ? "not-allowed" : "pointer",
                    fontSize: "15px", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                  }}
                >▶</button>
              </div>
              <div style={{ fontSize: "11px", color: "#aaa", marginTop: "5px", textAlign: "center" }}>
                {activeTab === "planner"
                  ? "Enter 전송 · Shift+Enter 줄바꿈 · 행사 개수나 방향을 자유롭게 요청하세요"
                  : "Enter 전송 · Shift+Enter 줄바꿈 · 특정 매체 수정을 요청하세요"}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
